<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Farmyard · Set-up</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="farmyard.css">
<link rel="stylesheet" href="barn.css">
<script src="fy-clucks.js"></script>
<style>
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;width:min(100%,860px);align-items:start}
.setup .col{display:flex;flex-direction:column;gap:18px;min-width:0}
.setup .tube{display:flex;flex-direction:column;gap:16px;padding:20px;box-sizing:border-box}
.setup label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fy-text-label)}
.setup label .t{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fy-text)}
.setup label .t i{font-size:20px;color:var(--neon-teal)}
.me-card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 18px;box-sizing:border-box}
.me-card .big{width:150px;height:150px;border:3px solid var(--neon-pink-tube);box-shadow:var(--glow-pink);background-size:92%}
.me-card .big i{font-size:40px;color:var(--fy-text-label)}
.me-card .nm{font-family:var(--font-heading);font-size:26px;letter-spacing:-.01em;text-align:center;overflow-wrap:anywhere;color:var(--fy-text)}
.me-card .uses{display:flex;flex-direction:column;gap:6px;width:100%;font-size:12px;color:var(--fy-text-label)}
.me-card .uses span{display:flex;gap:8px;align-items:center}
.me-card .uses i{color:var(--neon-teal)}
.logos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;min-height:44px;background:transparent;border:1.5px solid transparent;border-radius:10px;cursor:pointer;color:var(--fy-text);font-family:inherit;font-size:11px}
.logo .face{width:52px;height:52px;border:1.5px solid var(--neon-teal)}
.logo .face i{color:var(--fy-text-label);font-size:18px}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.logo.on{border-color:var(--neon-pink-tube);box-shadow:var(--glow-pink)}
.logo:hover{border-color:var(--rule-teal)}
.revwrap{display:flex;align-items:stretch;border:1px solid var(--neon-teal);border-radius:8px;overflow:hidden;min-height:44px}
.revwrap.bad{border-color:var(--neon-red-tube)}
.revwrap .pre{display:grid;place-items:center;padding:0 10px;font-size:14px;color:var(--fy-text-label);border-right:1px solid var(--rule-teal);white-space:nowrap}
.revwrap input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fy-text);font:inherit;font-size:15px;padding:0 10px;box-shadow:none}
.linked{display:flex;gap:12px;align-items:center}
.linked>i{font-size:22px;color:var(--neon-teal);flex:none}
.linked .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.linked .mid span:first-child{font-size:14px;color:var(--fy-text)}
.linked .mid span:last-child{font-size:12px;color:var(--fy-text-label)}
</style>
</head>
<body>
<div id="app"><main class="door"><p class="muted">Loading…</p></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="app.js"></script><script src="barn.js"></script>
<script>
/* 0.2 New User Set-up. Shown once, right after the invite is claimed (and to anyone whose set-up is not done).
   Yard name is pre-filled with the name RAY gave the member; the logo palette is what RAY uploaded for them
   (fy.icon_palette, the 15 slots of the animal they hold; stock animals stand in until an admin uploads some); Revolut is optional. Chess.com stays hidden until the
   chess league is built. Birthday (day and month, no year) is required. Finishing stamps member.setup_at. */
/* Birthday field, ported from the 0.2 design. Days are capped by the month (February = 29). A day past the
   newly picked month's last day is dropped, so the Day select goes back to "Day" and Finish stays off. */
const BD = {
  M: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
  DIM: [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31],
  max: m => m ? BD.DIM[+m - 1] : 31,
  fit: (d, m) => d && +d <= BD.max(m) ? String(d) : '',
  ok: (d, m) => !!m && !!d && +d <= BD.max(m),
  dayOpts: (d, m) => `<option value="" disabled ${d ? '' : 'selected'}>Day</option>` +
    Array.from({ length: BD.max(m) }, (_, i) => { const v = String(i + 1); return `<option value="${v}" ${v === d ? 'selected' : ''}>${v}</option>`; }).join(''),
  monthOpts: m => `<option value="" disabled ${m ? '' : 'selected'}>Month</option>` +
    BD.M.map((n, i) => { const v = String(i + 1); return `<option value="${v}" ${v === m ? 'selected' : ''}>${n}</option>`; }).join(''),
  border: ok => ok ? 'var(--neon-teal)' : 'var(--neon-pink-tube)',
  hint: ok => ok ? 'Day and month only. It goes on the Barn calendar so the crew can celebrate.' : 'Needed to get in. Day and month only, no year.',
  hintColor: ok => ok ? 'var(--fy-text-label)' : 'var(--neon-pink-text)'
};
(async function () {
  const B = await Barn.open('setup', { bare: true }); if (!B) return;
  const { me, session, root } = B, esc = FY.esc;
  const ANIMALS = [['hen', 'Hen'], ['cock', 'Cock'], ['pig', 'Pig'], ['sheep', 'Sheep'], ['goat', 'Goat'], ['cow', 'Cow']];
  // The 15 slots belong to the animal this member holds (icons-per-character.sql). No animal yet, no slots.
  const mine = me.character_id
    ? await FY.q('icon_palette').select('slot,url').eq('character_id', me.character_id).order('slot').then(r => r.data || [], () => [])
    : [];
  // Only slots with a picture are listed; until the first upload the stock animals stand in so a pick still exists.
  const palette = mine.length ? mine.map(l => ({ id: 'slot:' + l.slot, name: 'Icon ' + l.slot, img: l.url, sm: l.url, url: l.url }))
                             : ANIMALS.map(([k, n]) => ({ id: 'key:' + k, name: n, img: FY.face(k, 150), sm: FY.face(k, 48) }));
  const S = { name: me.nickname, pick: (mine.find(l => l.url === me.avatar_url) ? 'slot:' + mine.find(l => l.url === me.avatar_url).slot : null) || (me.avatar_url ? 'url:' + me.avatar_url : 'key:' + me.avatar), rev: (me.revolut_url || '').replace(/^https:\/\/revolut\.me\//, ''),
              bm: me.birth_month ? String(me.birth_month) : '', bd: '' };
  S.bd = BD.fit(me.birth_day, S.bm);
  if (!palette.some(p => p.id === S.pick)) S.pick = palette[0].id;   // the big card shows the first listed icon, so that is the pick
  const isRevBad = () => { const r = S.rev.trim(); return !!r && !/^[A-Za-z0-9._-]+$/.test(r); };
  const cantFinish = () => !S.name.trim() || isRevBad() || !BD.ok(S.bd, S.bm);

  function render() {
    const cur = palette.find(p => p.id === S.pick) || palette[0];
    const revBad = isRevBad(), cant = cantFinish(), bdOk = BD.ok(S.bd, S.bm), bdB = BD.border(bdOk);
    root.innerHTML = `<main class="door top">
      <div class="steps3"><div class="done"><span class="n"><i class="ph ph-check" style="font-size:14px"></i></span>Signed in</div><div class="now"><span class="n">2</span>Your profile</div><div><span class="n">3</span>Into the yard</div></div>
      <div class="centre"><span class="kicker">Discord's done. Now you.</span><h1 style="font-size:clamp(30px,6vw,46px)">What does Hank call you?</h1></div>
      <form id="f" class="setup">
        <div class="neon-tube-teal me-card">
          <span class="kicker">How the yard sees you</span>
          <div class="face big" role="img" aria-label="Your character" style="background-image:${cur.img ? `url('${esc(cur.img)}')` : 'none'}">${cur.img ? '' : '<i class="ph ph-question"></i>'}</div>
          <div class="nm">${esc(S.name.trim() || 'Your name')}</div>
          <div class="uses"><span><i class="ph ph-users-three"></i>Members list and Lounge</span><span><i class="ph ph-club"></i>Your poker seat and league board</span></div>
        </div>
        <div class="col">
          <div class="neon-tube-teal tube">
            <label>Yard name<input class="input" id="name" value="${esc(S.name)}" maxlength="16" required style="min-height:46px;font-size:16px"><span>Auto Generated. Keep it or change it. 16 characters max.</span></label>
            <label><span class="t"><i class="ph ph-cake" style="color:var(--neon-pink-text);font-size:18px"></i>Birthday <span style="font-size:11px;color:var(--neon-pink-text)">Required</span></span>
              <span style="display:flex;gap:8px"><select id="bdDay" class="input" required aria-label="Day" style="min-height:46px;font-size:15px;border-color:${bdB};flex:0 0 92px">${BD.dayOpts(S.bd, S.bm)}</select><select id="bdMonth" class="input" required aria-label="Month" style="min-height:46px;font-size:15px;border-color:${bdB};flex:1">${BD.monthOpts(S.bm)}</select></span>
              <span id="bdHint" style="color:${BD.hintColor(bdOk)}">${BD.hint(bdOk)}</span></label>
            <div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:12px;color:var(--fy-text-label)">Pick your icon</span>
              <div class="logos">${palette.map(p => `<button type="button" class="logo ${p.id === S.pick ? 'on' : ''}" data-pick="${esc(p.id)}" aria-label="${esc(p.name)}"><span class="face" style="background-image:url('${esc(p.sm)}')"></span></button>`).join('')}</div></div>
          </div>
          <div class="neon-tube-teal tube" style="gap:14px">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="kicker">Linked accounts</span><span style="font-size:12px;color:var(--fy-text-label)">Optional. Add later in Profile.</span></div>
            <div class="linked"><i class="ph ph-discord-logo"></i><div class="mid"><span>Discord</span><span>Signed in as ${esc(Barn.discordName(session))}. Lounge voice works.</span></div><span class="neon-teal" style="font-size:12px;white-space:nowrap">Connected</span></div>
            <div class="rule"></div>
            <label><span class="t"><i class="ph ph-hand-coins"></i>Revolut pay-me link</span>
              <div class="revwrap ${revBad ? 'bad' : ''}"><span class="pre">revolut.me/</span><input id="rev" value="${esc(S.rev)}" placeholder="yourname" autocomplete="off"></div>
              <span style="color:${revBad ? 'var(--neon-red-text)' : 'var(--fy-text-label)'}">${revBad ? 'Letters, numbers, dots, dashes and underscores only.' : 'So people can pay you after poker. Settle up uses this link.'}</span></label>
            <div class="linked" style="opacity:.55"><i class="ph ph-game-controller"></i><div class="mid"><span>Steam ID</span><span>For Worms and other Steam lobbies in the Arcade.</span></div><span class="kicker" style="white-space:nowrap">Coming soon</span></div>
            <div class="linked" style="opacity:.55"><i class="ph ph-spotify-logo"></i><div class="mid"><span>Spotify</span><span>Lets you queue tracks on the Jukebox.</span></div><span class="kicker" style="white-space:nowrap">Coming soon</span></div>
            <div class="linked" style="opacity:.55"><i class="ph ph-strategy"></i><div class="mid"><span>Chess.com username</span><span>Your games count towards the chess league.</span></div><span class="kicker" style="white-space:nowrap">Coming soon</span></div>
          </div>
          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <button type="submit" id="go" class="btn btn-primary" style="min-height:48px;padding:0 28px;font-size:15px" ${cant ? 'disabled' : ''}>Into the yard<i class="ph ph-arrow-right"></i></button>
            <span style="font-size:12px;color:var(--fy-text-label)">You can change any of this later in Profile.</span>
          </div>
        </div>
      </form></main>`;
  }
  render();
  // Re-render only on blur / click, so typing is never interrupted; live bits update in place.
  root.addEventListener('input', ev => {
    if (ev.target.id === 'name') { S.name = ev.target.value; root.querySelector('.me-card .nm').textContent = S.name.trim() || 'Your name'; root.querySelector('#go').disabled = cantFinish(); }
    if (ev.target.id === 'rev') { S.rev = ev.target.value.replace(/^https?:\/\/(www\.)?revolut\.me\//, ''); if (S.rev !== ev.target.value) ev.target.value = S.rev; root.querySelector('.revwrap').classList.toggle('bad', isRevBad()); root.querySelector('#go').disabled = cantFinish(); }
  });
  // Birthday selects update in place: a month change rebuilds the day list to that month's length.
  root.addEventListener('change', ev => {
    if (ev.target.id === 'bdMonth') { S.bm = ev.target.value; S.bd = BD.fit(S.bd, S.bm); root.querySelector('#bdDay').innerHTML = BD.dayOpts(S.bd, S.bm); }
    else if (ev.target.id === 'bdDay') S.bd = ev.target.value;
    else return;
    const ok = BD.ok(S.bd, S.bm), hint = root.querySelector('#bdHint');
    root.querySelectorAll('#bdDay, #bdMonth').forEach(el => { el.style.borderColor = BD.border(ok); });
    hint.textContent = BD.hint(ok); hint.style.color = BD.hintColor(ok);
    root.querySelector('#go').disabled = cantFinish();
  });
  root.addEventListener('click', ev => { const b = ev.target.closest('[data-pick]'); if (b) { S.pick = b.dataset.pick; render(); } });
  root.addEventListener('submit', async ev => {
    ev.preventDefault();
    const name = S.name.trim(); if (cantFinish()) return;
    const btn = root.querySelector('#go'); btn.disabled = true;
    const patch = { nickname: name, birth_day: +S.bd, birth_month: +S.bm, setup_at: new Date().toISOString() };
    if (S.pick.startsWith('key:')) { patch.avatar = S.pick.slice(4); patch.avatar_url = null; }
    if (S.pick.startsWith('slot:')) { try { await FY.rpc('set_my_icon', { p_slot: Number(S.pick.slice(5)) }); } catch (e) { FY.toast(e.message); btn.disabled = false; return; } }
    const { error } = await FY.q('member').update(patch).eq('id', me.id);
    if (error) { FY.toast(/unique|duplicate/i.test(error.message) ? 'That yard name is taken. Pick another.' : error.message); btn.disabled = false; return; }
    // Linked accounts live in fy.member_link; set_my_links also syncs member.revolut_url.
    try {
      await FY.rpc('set_my_links', { p_links: S.rev.trim() ? [{ provider: 'revolut', handle: `https://revolut.me/${S.rev.trim()}`, enabled: true }] : [] });
    } catch (e) { FY.toast(e.message); btn.disabled = false; return; }
    location.replace('dashboard.html');
  });
})().catch(e => FY.toast(e.message));
</script>
</body>
</html>
