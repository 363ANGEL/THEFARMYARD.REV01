<style>
/* 4.0 The Humidor · Admin (leader), ported from P15.003 HUMIDOR ADMIN.dc.html.
   No page-local tokens: the design's --text-*, --hint-text and --color-neutral-100 come from humidor.css,
   --color-neutral-600 from barn.css. */
.ha{display:flex;flex-direction:column;gap:18px;min-width:0}
.ha section{display:flex;flex-direction:column;gap:10px;min-width:0}
.ha section[hidden],.ha [hidden]{display:none}
.ha h2.ha-h{margin:0;font-size:var(--text-card-title);font-weight:500;color:var(--fy-text);text-wrap:balance}
.ha-k{font-size:var(--text-kicker);letter-spacing:.08em;text-transform:uppercase;color:var(--neon-teal)}
.ha-meta{font-size:var(--text-meta);color:var(--fy-text-label)}
.ha-num{font-variant-numeric:tabular-nums}
.ha-hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 14px}

/* Notices: pending payments */
.ha-notes{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:2px solid var(--neon-pink-tube);border-radius:10px;box-shadow:var(--glow-pink);background:var(--fy-bg)}
.ha-notes .t{font-size:var(--text-kicker);letter-spacing:.08em;text-transform:uppercase;color:var(--neon-pink-text);text-shadow:var(--text-glow-pink)}
.ha-note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;min-height:44px;border-top:1px solid color-mix(in srgb,var(--neon-teal) 20%,transparent)}
.ha-note .x{flex:1 1 220px;min-width:0;font-size:var(--text-ui);color:var(--fy-text-body);overflow-wrap:anywhere}
.ha-note .x span{color:var(--fy-text-label);font-size:var(--text-meta);white-space:nowrap}
.ha-ok{min-height:44px;padding:0 14px;border-radius:19px;background:transparent;cursor:pointer;font-size:var(--text-kicker);letter-spacing:.08em;font-weight:600;border:1px solid var(--neon-green-text);color:var(--neon-green-text);white-space:nowrap}

/* Landing page stage: radio cards (R6, league-wide pin) */
.ha-stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.ha-st{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:56px;padding:10px 12px;border-radius:10px;background:var(--fy-bg);cursor:pointer;text-align:left;border:1px solid color-mix(in srgb,var(--neon-teal) 35%,transparent);box-shadow:none;color:inherit}
.ha-st.lit{background:color-mix(in srgb,var(--neon-teal) 8%,transparent)}
.ha-st[aria-checked="true"]{border:2px solid var(--neon-teal);box-shadow:var(--glow-teal)}
.ha-st:hover{border-color:var(--hint-text)}
.ha-st .n{font-size:var(--text-kicker);letter-spacing:.08em;font-weight:600;color:var(--neon-teal);font-variant-numeric:tabular-nums}
.ha-st .l{font-size:var(--text-ui);font-weight:500;color:var(--fy-text-secondary)}
.ha-st.lit .l,.ha-st[aria-checked="true"] .l{color:var(--color-neutral-100)}

/* 1 · Round: action buttons */
.ha-acts{display:flex;flex-wrap:wrap;gap:8px}
.ha-act{min-height:44px;padding:0 18px;border-radius:19px;background:transparent;cursor:pointer;font-size:var(--text-meta);letter-spacing:.08em;font-weight:600;border:2px solid var(--neon-teal);color:var(--hint-text);box-shadow:none}
.ha-act.pink{border-color:var(--neon-pink-tube);color:var(--neon-pink-text);box-shadow:var(--glow-pink)}
.ha-act:disabled{opacity:.5;cursor:default}
.ha-moved{margin:0;font-size:var(--text-small);line-height:1.45;color:var(--neon-amber-text)}

/* Who's voted: scrolls sideways below 640px with the member column fixed */
.ha-voted{display:flex;flex-direction:column;gap:8px;margin-top:4px;min-width:0}
.ha-empty{font-size:var(--text-small);color:var(--fy-text-label);padding:12px 14px;border:1px dashed color-mix(in srgb,var(--neon-teal) 50%,transparent);border-radius:10px}
.ha-scroll{overflow-x:auto;border:1px solid color-mix(in srgb,var(--neon-teal) 50%,transparent);border-radius:10px;background:var(--fy-bg)}
.ha-scroll:focus-visible{outline:2px solid var(--neon-teal);outline-offset:2px}
.ha-vt{width:100%;border-collapse:collapse;min-width:640px}
.ha-vt thead th{text-align:left;padding:8px 12px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--neon-teal);border-bottom:1px solid color-mix(in srgb,var(--neon-teal) 35%,transparent);white-space:nowrap}
.ha-vt .stick{position:sticky;left:0;z-index:1;background:var(--fy-bg)}
.ha-vt tbody th{text-align:left;padding:9px 12px;border-bottom:1px solid color-mix(in srgb,var(--neon-teal) 15%,transparent);font-weight:400;white-space:nowrap}
.ha-vt tbody th .nm{display:block;font-size:var(--text-ui);font-weight:500;color:var(--color-neutral-100)}
.ha-vt tbody th .ago{display:block;font-size:var(--text-kicker);color:var(--fy-text-label)}
.ha-vt td{padding:9px 12px;border-bottom:1px solid color-mix(in srgb,var(--neon-teal) 15%,transparent);font-size:var(--text-small);line-height:1.35;color:var(--neon-pink-text);vertical-align:top}
.ha-vt td.none{color:var(--color-neutral-600)}

/* 2 · Tally board */
.ha-tb{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--neon-teal);border-radius:10px;box-shadow:var(--glow-teal);background:var(--fy-bg);min-width:0}
.ha-tbx{overflow-x:auto}
.ha-tt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:520px}
.ha-tt thead th{text-align:center;padding:6px 8px;border-bottom:1px solid color-mix(in srgb,var(--neon-teal) 35%,transparent)}
.ha-tt thead th:first-child{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--fy-text-label)}
.ha-tt .cn{display:block;font-size:var(--text-small);font-weight:500;color:var(--fy-text-body)}
.ha-tt .cn.top{color:var(--neon-pink-text)}
.ha-tt .sm{display:block;font-size:var(--text-kicker);font-weight:400;color:var(--fy-text-label)}
.ha-tt tbody th{text-align:left;padding:7px 8px;border-bottom:1px solid color-mix(in srgb,var(--neon-teal) 15%,transparent);font-weight:400}
.ha-tt tbody th .nm{display:block;font-size:var(--text-small);color:var(--color-neutral-100)}
.ha-tt tbody td{text-align:center;padding:7px 8px;border-bottom:1px solid color-mix(in srgb,var(--neon-teal) 15%,transparent)}
.ha-tt .mk{display:block;font-size:var(--text-ui);font-weight:600;color:var(--neon-red-text)}
.ha-tt .mk.ok{color:var(--neon-green-text)}
.ha-tt tfoot th{text-align:left;padding:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--neon-teal)}
.ha-tt tfoot td{text-align:center;padding:8px}
.ha-tt .fit{display:block;font-size:var(--text-card-title);font-weight:500;color:var(--color-neutral-100)}
.ha-tt .fit.top{color:var(--neon-pink-text)}

/* 2 · Vote summary */
.ha-ws{display:flex;flex-direction:column;gap:12px}
.ha-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.ha-stat{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--neon-teal) 50%,transparent);border-radius:10px;background:var(--fy-bg)}
.ha-stat .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--neon-teal)}
.ha-stat .v{font-size:24px;font-weight:500;line-height:1.1;color:var(--color-neutral-100);font-variant-numeric:tabular-nums}
.ha-dims{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.ha-dim{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--neon-teal) 35%,transparent);border-radius:10px;background:var(--fy-bg);min-width:0}
.ha-dim .dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ha-dim .dh .s{font-size:var(--text-kicker);color:var(--fy-text-label);font-variant-numeric:tabular-nums;white-space:nowrap}
.ha-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:baseline}
.ha-bar .v{font-size:var(--text-small);color:var(--fy-text-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ha-bar.top .v{color:var(--neon-pink-text)}
.ha-bar .c{font-size:var(--text-meta);color:var(--fy-text-secondary);font-variant-numeric:tabular-nums;white-space:nowrap}
.ha-bar .trk{grid-column:1/-1;height:4px;border-radius:2px;background:color-mix(in srgb,var(--neon-teal) 15%,transparent);overflow:hidden}
.ha-bar .fl{height:100%;background:color-mix(in srgb,var(--neon-teal) 60%,transparent)}
.ha-bar.top .fl{background:var(--neon-pink-tube)}

/* 2 · Likely selection */
.ha-lk{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:2px solid var(--neon-teal);border-radius:10px;box-shadow:var(--glow-teal);background:var(--fy-bg)}
.ha-lk .nmrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ha-lk .nm{font-size:24px;font-weight:500;line-height:1.15;color:var(--neon-pink-text)}
.ha-lk .spec{font-size:var(--text-ui);color:var(--fy-text-body);font-variant-numeric:tabular-nums}
.ha-lk .pf{font-size:var(--text-ui);line-height:1.5;color:var(--fy-text-body)}
.ha-lk .alt{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--neon-teal) 20%,transparent)}
.ha-lk .alt .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fy-text-label)}
.ha-lk .alt .x{font-size:var(--text-small);color:var(--hint-text);font-variant-numeric:tabular-nums}

/* 3 · Prompt sheet */
.ha-copy{min-height:44px;padding:0 18px;border-radius:19px;background:transparent;cursor:pointer;font-size:var(--text-meta);letter-spacing:.08em;font-weight:600;border:2px solid var(--neon-pink-tube);color:var(--neon-pink-text);box-shadow:var(--glow-pink);text-shadow:var(--text-glow-pink)}
.ha-brief{display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr) auto;gap:8px 14px;align-items:baseline;padding:14px 16px;border:1px solid var(--neon-teal);border-radius:10px;box-shadow:var(--glow-teal)}
.ha-brief .l{font-size:var(--text-kicker);letter-spacing:.06em;text-transform:uppercase;color:var(--neon-teal)}
.ha-brief .v{font-size:var(--text-ui);color:var(--neon-pink-text);overflow-wrap:anywhere}
.ha-brief .v.none{color:var(--fy-text-label)}
.ha-brief .c{font-size:var(--text-meta);color:var(--fy-text-label);font-variant-numeric:tabular-nums;white-space:nowrap}
.ha-prompt{display:block;width:100%;box-sizing:border-box;min-height:260px;padding:14px;border-radius:10px;border:1px solid var(--neon-teal);background:var(--fy-surface);color:var(--fy-text-body);font-size:var(--text-ui);line-height:1.55;resize:vertical}

/* 4 · The three options (a draft kept apart from polled data, R8) */
.ha-forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.ha-form{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid color-mix(in srgb,var(--neon-teal) 50%,transparent);border-radius:10px;background:var(--fy-bg);min-width:0}
.ha-in{display:block;width:100%;box-sizing:border-box;min-height:44px;padding:0 12px;border-radius:8px;border:1px solid color-mix(in srgb,var(--neon-teal) 50%,transparent);background:var(--fy-surface);color:var(--fy-text-body);font-size:var(--text-small);outline:none}
.ha-in:focus-visible{outline:2px solid var(--neon-teal);outline-offset:1px}

/* 5 · Paying up */
.ha-pay{padding:14px 16px;border:2px solid var(--neon-pink-tube);border-radius:10px;box-shadow:var(--glow-pink)}
.ha .ha-pay{gap:12px}
.ha-pins{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ha-pins .ha-in{width:auto;min-width:0}
.ha-pins .s{flex:0 1 200px}
.ha-pins .u{flex:1 1 260px}
.ha-save{min-height:44px;padding:0 16px;border-radius:19px;background:transparent;cursor:pointer;font-size:var(--text-meta);letter-spacing:.08em;font-weight:600;border:1px solid var(--neon-teal);color:var(--hint-text)}
.ha-pbar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--neon-teal) 20%,transparent);overflow:hidden}
.ha-pbar div{height:100%;width:0;background:var(--neon-pink-tube);box-shadow:var(--glow-pink)}
.ha-ptxt{font-size:var(--text-small);color:var(--fy-text-secondary);font-variant-numeric:tabular-nums}
.ha-prows{display:flex;flex-direction:column;gap:6px}
.ha-prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;min-height:44px;border-bottom:1px solid color-mix(in srgb,var(--neon-teal) 20%,transparent)}
.ha-prow .nm{font-size:var(--text-ui);color:var(--fy-text-body);overflow-wrap:anywhere}
.ha-prow .st{font-size:var(--text-meta);color:var(--neon-red-text)}
.ha-prow .st.ok{color:var(--neon-green-text)}
.ha-prow .st.pend{color:var(--neon-pink-text)}
.ha-tick{min-height:44px;padding:0 12px;border-radius:19px;background:transparent;cursor:pointer;font-size:var(--text-kicker);letter-spacing:.06em;font-weight:600;border:1px solid var(--neon-teal);color:var(--hint-text);white-space:nowrap}

/* Members (from v_members_public; no add / remove here, R10) */
.ha-mems{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.ha-mems li{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:19px;font-size:var(--text-meta);border:1px solid color-mix(in srgb,var(--neon-teal) 50%,transparent);color:var(--hint-text);white-space:nowrap}

@media (prefers-reduced-motion:no-preference){
  .ha-pbar div{transition:width .4s ease-out}
}
</style>
<script src="fy-clucks.js"></script>

  let me = null, members = [], data = null, body = null;

  // Always a fresh build (typed values never reach the value attribute, so put() would wrongly skip it).
  function buildForms() {
    $('ha-forms').innerHTML = (draft.map((o, i) => `<div class="ha-form" role="group" aria-label="Option ${i + 1}"><span class="ha-k">Option ${i + 1} · <span id="ha-tally-${i}">draft</span></span>
      ${KEYS.map((k, j) => `<input type="text" class="ha-in" data-o="${i}" data-k="${k}" value="${esc(o[k] || '')}" placeholder="${esc(PH[j])}" aria-label="${esc(PH[j])}" autocomplete="off"${k === 'url' || k === 'img' ? ' inputmode="url"' : ''}>`).join('')}</div>`).join(''));
  }

  // Take the current round as the forms' base. A round that appears where there was none starts a fresh draft
  // from its options (the forms were hidden, so nothing typed is lost).
  function adopt() {
    if (!formSig && rnd(data)) { draft = draftFrom(data); buildForms(); payDirty = false; }
    formSig = sig(data);
  }

  // ---- Writes. Every one: RPC, toast on error, then await refresh (humidor.js) and redraw. ----
  // moves = the write changes the round's status. If its refresh did not show the change (a network blip),
  // the next poll that does is Hank's own write, not the round moving on under him.
  async function run(name, args, moves) {
    if (busy) return false;
    const before = sig(data);
    busy = true; drawActions();
    try { await FY.rpc(name, args); }
    catch (e) { busy = false; drawActions(); FY.toast(e.message); return false; }
    try { await Humidor.refresh(); } catch (e) { /* humidor.js has logged it */ }
    busy = false; grace = !!moves && sig(data) === before;
    if (!movedOn) adopt();
    drawAll();
    return true;
  }

  const optionsJson = () => draft.map(o => { const x = {}; KEYS.forEach(k => { const v = String(o[k] || '').trim(); if (v) x[k] = v; }); return x; });

  async function savePay() {
    const s = $('ha-share').value.trim().replace(/^£\s*/, ''), u = $('ha-link').value.trim();
    const share = s === '' ? null : (isFinite(+s) ? +s : s);   // not a number: the server refuses it, and the toast says why
    payDirty = true;   // a poll during the save must not overwrite what is typed; only a saved value replaces it
    if (await run('humidor_set_pay', { p_share: share, p_url: u || null })) { payDirty = false; prefillPay(); }
  }

  function copyPrompt() {
    const ta = $('ha-prompt'), b = $('ha-copy'), text = ta.value;
    const done = () => { b.textContent = 'COPIED ✓'; clearTimeout(copyT); copyT = setTimeout(() => { b.textContent = 'COPY PROMPT'; }, 1600); FY.toast('Prompt copied.'); };
    const fallback = () => { try { ta.focus(); ta.select(); if (document.execCommand('copy')) { done(); return; } } catch (e) { /* no clipboard */ } FY.toast('Couldn’t copy. Select the prompt and copy it by hand.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }

  function act(a, el) {
    const st = stt(data);
    if (a === 'open') return run('humidor_open_round', null, true);
    if (a === 'post') {
      if (st === 'collecting' && filled() < 3) { const e = body.querySelector('.ha-in[data-k="name"]:placeholder-shown'); if (e) e.focus(); return; }
      return run('humidor_post_options', { p_options: optionsJson() }, st === 'collecting');
    }
    if (a === 'close') { if (confirm('Close ranking and lock in the winner?')) return run('humidor_close_ranking', null, true); return; }
    if (a === 'reopen') return run('humidor_reopen_collect', null, true);
    // README: the order can go in whenever Hank decides; unpaid voters are simply not in it.
    if (a === 'order') { if (confirm('Order placed? This archives the round.')) return run('humidor_place_order', null, true); return; }
    if (a === 'stage') { const s = el.getAttribute('data-s'); return run('humidor_set_stage', { p_stage: s === '' ? null : +s }); }
    if (a === 'paid') return run('humidor_confirm_paid', { p_member: el.getAttribute('data-m'), p_on: el.getAttribute('data-on') === '1' });
    if (a === 'save') return savePay();
    if (a === 'copy') return copyPrompt();
  }

  function wire() {
    body.addEventListener('click', e => {
      const el = e.target.closest('[data-a]'); if (!el || !body.contains(el) || el.disabled) return;
      Promise.resolve(act(el.getAttribute('data-a'), el)).catch(err => FY.toast(err.message));
    });
    body.addEventListener('input', e => {
      const t = e.target;
      if (t.matches('.ha-in[data-o]')) { const i = +t.getAttribute('data-o'), k = t.getAttribute('data-k'); draft = draft.map(x => ({ ...x })); draft[i][k] = t.value; drawActions(); }
      else if (t.id === 'ha-share' || t.id === 'ha-link') payDirty = true;
    });
  }

  // Synchronous onChange (humidor.js). Display parts redraw; the inputs never do (R8).
  function onPoll(d) {
    data = d || { stage: null, round: null };
    if (!busy && sig(data) !== formSig) {
      if (grace) { grace = false; if (!movedOn) adopt(); }
      else if (formSig && !movedOn) movedOn = true;
      else if (!formSig) adopt();
    }
    drawAll();
  }

  function shell() {
    body.innerHTML = `<div class="ha" id="ha">
      <section class="ha-notes" id="ha-notes" aria-live="polite" hidden></section>
      <section aria-labelledby="ha-stage-h">
        <div class="ha-hd"><h2 class="ha-h" id="ha-stage-h">Landing page stage</h2><span class="ha-meta" id="ha-stnote"></span></div>
        <div class="ha-stages" id="ha-stages" role="radiogroup" aria-label="Current stage"></div>
      </section>
      <section aria-labelledby="ha-s1-h">
        <h2 class="ha-h" id="ha-s1-h">1 · Round</h2>
        <div class="ha-acts" id="ha-acts"></div>
        <div class="ha-voted" id="ha-voted" hidden></div>
      </section>
      <section id="ha-s2" aria-labelledby="ha-s2-h" hidden><h2 class="ha-h" id="ha-s2-h">2 · What the yard asked for</h2><div class="ha-ws" id="ha-asked"></div></section>
      <section id="ha-s3" aria-labelledby="ha-s3-h" hidden>
        <div class="ha-hd"><h2 class="ha-h" id="ha-s3-h">3 · Prompt sheet</h2><button type="button" class="ha-copy" id="ha-copy" data-a="copy">COPY PROMPT</button></div>
        <div class="ha-brief" id="ha-brief"></div>
        <textarea class="ha-prompt" id="ha-prompt" readonly aria-label="Prompt to paste into an AI or search"></textarea>
      </section>
      <section id="ha-s4" aria-labelledby="ha-s4-h" hidden><h2 class="ha-h" id="ha-s4-h">4 · The three options</h2><div class="ha-forms" id="ha-forms"></div></section>
      <section class="ha-pay" id="ha-s5" aria-labelledby="ha-s5-h" hidden>
        <h2 class="ha-h" id="ha-s5-h">5 · Paying up</h2>
        <div class="ha-pins">
          <input type="text" class="ha-in s" id="ha-share" inputmode="decimal" autocomplete="off" placeholder="Share per member, e.g. 14" aria-label="Share per member">
          <input type="text" class="ha-in u" id="ha-link" inputmode="url" autocomplete="off" placeholder="Revolut link, e.g. https://revolut.me/hank" aria-label="Revolut link">
          <button type="button" class="ha-save" data-a="save">SAVE</button>
        </div>
        <div class="ha-pbar"><div id="ha-pfill"></div></div>
        <span class="ha-ptxt" id="ha-ptxt"></span>
        <div class="ha-prows" id="ha-prows"></div>
      </section>
      <section aria-labelledby="ha-mem-h"><h2 class="ha-h" id="ha-mem-h">Members</h2>
        <ul class="ha-mems">${members.map(m => `<li>${esc(m.nickname)}</li>`).join('')}</ul></section>
    </div>`;
  }

  (async function () {
    const H = await Humidor.start('admin');
    if (!H) { const b = document.getElementById('hm-body'); if (b && b.textContent.trim()) FY.toast(b.textContent.trim()); return; }
    if (!H.leader) return;   // humidor.js has put the leader-only message in main
    me = H.me; body = H.main; members = H.members || []; data = H.data || { stage: null, round: null };
    shell();
    draft = draftFrom(data); buildForms(); formSig = sig(data);
    wire(); drawAll();
    Humidor.poll(onPoll);   // synchronous onChange
  })().catch(e => FY.toast(e.message));
})();
</script>
</body>
</html>
