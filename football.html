<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Farmyard · Football : League</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="farmyard.css">
<link rel="stylesheet" href="barn.css">
<style>
/* 2.2 Football - League, ported from 2.2 Football - League.dc.html. Sample data until the feed lands (BUILD-PLAN 2.2). */
:root{--pg-amber:#ffb020;--pg-gold:#ffd84a;--pg-ink:#eef7f7;--pg-teal-text:#c8f4f2;--pg-teal-pale:#9eeae6;--fb-ko:#ff4d5e}
/* Top frame + hanging sign (shared shape with the Calendar page) */
.pg-top{position:relative;flex:none;margin-top:42px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:96px;box-sizing:border-box;padding:16px;border:2px solid rgba(158,234,230,.72);border-radius:14px;box-shadow:var(--tube-teal-soft)}
.pg-kick{align-self:stretch;min-height:90px;box-sizing:border-box;padding-right:340px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 12px;color:var(--pg-teal-text);text-shadow:0 0 6px var(--neon-teal)}
.pg-kick>span:first-child{white-space:nowrap}
.pg-kick .tag{text-transform:none;letter-spacing:.04em;text-shadow:none}
.pg-sign{position:absolute;right:22px;top:2px;z-index:3;transform-origin:78% 0;transform:rotate(5deg)}
.pg-sign .wire{position:absolute;top:0;width:1px;height:22px;background:var(--pg-teal-pale);opacity:.75;transform-origin:50% 100%}
.pg-sign .wire.l{left:26%;transform:translateY(-4px) rotate(-12deg)}
.pg-sign .wire.r{right:18%;transform:translateY(-4px) rotate(10deg)}
.pg-sign .plate{position:relative;display:flex;align-items:center;gap:6px;padding:22px 64px 20px 112px;border-radius:8px;background:#07090a;border:2px solid var(--neon-green-tube);border-left-color:transparent;box-shadow:0 0 4px var(--neon-green-tube),0 0 12px var(--neon-green),0 0 28px rgba(10,158,67,.5),inset 0 0 8px rgba(10,158,67,.45),0 10px 22px rgba(0,0,0,.55);margin-top:20px}
.pg-sign .edge{position:absolute;left:-2px;top:-2px;bottom:-2px;width:16px;box-sizing:border-box;border:2px solid var(--neon-green-tube);border-right:0;border-radius:8px 0 0 8px;box-shadow:-2px 0 4px var(--neon-green-tube),-8px 0 12px rgba(10,158,67,.55),inset 2px 0 8px rgba(10,158,67,.45)}
.pg-sign .badge{position:absolute;z-index:2;left:-14px;top:-30px;width:100px;height:100px;display:grid;place-items:center;border-radius:50%;background:#07090a;transform:rotate(-14deg);pointer-events:none;border:0;margin:0}
.pg-sign .badge i{font-size:92px;line-height:1;color:#fff2f4;text-shadow:0 0 3px var(--neon-red-tube),0 0 8px var(--neon-red),0 0 18px var(--neon-red)}
.pg-sign h2{font-family:var(--font-heading);font-weight:600;font-size:19px;margin:0;letter-spacing:.26em;color:var(--neon-green-text);text-shadow:0 0 4px var(--neon-green-tube),0 0 12px var(--neon-green),0 0 28px rgba(10,158,67,.6)}
.pg-sign{zoom:.99}
@media (max-width:1400px){.pg-sign{zoom:.84}.pg-kick{padding-right:290px}}
@media (max-width:1100px){.pg-sign{zoom:.69}.pg-kick{padding-right:240px}}
@media (max-width:800px){.pg-sign{zoom:.55;right:12px}.pg-kick{padding-right:190px}}
@media (max-width:520px){.pg-sign{zoom:.43;right:8px}.pg-kick{padding-right:150px;min-height:70px}}
@keyframes pgSway{from{transform:rotate(3.5deg)}to{transform:rotate(10deg)}}
@keyframes pgEdge{0%,14%,16%,17.5%,41%,43%,44%,45%,46.5%,71%,73%,100%{opacity:1}15%,17%,42%,44.5%,45.5%,72%{opacity:.12}}
@keyframes pgLetter{0%,91%,93%,96%,100%{opacity:1}92%,95%{opacity:.18}}
@media (prefers-reduced-motion:no-preference){
  .pg-sign{animation:pgSway 6s ease-in-out infinite alternate}
  .pg-sign .edge{animation:pgEdge 13s linear infinite}
  .pg-sign h2 .fl{animation:pgLetter 9s 2s infinite}
}

/* League tabs */
.fb-tabs{display:flex;gap:8px;flex-wrap:wrap}
.fb-tab{display:flex;align-items:center;gap:9px;min-height:44px;padding:0 15px;background:transparent;border:1.5px solid rgba(95,211,207,.35);border-radius:9px;color:var(--pg-ink);font-family:inherit;font-size:14.3px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:box-shadow .2s ease,border-color .2s ease}
.fb-tab small{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--fy-text-label)}
.fb-tab:hover{border-color:var(--pg-teal-pale);color:#fff;text-shadow:0 0 6px var(--neon-teal);box-shadow:0 0 4px var(--pg-teal-pale),0 0 12px var(--neon-teal),0 0 26px rgba(95,211,207,.6),inset 0 0 8px rgba(95,211,207,.35);background:color-mix(in srgb,var(--neon-teal) 10%,transparent)}
.fb-tab.on{background:color-mix(in srgb,var(--neon-pink) 14%,transparent);border-color:var(--neon-pink-tube);color:var(--neon-pink-text);box-shadow:0 0 6px var(--neon-pink),0 0 14px rgba(224,21,127,.4)}

/* Boxes */
.fb-pair{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch}
.fb-box{display:flex;flex-direction:column;gap:12px;padding:16px 14px 14px;border:1px solid rgba(95,211,207,.55);border-radius:9px;box-shadow:0 0 4px rgba(95,211,207,.4),inset 0 0 4px rgba(95,211,207,.25);min-width:0;box-sizing:border-box}
.fb-box .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fb-box .big{font-size:18px;font-weight:800;letter-spacing:.22em;color:var(--neon-pink-text);text-shadow:var(--text-glow-pink),0 0 24px rgba(224,21,127,.4)}
.fb-box .sub{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pg-teal-text);text-shadow:0 0 5px var(--neon-teal)}
.fb-key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fy-text-secondary)}
.fb-key span{display:flex;align-items:center;gap:6px}
.fb-key i{width:12px;height:12px;border-radius:3px;box-sizing:border-box}

/* Fixtures */
.fb-days{display:flex;flex-direction:column;gap:8px}
.fb-day{display:flex;flex-direction:column;gap:3px}
.fb-day>.dh{padding-bottom:2px;border-bottom:1px dashed rgba(95,211,207,.45);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--neon-teal)}
.fb-game{display:flex;flex-direction:column;gap:3px}
.fb-row{display:grid;grid-template-columns:minmax(0,1fr) 62px minmax(0,1fr) 96px;align-items:center;gap:10px;min-height:44px;box-sizing:border-box;padding:2px 8px;cursor:pointer;border:1px solid rgba(95,211,207,.18);border-radius:8px;transition:box-shadow .2s ease,border-color .2s ease}
.fb-row:hover,.fb-row:focus-visible{border-color:rgba(95,211,207,.6);box-shadow:0 0 8px rgba(95,211,207,.3);outline:none}
.fb-row .h,.fb-row .a{display:flex;align-items:center;gap:8px;min-width:0}
.fb-row .h{justify-content:flex-end}
.fb-row .nm{font-size:13px;font-weight:600;color:var(--pg-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crest{flex:none;width:17px;height:17px;border-radius:50% 50% 45% 45% / 40% 40% 60% 60%;display:grid;place-items:center;background:var(--c1);border:1.5px solid var(--c2);font-size:6px;font-weight:800;letter-spacing:.02em;color:var(--c2);box-sizing:border-box}
.crest.lg{width:22px;height:22px;font-size:7.5px}
.fb-mid{padding:1px 0;text-align:center;border:1.5px dashed var(--fb-ko);border-radius:6px;font-family:var(--font-heading);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fb-ko);text-shadow:0 0 5px rgba(232,38,58,.5)}
.fb-mid.ft{border-style:solid;border-color:var(--neon-green-tube);color:var(--neon-green-tube);font-size:15px;text-shadow:0 0 6px rgba(63,224,127,.7);box-shadow:0 0 6px rgba(63,224,127,.45)}
.fb-mid.live{border-style:solid;border-color:var(--pg-amber);color:var(--pg-amber);text-shadow:0 0 6px rgba(255,176,32,.8);box-shadow:0 0 8px rgba(255,176,32,.5)}
.fb-mid.due{border-color:rgba(178,182,202,.85);color:rgba(178,182,202,.85);font-size:9px;text-shadow:0 0 5px rgba(232,38,58,.5)}
.fb-row .q{display:flex;justify-content:flex-end}
@media (max-width:520px){.fb-row{grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr) auto;gap:6px;padding:2px 6px}.fb-row .h,.fb-row .a{gap:5px}}
.fb-quick{min-height:44px;padding:0 10px;background:#07090a;border:1.5px solid var(--neon-pink-tube);border-radius:6px;color:var(--neon-pink-text);font-family:inherit;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:box-shadow .2s ease}
.fb-quick:hover{box-shadow:0 0 6px var(--neon-pink-tube),0 0 14px var(--neon-pink)}
.fb-quick.called{border-color:var(--neon-green-tube);color:var(--neon-green-text)}
.fb-quick.full{border-color:rgba(178,182,202,.4);color:var(--fy-text-label)}
.fb-rev{margin:0 8px 4px;padding:7px 10px;border-left:2px solid var(--rev);background:rgba(255,255,255,.03);border-radius:0 6px 6px 0;font-size:12.5px;line-height:1.5;color:var(--fy-text-body);text-wrap:pretty}
.fb-rev .tg{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--rev);margin-bottom:2px}
.fb-rev .src{display:block;margin-top:4px;font-size:10.5px;font-style:italic;color:var(--fy-text-label)}
.fb-call{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(95,211,207,.3)}
.fb-call .muted{font-size:12px;color:var(--fy-text-label)}
.fb-go{min-height:44px;padding:0 16px;background:#07090a;border:2px solid var(--neon-pink-tube);border-radius:8px;color:var(--neon-pink-text);font-family:inherit;font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:box-shadow .2s ease}
.fb-go:hover{box-shadow:0 0 6px var(--neon-pink-tube),0 0 16px var(--neon-pink),0 0 30px rgba(224,21,127,.45)}
.fb-steps{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.fb-step{display:flex;flex-direction:column;align-items:center;gap:3px}
.fb-step .lb{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fy-text-label)}
.fb-step .ctl{display:flex;align-items:center;gap:5px}
.fb-step button{width:44px;height:44px;display:grid;place-items:center;padding:0;background:transparent;border:1px solid rgba(95,211,207,.55);border-radius:6px;color:var(--pg-teal-text);cursor:pointer;font-size:16px}
.fb-step button:hover{box-shadow:0 0 8px rgba(95,211,207,.6)}
.fb-step .val{min-width:20px;text-align:center;font-family:var(--font-heading);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--neon-pink-text);text-shadow:0 0 6px rgba(224,21,127,.7)}
.fb-step .val.w{min-width:34px}
.fb-step .match{padding:2px 10px;font-family:var(--font-heading);font-size:18px;font-weight:700;color:var(--pg-gold);text-shadow:0 0 6px rgba(255,184,0,.6)}
.fb-acts{display:flex;gap:8px}
.fb-cancel{min-height:44px;padding:0 12px;background:transparent;border:1px solid rgba(178,182,202,.4);border-radius:8px;color:var(--fy-text-secondary);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.fb-lock{min-height:44px;padding:0 14px;background:#07090a;border:2px solid var(--neon-green-tube);border-radius:8px;color:var(--neon-green-text);font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.fb-lock:hover{box-shadow:0 0 6px var(--neon-green-tube),0 0 16px var(--neon-green)}
.fb-calls{display:flex;flex-direction:column;gap:4px;min-width:0}
.fb-calls .cl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.fb-calls .cl i{color:var(--neon-green-tube);text-shadow:0 0 6px rgba(63,224,127,.7)}
.fb-calls .who{font-weight:800;color:var(--pg-ink)}
.fb-calls .wg{color:var(--fy-text-label)}
.fb-calls .sc{font-weight:800;color:var(--neon-pink-text)}
.fb-calls .tk{font-weight:800;color:var(--pg-gold)}
.fb-calls .pot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--fy-text-secondary)}
.fb-calls .pot i{color:var(--pg-gold)}
.fb-locked{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fy-text-label)}

/* League table */
.fb-tg{display:grid;grid-template-columns:26px 16px minmax(0,1fr) 30px 38px 38px;gap:8px}
.fb-th{padding-bottom:5px;border-bottom:1px dashed rgba(95,211,207,.45);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--neon-teal)}
.fb-th .r,.fb-tr .r{text-align:right}
.fb-rows{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:2px}
.fb-tr{align-items:center;padding:3px 0 3px 6px;border-left:2px solid transparent;font-size:14px}
.fb-tr.top4{border-left-color:var(--neon-teal)}
.fb-tr.drop{border-left-color:var(--neon-red-tube)}
.fb-tr .pos{font-size:12px;color:var(--fy-text-label);font-variant-numeric:tabular-nums}
.fb-tr .mv{font-size:13px;color:rgba(178,182,202,.5);text-shadow:none}
.fb-tr .mv.up{color:var(--neon-green-tube);text-shadow:0 0 6px rgba(63,224,127,.7)}
.fb-tr .mv.dn{color:var(--fb-ko);text-shadow:0 0 6px rgba(232,38,58,.7)}
.fb-tr .tm{display:flex;align-items:center;gap:8px;min-width:0}
.fb-tr .tm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--pg-ink)}
.fb-tr .r{font-variant-numeric:tabular-nums;color:var(--fy-text-secondary)}
.fb-tr .pts{font-weight:700;color:var(--neon-pink-text)}
.fb-zones{display:flex;gap:12px;flex-wrap:wrap;padding-top:6px;border-top:1px solid rgba(95,211,207,.2);font-size:11px;color:var(--fy-text-label)}
.fb-zones span{display:flex;align-items:center;gap:6px}
.fb-zones i{width:3px;height:12px}

/* Top stories */
.fb-news{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:12px}
.fb-story{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center;padding:10px;border:1px solid rgba(95,211,207,.2);border-radius:8px;color:inherit;text-decoration:none;transition:box-shadow .2s ease,border-color .2s ease}
.fb-story:hover{border-color:rgba(95,211,207,.6);box-shadow:0 0 10px rgba(95,211,207,.35)}
@media (max-width:420px){.fb-story{grid-template-columns:80px minmax(0,1fr);gap:10px}}
.fb-story .ph-box{aspect-ratio:3 / 2;display:grid;place-items:center;border:1px dashed rgba(95,211,207,.45);border-radius:6px;background:#07090a}
.fb-story .ph-box i{font-size:34px;color:rgba(95,211,207,.6)}
.fb-story .tx{display:flex;flex-direction:column;gap:6px;min-width:0}
.fb-story .t1{font-size:16px;font-weight:700;line-height:1.3;color:var(--pg-ink);text-wrap:pretty}
.fb-story .t2{font-size:13px;line-height:1.5;color:var(--fy-text-secondary);text-wrap:pretty}
.fb-story .t3{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--fy-text-label)}
.fb-story .t3 b{font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pg-teal-text)}
.fb-story .t3 em{font-style:normal;color:var(--neon-teal)}

/* Token League + Token debts */
.fb-tl{overflow-x:auto}
.fb-tl .tbl{min-width:420px;border:1px solid rgba(95,211,207,.55);border-radius:6px;overflow:hidden}
.fb-tl .hr,.fb-tl .tr{display:grid;grid-template-columns:40px minmax(110px,1fr) 70px 70px 90px;align-items:center}
.fb-tl .hr{min-height:34px;background:rgba(95,211,207,.08);border-bottom:1px solid rgba(95,211,207,.55);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--pg-teal-text)}
.fb-tl .tr{min-height:38px;font-size:13px;font-variant-numeric:tabular-nums;border-bottom:1px solid rgba(95,211,207,.18);transition:background .2s ease,box-shadow .2s ease}
.fb-tl .tr.me{background:color-mix(in srgb,var(--neon-pink) 10%,transparent)}
.fb-tl .tr:hover{background:color-mix(in srgb,var(--neon-teal) 8%,transparent);box-shadow:inset 0 0 0 1px rgba(95,211,207,.5)}
.fb-tl .c{align-self:stretch;display:grid;place-items:center;border-left:1px solid rgba(95,211,207,.4);color:var(--fy-text-secondary)}
.fb-tl .hr .c{color:inherit}
.fb-tl .p{text-align:center;font-size:12px;font-weight:700;color:var(--pg-teal-text);text-shadow:0 0 5px var(--neon-teal)}
.fb-tl .n{align-self:stretch;display:flex;align-items:center;gap:6px;min-width:0;padding:0 10px;border-left:1px solid rgba(95,211,207,.4)}
.fb-tl .n span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--pg-ink)}
.fb-tl .tk{font-weight:800;color:var(--pg-gold);text-shadow:0 0 6px rgba(255,184,0,.5)}
.fb-tl .ph-crown-simple{font-size:17px;color:var(--pg-gold);text-shadow:0 0 4px #ffb800,0 0 12px rgba(255,184,0,.7)}
.fb-tl .medal{font-family:'Segoe UI Symbol','Noto Sans Symbols 2','DejaVu Sans',serif;font-size:17px;line-height:1}
.fb-tl .medal.silver{color:#e4ecf0;text-shadow:0 0 4px #c9d6dd,0 0 12px rgba(201,214,221,.7)}
.fb-tl .medal.copper{color:#d9894f;text-shadow:0 0 4px #b8692f,0 0 12px rgba(184,105,47,.75)}
.fb-foot{font-size:11px;color:var(--fy-text-label)}
.fb-debts .hd,.fb-debts .dr{display:grid;grid-template-columns:minmax(64px,1fr) minmax(0,1.5fr) 64px}
.fb-debts .hd{border-top:1px solid rgba(95,211,207,.55);border-bottom:1px solid rgba(95,211,207,.55);box-shadow:0 0 4px rgba(95,211,207,.45);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pg-teal-text);text-shadow:0 0 5px var(--neon-teal)}
.fb-debts .hd span{padding:7px 10px}
.fb-debts .hd span+span{border-left:1px solid rgba(95,211,207,.55)}
.fb-debts .hd span:last-child{padding:7px 0;text-align:center}
.fb-debts .dr{align-items:stretch;min-height:38px;font-size:13px;border-bottom:1px solid rgba(95,211,207,.28)}
.fb-debts .dn{display:flex;align-items:center;padding:0 10px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-debts .dt{display:flex;align-items:center;padding:6px 10px;border-left:1px solid rgba(95,211,207,.4);color:var(--fy-text-secondary);min-width:0;line-height:1.35}
.fb-debts .da{display:flex;align-items:center;justify-content:center;white-space:nowrap;border-left:1px solid rgba(95,211,207,.4);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--pg-gold);text-shadow:0 0 6px rgba(255,184,0,.5)}
.fb-settle{align-self:flex-start;margin-top:12px;min-height:44px;padding:0 16px;display:inline-flex;align-items:center;gap:7px;box-sizing:border-box;border:2px solid var(--neon-red-tube);border-radius:8px;background:transparent;color:var(--neon-red-text);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;text-shadow:var(--text-glow-red);box-shadow:0 0 4px var(--neon-red-tube),0 0 14px var(--neon-red),inset 0 0 8px rgba(168,0,22,.4)}
</style>
<script src="fy-clucks.js"></script>
</head>
<body>
<div id="app"><main class="door"><p class="muted">Loading…</p></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="app.js"></script><script src="barn.js"></script>
<script>
/* 2.2 Football - League. Everything here is the design's sample data (BUILD-PLAN 2.2): fixtures, tables,
   stories, the Token League and token debts. The design picks "this week" from today's date, which by now
   would leave most leagues empty, so the sample clock is pinned to the design's own date, Sun 11 Oct 2026

        const ft = /^\d+-\d+$/.test(v), dm = day.match(/(\d+) (\w{3})/);
        const ko = !ft && dm && /^\d\d:\d\d$/.test(v) ? new Date('2026-' + String(FB_MONTHS.indexOf(dm[2]) + 1).padStart(2, '0') + '-' + dm[1].padStart(2, '0') + 'T' + v + ':00+01:00') : null;
        const since = ko ? FB_NOW - ko : -1, live = since >= 0 && since < 115 * 6e4, due = since >= 115 * 6e4, id = home + '|' + away;
        const cv = callVals(id, home, away, ft || (!!ko && FB_NOW >= ko));
        games[id] = cv;
        return { id, home, away, open: st.open === id, ft, cv, hc: crest(home), ac: crest(away),
          hint: ft ? 'Click for match review' : 'Click for match preview', review: ft ? review(home, away, v) : preview(home, away, L),
          revTag: ft ? 'Match review' : 'Preview', revC: ft ? 'var(--neon-green-tube)' : 'var(--neon-teal)', revSrc: ft && REVIEWS[id] ? 'Sources: ' + REVIEWS[id][1] : '',
          mid: ft ? v.replace('-', ' – ') : live ? 'LIVE' : due ? 'RESULT DUE' : v, cls: ft ? 'ft' : live ? 'live' : due ? 'due' : 'ko' };
      }) }));
  }

  const crestHtml = (c, lg) => `<span class="crest ${lg ? 'lg' : ''}" aria-hidden="true" title="Club badge" style="--c1:${esc(c.c1)};--c2:${esc(c.c2)}">${esc(c.abbr)}</span>`;
  const step = (label, val, wide, dn, up, what) => `<span class="fb-step"><span class="lb">${esc(label)}</span><span class="ctl">
      <button type="button" data-act="${dn}" aria-label="Fewer ${what}"><i class="ph ph-minus"></i></button>
      <span class="val ${wide ? 'w' : ''}">${esc(val)}</span>
      <button type="button" data-act="${up}" aria-label="More ${what}"><i class="ph ph-plus"></i></button></span></span>`;

  function gameHtml(g) {
    const c = g.cv, id = esc(g.id);
    const quick = c.qState ? `<button type="button" class="fb-quick ${c.qState === 'called' ? 'called' : c.qState === 'full' ? 'full' : ''}" data-act="quick" data-id="${id}">${esc(c.quickText)}</button>` : '';
    let box = '';
    if (g.open && c.showCallBox) {
      box = `<div class="fb-call">
        ${c.showCallBtn ? `<span class="muted">You have ${esc(c.bal)} tokens</span><button type="button" class="fb-go" data-act="start" data-id="${id}">Call it</button>` : ''}
        ${c.drafting ? `<span class="fb-steps">
            ${step(c.homeShort, c.dh, false, 'dh-dn', 'dh-up', 'home goals')}
            ${step(c.awayShort, c.da, false, 'da-dn', 'da-up', 'away goals')}
            ${c.isChallenge ? `<span class="fb-step"><span class="lb">Matching stake</span><span class="match">${esc(c.dt)}</span></span>` : step('Tokens', c.dt, true, 'dt-dn', 'dt-up', 'tokens')}
          </span><span class="fb-acts"><button type="button" class="fb-cancel" data-act="cancel">Cancel</button><button type="button" class="fb-lock" data-act="lock">Lock it in</button></span>` : ''}
        ${c.list.length ? `<span class="fb-calls">${c.callList.map(x => `<span class="cl"><i class="ph-fill ph-check-circle"></i><span class="who">${esc(x.who)}</span><span class="wg">wagers</span><span class="sc">${esc(x.text)}</span><span class="tk">${esc(x.tokens)}</span></span>`).join('')}
            <span class="pot"><i class="ph-fill ph-coins"></i>Pot <span class="tk" style="font-weight:800;color:var(--pg-gold)">${esc(c.pot)}</span>· ${esc(c.potNote)}</span></span>` : ''}
        ${c.showChallenge ? `<button type="button" class="fb-go" data-act="start" data-id="${id}">Challenge it</button>` : ''}
        ${c.iCalled ? `<span class="fb-locked"><i class="ph ph-lock-simple"></i>${esc(c.lockText)}</span>` : ''}
      </div>`;
    }
    return `<div class="fb-game">
      <div class="fb-row" role="button" tabindex="0" data-act="toggle" data-id="${id}" aria-expanded="${g.open}" title="${esc(g.hint)}">
        <span class="h"><span class="nm">${esc(g.home)}</span>${crestHtml(g.hc)}</span>
        <span class="fb-mid ${g.cls}">${esc(g.mid)}</span>
        <span class="a">${crestHtml(g.ac)}<span class="nm">${esc(g.away)}</span></span>
        <span class="q">${quick}</span>
      </div>
      ${g.open ? `<div class="fb-rev" style="--rev:${g.revC}"><span class="tg">${esc(g.revTag)}</span>${esc(g.review)}${g.revSrc ? `<span class="src">${esc(g.revSrc)}</span>` : ''}${box}</div>` : ''}
    </div>`;
  }

  function tableRows(L, key) {
    const played = FB_PLAYED[key], n = L.table.length, ptsAt = i => Math.max(1, Math.round((played * 2.4) * (1 - i / (n * 1.15))));
    const mvs = {}; L.days.forEach(([, gs]) => gs.forEach(([h, w, v]) => { if (!/^\d+-\d+$/.test(v)) return; const [x, y] = v.split('-').map(Number); mvs[h] = Math.sign(x - y); mvs[w] = Math.sign(y - x); }));
    return L.table.slice(0, 10).concat(L.table.slice(-3)).map((team, j) => {
      const i = j < 10 ? j : n - 3 + (j - 10), mv = mvs[team] || 0, gd = Math.round((n / 2 - i) * 1.1);
      return { pos: i + 1, team, c: crest(team), p: played, gd: (gd > 0 ? '+' : '') + gd, pts: ptsAt(i), zone: i < 4 ? 'top4' : i >= n - 3 ? 'drop' : '',
        mvIcon: mv > 0 ? 'ph-fill ph-caret-up' : mv < 0 ? 'ph-fill ph-caret-down' : 'ph ph-minus', mvCls: mv > 0 ? 'up' : mv < 0 ? 'dn' : '', mvLabel: mv > 0 ? 'Up since last week' : mv < 0 ? 'Down since last week' : 'No change' };
    });
  }

  function render() {
    const key = st.league, L = FB[key];
    const days = fixtures(L), rows = tableRows(L, key);
    const news = FB_NEWS[key].map(([title, body, source, date]) => ({ title, body: body === 'Sample story.' ? 'Sample story. The live site will show a real headline here.' : body, source, date, url: 'https://www.bbc.co.uk/sport/football/' + FB_NEWS_URL[key] }));
    const tr = tokenRows(all, viewer), debts = tokenDebts(all);
    const mark = i => i === 0 ? '<i class="ph-fill ph-crown-simple" aria-label="First place"></i>'
      : i === 1 ? '<span class="medal silver" role="img" aria-label="Second place">&#9819;&#xFE0E;</span>'
      : i === 2 ? '<span class="medal copper" role="img" aria-label="Third place">&#9821;&#xFE0E;</span>' : '';
    main.innerHTML = `
      <section class="pg-top">
        <div class="pg-kick kicker"><span>Pick a league</span><span class="tag tag-neutral">Sample</span></div>
        <div class="fb-tabs" role="tablist" aria-label="Leagues">${Object.entries(FB).map(([k, v]) => `<button type="button" role="tab" class="fb-tab ${k === key ? 'on' : ''}" aria-selected="${k === key}" data-act="league" data-k="${esc(k)}"><span>${esc(v.name)}</span><small>${esc(v.country)}</small></button>`).join('')}</div>
        <div class="pg-sign"><span class="wire l"></span><span class="wire r"></span>
          <div class="plate"><span class="edge" aria-hidden="true"></span><span class="badge" aria-hidden="true"><i class="ph ph-soccer-ball"></i></span>
            <h2>F<span class="fl">O</span>OTBALL</h2></div></div>
      </section>
      <div class="fb-pair">
        <section class="fb-box" style="flex:4 1 420px">
          <div class="top"><span class="kicker big">Fixtures &amp; results</span><span class="sub">${esc(L.name)}</span></div>
          <div class="fb-key">
            <span><i style="border:1.5px solid var(--neon-green-tube);box-shadow:0 0 5px rgba(63,224,127,.6)"></i>Full time</span>
            <span><i style="border:1.5px solid var(--pg-amber);box-shadow:0 0 5px rgba(255,176,32,.6)"></i>In play</span>
            <span><i style="border:1.5px dashed var(--fb-ko)"></i>Kick-off</span>
          </div>
          <div class="fb-days">${days.map(d => `<div class="fb-day"><span class="dh">${esc(d.day)}</span>${d.games.map(gameHtml).join('')}</div>`).join('')}</div>
        </section>
        <section class="fb-box" style="flex:1 1 280px">
          <div class="top"><span class="kicker big">${esc(L.name)}</span><span class="sub">League table</span></div>
          <div class="fb-tg fb-th"><span>Pos</span><span></span><span>Team</span><span class="r">P</span><span class="r">GD</span><span class="r">Pts</span></div>
          <div class="fb-rows">${rows.map(r => `<div class="fb-tg fb-tr ${r.zone}">
            <span class="pos">${esc(r.pos)}</span>
            <i class="${esc(r.mvIcon)} mv ${r.mvCls}" role="img" aria-label="${esc(r.mvLabel)}" title="${esc(r.mvLabel)}"></i>
            <span class="tm">${crestHtml(r.c, true)}<span>${esc(r.team)}</span></span>
            <span class="r">${esc(r.p)}</span><span class="r">${esc(r.gd)}</span><span class="r pts">${esc(r.pts)}</span>
          </div>`).join('')}</div>
          <div class="fb-zones"><span><i style="background:var(--neon-teal)"></i>${esc(L.top)}</span><span><i style="background:var(--neon-red-tube)"></i>${esc(L.bottom)}</span></div>
        </section>
      </div>
      <section class="fb-box">
        <div class="top"><span class="kicker big">Top stories</span><span class="sub">${esc(L.name)}</span></div>
        <div class="fb-news">${news.map(n => `<a class="fb-story" href="${esc(n.url)}" target="_blank" rel="noopener">
          <span class="ph-box"><i class="ph ph-newspaper"></i></span>
          <span class="tx"><span class="t1">${esc(n.title)}</span><span class="t2">${esc(n.body)}</span>
            <span class="t3"><b>${esc(n.source)}</b><span>${esc(n.date)}</span><em>Read more ↗</em></span></span>
        </a>`).join('')}</div>
      </section>
      <div class="fb-pair">
        <section class="fb-box" style="flex:3 1 420px;gap:10px">
          <div class="top"><span class="kicker big">Token League</span><span class="sub">Call it · Season</span></div>
          <div class="fb-tl"><div class="tbl">
            <div class="hr"><span style="text-align:center">Pos</span><span class="n">Member</span><span class="c">Calls</span><span class="c">Pots won</span><span class="c">Tokens</span></div>
            ${tr.map((r, i) => `<div class="tr ${r.me ? 'me' : ''}"><span class="p">${esc(r.pos)}</span><span class="n"><span>${esc(r.name)}</span>${mark(i)}</span><span class="c">${esc(r.calls)}</span><span class="c">${esc(r.won)}</span><span class="c tk">${esc(r.tokens)}</span></div>`).join('')}
          </div></div>
          <span class="fb-foot">Everyone starts on 100 tokens. Nearest call takes the pot; ties split.</span>
        </section>
        <section class="fb-box fb-debts" style="flex:2 1 280px;gap:4px">
          <div class="top" style="padding-bottom:6px"><span class="kicker big">Token debts</span></div>
          <div class="hd"><span>Member</span><span>Owes</span><span>Total</span></div>
          ${debts.map(d => `<div class="dr"><span class="dn">${esc(d.name)}</span><span class="dt">${esc(d.to)}</span><span class="da">${esc(d.amount)}</span></div>`).join('')}
          <a class="fb-settle" href="profile.html#settle"><i class="ph ph-hand-coins"></i>Settle up</a>
        </section>
      </div>`;
  }

  function act(el) {
    const a = el.dataset.act, id = el.dataset.id, d = st.draft;
    const g = id ? games[id] : null;
    const openDraft = () => { st.open = id; st.draft = { id, h: 1, a: 1, t: g.list[0] ? g.list[0].t : Math.min(1, g.bal) }; };
    const bump = fn => { if (d) { const cur = games[d.id]; fn(d, cur); } };
    switch (a) {
      case 'league': st.league = el.dataset.k; st.open = null; st.draft = null; break;
      case 'toggle': st.open = st.open === id ? null : id; break;
      case 'quick': if (g.qState === 'call' || g.qState === 'challenge') { FY.toast('Coming soon.'); openDraft(); } else st.open = id; break;
      case 'start': FY.toast('Coming soon.'); openDraft(); break;
      case 'cancel': st.draft = null; break;
      case 'lock': FY.toast('Coming soon.'); st.draft = null; break;
      case 'dh-up': bump(x => { x.h = Math.min(9, x.h + 1); }); break;
      case 'dh-dn': bump(x => { x.h = Math.max(0, x.h - 1); }); break;
      case 'da-up': bump(x => { x.a = Math.min(9, x.a + 1); }); break;
      case 'da-dn': bump(x => { x.a = Math.max(0, x.a - 1); }); break;
      case 'dt-up': bump((x, cur) => { if (!cur.list.length) x.t = Math.min(cur.bal, x.t + 1); }); break;
      case 'dt-dn': bump((x, cur) => { if (!cur.list.length) x.t = Math.max(1, x.t - 1); }); break;
      default: return;
    }
    const focusKey = a === 'league' ? `[data-act="league"][data-k="${el.dataset.k}"]` : /^d[hat]-/.test(a) ? `[data-act="${a}"]` : null;
    render();
    if (focusKey) { const f = main.querySelector(focusKey); if (f) f.focus(); }
  }
  main.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && main.contains(el)) act(el); });
  main.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('fb-row')) {
      e.preventDefault(); act(e.target);
      const r = main.querySelector(`.fb-row[data-id="${CSS.escape(e.target.dataset.id)}"]`); if (r) r.focus();
    }
  });
  render();
}

(async () => { const B = await Barn.open('football'); if (B) drawFootball(B); })();
</script>
</body>
</html>
