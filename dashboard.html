<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Farmyard · Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="app.css?v=20261113">
<link rel="stylesheet" href="farmyard.css?v=20261113">
<link rel="stylesheet" href="barn.css?v=20261113">
<script src="fy-clucks.js?v=20261113"></script>
</head>
<body>
<div id="app"><main class="door"><p class="muted">Loading…</p></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=20261113"></script><script src="app.js?v=20261113"></script><script src="barn.js?v=20261113"></script><script src="presence.js?v=20261113"></script><script src="sidebar-subs.js?v=20261113"></script>
<script>
/* 1.0 BARN DASHBOARD (REV C03): wall widget (Hank's pins + latest), IOUs owed to you,
   room modules. The online strip lives in the sidebar (presence.js). */
(async function () {
  const B = await Barn.open('dashboard'); if (!B) return;
  const { me, main } = B, esc = FY.esc;
  Presence.join(me).catch(() => {});

  const ago = iso => {
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return 'now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 7 * 86400) return Math.floor(s / 86400) + 'd ago';
    return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  };
  const profHref = m => m.id === me.id ? 'profile.html' : 'profile.html?user=' + encodeURIComponent(m.nickname);
  const faceDot = (m, px) => `<a href="${profHref(m)}" aria-label="Open ${esc(m.nickname)}" style="display:contents"><span style="flex:none; align-self:center; display:flex;">${FY.faceRing(m, px, m.nickname)}</span></a>`;

  const [membersRes, postsRes, iousRes, eventsRes] = await Promise.all([
    FY.q('member').select('id, nickname, avatar, avatar_url'),
    FY.q('post').select('*').order('created_at', { ascending: false }).limit(30),
    FY.rpc('my_ious').catch(() => []),
    FY.q('event').select('id,type_key'),
  ]);
  // iou.amount is buy-ins on poker events (×5 tk) and plain tk otherwise.
  const evType = Object.fromEntries((eventsRes.data || []).map(e => [e.id, e.type_key]));
  const tkOf = i => i.amount * (i.event_id && evType[i.event_id] === 'poker' ? 5 : 1);
  const members = membersRes.data || [];
  const dir = Object.fromEntries(members.map(m => [m.id, m]));
  let rooms = [];
  try { rooms = await Barn.rooms(); } catch (e) {}

  const postRow = p => {
    const m = dir[p.member_id] || { id: p.member_id, nickname: '?' };
    return `<div style="display:flex; gap:8px; align-items:baseline; padding:6px 12px; border-top:1px solid var(--rule-teal); min-width:0; font-size:var(--fs-sm); line-height:1.4;">
      ${faceDot(m, 31)}<span style="flex:none; font-weight:600;">${esc(m.nickname)}</span>
      <span style="flex:1; min-width:0; color:var(--color-neutral-300); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(p.body)}</span>
      <span style="flex:none; font-size:var(--fs-xs); color:var(--color-neutral-400);">${ago(p.created_at)}</span></div>`;
  };

  function wallBox(posts) {
    const pinned = posts.filter(p => p.pinned_at), latest = posts.filter(p => !p.pinned_at).slice(0, 3);
    return `
      <button type="button" id="pins-toggle" aria-expanded="true" style="display:flex; align-items:center; gap:8px; padding:8px 12px; border:0; background:transparent; cursor:pointer; font:inherit; color:inherit; text-align:left; width:100%;">
        <i class="ph ph-chats-circle" style="color:var(--neon-teal); text-shadow:0 0 6px var(--neon-teal);"></i>
        <span class="kicker">Pinned by Hank</span><span style="font-size:var(--fs-xs); color:var(--color-neutral-400);">${pinned.length}</span></button>
      <div id="pins">${pinned.map(postRow).join('')}</div>
      <div style="display:flex; align-items:center; gap:8px; padding:8px 12px; border-top:1px solid var(--rule-teal);"><span class="kicker">Latest on the wall</span><span style="flex:1;"></span>
        <a href="wall.html" style="font-size:var(--fs-xs); font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5fd3cf; text-decoration:none; text-shadow:0 0 5px rgba(95,211,207,.5);">Open the wall →</a></div>
      ${latest.map(postRow).join('') || '<div style="padding:10px 12px; border-top:1px solid var(--rule-teal); font-size:var(--fs-sm); color:var(--color-neutral-400);">Nothing on the wall yet. Start it.</div>'}`;
  }

  // IOUs owed to you, net per payer, live states only.
  const owedRows = Object.values((Array.isArray(iousRes) ? iousRes : []).reduce((acc, i) => {
    if (i.payee_id !== me.id || !['open', 'marked_paid', 'disputed'].includes(i.state)) return acc;
    (acc[i.payer_id] = acc[i.payer_id] || { who: i.payer_id, tk: 0 }).tk += tkOf(i);
    return acc;
  }, {})).sort((a, b) => b.tk - a.tk);

  const NOTES = { poker: "Friday nights · Hold'em", football: 'Fixtures & tables', humidor: 'Vote · results · archive', calendar: 'Game nights & dates', wall: "Posts · Hank's pins" };
  const modules = ['poker', 'football', 'humidor', 'calendar', 'wall']
    .map(id => rooms.find(r => r.id === id)).filter(Boolean)
    .filter(r => B.leader || Barn.vis(r.id, r) === 'members')   // launch scope: members see Poker only
    .map(r => `<a href="${esc(r.path)}" class="card" style="padding:0; overflow:hidden; display:flex; flex-direction:column; text-align:left; color:inherit; text-decoration:none; min-width:0;">
      <div style="position:relative; aspect-ratio:16/7; background:color-mix(in srgb, var(--neon-teal) 6%, transparent); border-bottom:1px solid var(--rule-teal);">
        <span style="position:absolute; left:12px; bottom:-18px; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--fy-surface); border:2px solid var(--neon-teal); box-shadow:var(--glow-teal);"><i class="${esc(r.icon)}" style="font-size:var(--ic-lg); color:var(--neon-teal); text-shadow:0 0 6px var(--neon-teal);"></i></span>
      </div>
      <div style="display:flex; flex-direction:column; gap:2px; padding:24px 12px 12px;">
        <span style="font-family:var(--font-heading); font-weight:500; font-size:var(--fs-h3); color:var(--neon-pink-text); text-shadow:0 0 6px rgba(224,21,127,.6);">${esc(r.label)}</span>
        <span style="font-size:var(--fs-sm); color:var(--color-neutral-300);">${esc(NOTES[r.id] || '')}</span>
      </div></a>`).join('');

  main.innerHTML = `
    <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
      <div class="fy-pagehead"><h2 class="t-title-b">Dashboard</h2><span class="t-tagline">What's on in the yard tonight.</span></div>
      <div style="flex:1;"></div><span class="tag tag-neutral" style="white-space:nowrap;">${members.length} inside</span>
    </div>
    <div id="wall-box" ${B.leader || Barn.vis('wall', rooms.find(r => r.id === 'wall')) === 'members' ? '' : 'hidden'} style="flex:none; display:flex; flex-direction:column; border:1px solid var(--neon-teal); border-radius:10px; box-shadow:var(--glow-teal); background:var(--fy-bg); overflow:hidden;"></div>
    <div style="flex:none; display:flex; flex-direction:column; border:1px solid var(--neon-teal); border-radius:10px; box-shadow:var(--glow-teal); background:var(--fy-bg); overflow:hidden;">
      <div style="display:flex; align-items:center; gap:8px; padding:8px 12px; flex-wrap:wrap;">
        <i class="ph ph-handshake" style="color:var(--neon-teal); text-shadow:0 0 6px var(--neon-teal);"></i><span class="kicker">IOUs</span>
        <span style="font-size:var(--fs-xs); color:var(--color-neutral-400);">tk not yet transferred to you</span><span style="flex:1;"></span>
        <a href="profile.html#settle" style="font-size:var(--fs-xs); font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5fd3cf; text-decoration:none; text-shadow:0 0 5px rgba(95,211,207,.5);">Settle up →</a></div>
      ${owedRows.map(w => { const m = dir[w.who] || { id: w.who, nickname: '?' }; return `<div style="display:flex; align-items:center; gap:10px; padding:6px 12px; border-top:1px solid var(--rule-teal); font-size:var(--fs-sm); min-width:0;">
        ${faceDot(m, 32)}<span style="flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(m.nickname)}</span>
        <span style="font-variant-numeric:tabular-nums; font-weight:700; color:var(--neon-red-text); text-shadow:0 0 6px var(--neon-red-text); white-space:nowrap;">${w.tk} tk</span></div>`; }).join('')
      || '<div style="padding:10px 12px; border-top:1px solid var(--rule-teal); font-size:var(--fs-sm); color:var(--color-neutral-400);">All square. Nobody owes you.</div>'}
    </div>
    <div style="flex:none; display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px;">${modules}</div>`;

  // Needs you: leaders only (never in member preview). Unclaimed invites and payments awaiting Received.
  if (B.leader) {
    const unclaimed = ((await FY.q('member').select('id,nickname,user_id').is('user_id', null)).data || []).map(m => m.nickname);
    const awaiting = (Array.isArray(iousRes) ? iousRes : []).filter(i => i.state === 'marked_paid');
    const nm = id => (dir[id] || {}).nickname || '?';
    const line = (label, items) => `<div style="display:flex; gap:8px; align-items:baseline; padding:6px 12px; border-top:1px solid var(--rule-teal); font-size:var(--fs-sm); line-height:1.4;">
      <span style="flex:none; font-weight:600;">${label}</span>
      <span style="flex:1; min-width:0; color:var(--color-neutral-300);">${items.map(esc).join(', ')}</span></div>`;
    const card = document.createElement('div');
    card.id = 'needs-you';
    card.style.cssText = 'flex:none; display:flex; flex-direction:column; border:1px solid var(--neon-teal); border-radius:10px; box-shadow:var(--glow-teal); background:var(--fy-bg); overflow:hidden;';
    card.innerHTML = `<div style="display:flex; align-items:center; gap:8px; padding:8px 12px; flex-wrap:wrap;">
        <i class="ph ph-user-circle-gear" style="color:var(--neon-teal); text-shadow:0 0 6px var(--neon-teal);"></i><span class="kicker" style="color:var(--neon-pink-text); text-shadow:var(--text-glow-pink);">Needs you</span>
        <span style="font-size:var(--fs-xs); color:var(--color-neutral-400);">${unclaimed.length + awaiting.length}</span><span style="flex:1;"></span>
        <a href="admin.html" style="font-size:var(--fs-xs); font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5fd3cf; text-decoration:none; text-shadow:0 0 5px rgba(95,211,207,.5);">Open Admin →</a></div>
      ${unclaimed.length ? line(`Unclaimed invites · ${unclaimed.length}`, unclaimed) : ''}
      ${awaiting.length ? line(`Awaiting Received · ${awaiting.length}`, awaiting.map(i => nm(i.payer_id) + ' → ' + nm(i.payee_id))) : ''}
      ${unclaimed.length || awaiting.length ? '' : '<div style="padding:10px 12px; border-top:1px solid var(--rule-teal); font-size:var(--fs-sm); color:var(--color-neutral-400);">Nothing waiting on you.</div>'}`;
    main.querySelector('#wall-box').before(card);
  }

  const wallBoxEl = main.querySelector('#wall-box');
  let posts = postsRes.data || [];
  const drawWall = () => {
    wallBoxEl.innerHTML = wallBox(posts);
    wallBoxEl.querySelector('#pins-toggle').addEventListener('click', ev => {
      const pins = wallBoxEl.querySelector('#pins'), open = pins.style.display !== 'none';
      pins.style.display = open ? 'none' : '';
      ev.currentTarget.setAttribute('aria-expanded', String(!open));
    });
  };
  drawWall();
  // Live wall: refetch on any post change.
  FY.sb.channel('dash-wall').on('postgres_changes', { event: '*', schema: 'fy', table: 'post' }, async () => {
    posts = (await FY.q('post').select('*').order('created_at', { ascending: false }).limit(30)).data || posts;
    drawWall();
  }).subscribe();
})().catch(e => FY.toast(e.message));
</script>
</body>
</html>
