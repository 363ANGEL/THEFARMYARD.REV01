<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Farmyard · Invite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="app.css?v=20261125t">
<link rel="stylesheet" href="farmyard.css?v=20261127b">
<link rel="stylesheet" href="barn.css?v=20261125t">
<script src="fy-clucks.js?v=20261119b"></script>
<link rel="icon" href="favicon.ico?v=20261127a" sizes="48x48"><link rel="icon" type="image/png" href="icon-192.png?v=20261127a" sizes="192x192"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261127a">
</head>
<body>
<div id="app"><main class="door"><p class="muted">Checking your link…</p></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=20261119b"></script><script src="app.js?v=20261127c"></script><script src="barn.js?v=20261127c"></script>
<script>
/* 0.1 Invite Door. RAY sends claim.html?t=<token>. States: invite (sign in with Discord, then claim),
   wrongAccount (this Discord already has a profile), used (link used or unknown). Discord is the only sign-in.
   The token rides in the URL through the OAuth round trip (Discord's in-app browser may hand off to another
   browser, so storage cannot be relied on); sessionStorage is a fallback only. */
(async function () {
  const app = document.getElementById('app'), esc = FY.esc, INVITER = 'RAY';
  const qs = new URLSearchParams(location.search);
  let token = qs.get('claim') || qs.get('t');
  // The token survives the Discord round trip three ways: in the redirectTo URL, in sessionStorage and in localStorage.
  const keep = t => { ['sessionStorage', 'localStorage'].forEach(k => { try { window[k].setItem('fy_claim_token', t); } catch (e) {} }); };
  const drop = () => { ['sessionStorage', 'localStorage'].forEach(k => { try { window[k].removeItem('fy_claim_token'); } catch (e) {} }); };
  if (!token) { try { token = sessionStorage.getItem('fy_claim_token') || localStorage.getItem('fy_claim_token'); } catch (e) {} }
  // A sign-in the gate refused comes back with error_description in the query or the hash.
  const oauthErr = qs.get('error_description') || new URLSearchParams(location.hash.slice(1)).get('error_description');
  if (!FY.wired) { app.innerHTML = '<main class="door"><p>Not wired to the database yet.</p></main>'; return; }
  const ok = token && /^[0-9a-f]{32}$/.test(token);
  if (ok) keep(token);

  const SIGN = `<div class="hankwrap"><div class="sign-invite"><span class="wire"></span><span class="pin"></span><span class="plate">${[...'INVITE'].map((c, i) => `<span class="${i === 3 ? 'dead' : ''}" style="animation-delay:${(i * .53) % 2.5}s">${c}</span>`).join('')}</span></div><img src="assets/hank-oink.png" alt="Hank"></div>`;
  const page = inner => { app.innerHTML = `<main class="door">${SIGN}${inner}</main>`; };
  const discordBtn = (id, label) => `<button type="button" id="${id}" class="btn btn-primary" style="min-height:3rem;width:100%;font-size:var(--fs-body)"><i class="ph ph-discord-logo" style="font-size:1.25rem"></i>${label}</button>`;

  const used = (title, body) => page(`
    <div class="centre"><span class="kicker">Door's shut</span><h1>${title}</h1><p>${body}</p></div>
    <div class="card neon-tube-teal">${discordBtn('in', 'Sign in')}<span class="small">Not joined yet? Ask ${INVITER} for a new link.</span></div>`);
  try { sessionStorage.removeItem('fy_doorshut'); } catch (e) {}   // left over from the old sign-out dance
  const toYard = () => FY.signIn(`${location.origin}${location.pathname.replace(/claim\.html$/, 'dashboard.html')}`);
  // Signed in with no members row. They stay signed in: signing them out sent them round a loop of sign in, no
  // profile, signed out (27 Nov). Their own invite link is the way in; tapped while signed in, it binds with no new sign-in.
  const noProfile = () => {
    page(`<div class="centre"><span class="kicker">Members only</span><h1>No Farmyard profile on this Discord yet</h1>
      <p>Tap the invite link ${INVITER} sent you, on this phone. It opens straight to your spot.</p></div>
      <div class="card neon-tube-teal"><button type="button" id="out" class="btn btn-ghost" style="min-height:2.75rem;width:100%">Sign out</button></div>`);
    document.getElementById('out').addEventListener('click', () => Barn.signOut());
  };
  const noInvite = () => { used('No invite here', `This link has no invite on it. If you've already joined, just sign in. Otherwise ask ${INVITER} for your own link.`); document.getElementById('in').addEventListener('click', toYard); };

  if (!ok) {   // no invite on this link or this device (guarded pages land here)
    const s = await FY.session();
    if (s) {
      const me = await FY.me().catch(() => null);
      if (me) { location.replace('dashboard.html'); return; }
      noProfile(); return;
    }
    noInvite(); return;
  }
  // A link is a member's permanent door (RAY, 27 Nov): open = not claimed yet; member = its member is claimed, so
  // the link just signs them in; expired = unclaimed past 4 weeks; unknown = no such link.
  let st = null;
  try { st = await FY.rpc('claim_status', { p_token: token }); }
  catch (e) {   // claim_status not in the database yet: the old lookup, so open links keep working whichever lands first
    const n = await FY.rpc('claim_peek', { p_token: token }).catch(() => null);
    st = n ? { state: 'open', nickname: n } : { state: 'expired' };
  }
  st = st || { state: 'unknown' };
  const member = st.nickname || '';
  const session = await FY.session();

  if (st.state === 'unknown') { drop(); noInvite(); return; }
  if (st.state === 'expired') { drop(); used('This link has expired', 'Ask Hank for a new one.'); document.getElementById('in').addEventListener('click', toYard); return; }
  if (st.state === 'member') {
    drop();   // the token is in the URL for the round trip; a stored copy would only bounce a different Discord back here
    if (!session) {
      if (oauthErr) FY.toast(oauthErr);
      page(`<div class="centre"><span class="kicker">Your way back in</span>
          <h1 style="text-transform:uppercase">Welcome back, <span class="neon-pink">${esc(member)}</span></h1>
          <p style="max-width:38ch">Sign in with the same Discord as before and you're straight into the yard.</p></div>
        <div class="card neon-tube-teal">${discordBtn('in', 'Sign in with Discord')}</div>`);
      document.getElementById('in').addEventListener('click', () => FY.signIn(`${location.origin}${location.pathname}?claim=${token}`));
      return;
    }
    const me = await FY.me().catch(() => null);
    if (!me) { noProfile(); return; }   // a Discord with no profile can never take a claimed member's link
    if (String(me.nickname).toLowerCase() === member.toLowerCase()) { location.replace(me.setup_at ? 'dashboard.html' : 'setup.html'); return; }
  }
  if (!session) {
    if (oauthErr) FY.toast(oauthErr);
    page(`
      <div class="centre"><span class="kicker">${INVITER} has saved you a spot</span>
        <h1 style="text-transform:uppercase">Welcome, <span class="neon-pink">${esc(member)}</span></h1>
        <p style="max-width:38ch">Hank checks the door. Sign in with Discord, set up your profile, and you're in.</p></div>
      <div class="card neon-tube-teal" style="gap:16px">
        <div class="steps3"><div class="now"><span class="n">1</span>Sign in</div><div><span class="n">2</span>Your profile</div><div><span class="n">3</span>Into the yard</div></div>
        <div class="rule"></div>
        ${discordBtn('in', 'Sign in with Discord')}
        <div class="notes">
          <span><i class="ph ph-user-circle"></i><span>Use your own Discord. Whatever account you sign in with becomes ${esc(member)}.</span></span>
          <span><i class="ph ph-key"></i>Keep this link. It's your way back in.</span>
        </div>
      </div>
      <span class="small">Not ${esc(member)}? Tell ${INVITER}. They'll send you your own link.</span>`);
    document.getElementById('in').addEventListener('click', () => FY.signIn(`${location.origin}${location.pathname}?claim=${token}`));
    return;
  }

  // Signed in. A Discord that already owns a profile cannot take this one.
  const me = await FY.me().catch(() => null);
  if (me) {
    page(`
      <div class="centre"><span class="kicker">Wrong Discord</span>
        <h1 style="font-size:var(--fs-h1)">You're already in as <span class="neon-pink">${esc(me.nickname)}</span></h1>
        <p>${st.state === 'member' ? `This was <strong style="color:var(--fy-text)">${esc(member)}</strong>'s invite` : `This invite is for <strong style="color:var(--fy-text)">${esc(member)}</strong>`}. You can't use it while you're signed in as ${esc(me.nickname)}. The link still works.</p></div>
      <div class="card neon-tube-teal">
        <span style="font-size:var(--fs-sm);line-height:1.5;color:var(--fy-text-secondary)">If this is ${esc(member)}'s link, send it to them. They need to open it on their own phone or computer.</span>
        <button type="button" id="copy" class="btn btn-primary" style="min-height:2.875rem;width:100%"><i class="ph ph-copy" style="font-size:1.125rem"></i>Copy invite link</button>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <a class="btn btn-ghost" href="dashboard.html" style="flex:1 1 140px;min-height:44px">Back to my yard</a>
          <button type="button" id="switch" class="btn btn-ghost" style="flex:1 1 140px;min-height:2.75rem">Sign out and switch</button>
        </div></div>`);
    const url = `${location.origin}${location.pathname}?claim=${token}`;
    document.getElementById('copy').addEventListener('click', ev => {
      const b = ev.currentTarget;
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => { b.innerHTML = '<i class="ph ph-check" style="font-size:1.125rem"></i>Copied'; setTimeout(() => { b.innerHTML = '<i class="ph ph-copy" style="font-size:1.125rem"></i>Copy invite link'; }, 1800); }, () => FY.toast(url));
    });
    document.getElementById('switch').addEventListener('click', async () => { keep(token); Barn.voice.set(null); await FY.sb.auth.signOut(); location.href = `${location.pathname}?claim=${token}`; });
    return;
  }

  // Signed in, no profile: claim it, then on to New User Set-up.
  try { await FY.rpc('claim_profile', { p_token: token }); }
  catch (e) {
    if (/already claimed/.test(e.message)) { location.replace('dashboard.html'); return; }
    if (/link used|link expired|unknown/.test(e.message)) { drop(); used('This link has expired', 'Ask Hank for a new one.'); document.getElementById('in').addEventListener('click', () => location.href = 'dashboard.html'); return; }
    FY.toast(e.message); page(`<div class="centre"><h1>Something went wrong</h1><p>${esc(e.message)}. Try again, or ask ${INVITER}.</p></div>`); return;
  }
  drop();
  const after = await FY.me().catch(() => null);
  location.replace(after && after.setup_at ? 'dashboard.html' : 'setup.html');
})().catch(e => FY.toast(e.message));
</script>
</body>
</html>
