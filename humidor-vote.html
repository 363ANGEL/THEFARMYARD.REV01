<!doctype html>
<html lang="en-GB">
<head>

<title>The Farmyard · The Humidor · Vote</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">

<style>
/* 4.0 The Humidor · Vote (taste), ported from P15.003 HUMIDOR CHOOSE REV.05.dc.html.
   DS tokens the design reads that the site does not define yet (FARMYARD DS REV P01 values; bronze and the
   hint/popover edge are the site's own #cd7f32-like copper and #9eeae6 tube). */
:root{--color-accent-2:#a7a1db;--color-neutral-500:#9397ab;--medal-silver:#e4ecf0;--medal-bronze:#cd7f32;--hint-border:#9eeae6}
/* README §2: text x0.73 on tablet, x0.77 on mobile, never under 10px; title 32/26px */
.hv{--ts:1;display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:1099px){.hv{--ts:.73}.hm-head .hd2{font-size:32px}}
@media (max-width:699px){.hv{--ts:.77}.hm-head .hd2{font-size:26px}}
.t-k{font-size:max(10px,calc(var(--text-kicker) * var(--ts,1)))}
.t-m{font-size:max(10px,calc(var(--text-meta) * var(--ts,1)))}
.t-s{font-size:max(10px,calc(var(--text-small) * var(--ts,1)))}
.t-u{font-size:max(10px,calc(var(--text-ui) * var(--ts,1)))}
.t-b{font-size:max(10px,calc(var(--text-body-size) * var(--ts,1)))}
.t-c{font-size:max(10px,calc(var(--text-card-title) * var(--ts,1)))}
.t-br{font-size:max(10px,calc(var(--text-brand) * var(--ts,1)))}
.t-pt{font-size:max(10px,calc(var(--text-page-title) * var(--ts,1)))}
.t10{font-size:max(10px,calc(10px * var(--ts,1)))}
.t16{font-size:max(10px,calc(16px * var(--ts,1)))}
.t22{font-size:max(10px,calc(22px * var(--ts,1)))}
.t24{font-size:max(10px,calc(24px * var(--ts,1)))}
.hv .up{letter-spacing:.08em;text-transform:uppercase}
.hv .up6{letter-spacing:.06em;text-transform:uppercase}
.hv button,.hv select{font-family:inherit}
.hv-teal{color:var(--neon-teal)}
.hv-pinkh{margin:0;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--neon-pink-text);text-shadow:var(--text-glow-pink),0 0 6px color-mix(in srgb,var(--neon-pink) 80%,transparent)}
.hv-pinkk{font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--neon-pink-text);text-shadow:var(--text-glow-pink),0 0 6px color-mix(in srgb,var(--neon-pink) 80%,transparent);opacity:.7}
.hv-rule{height:1px;margin:0 18px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--neon-teal) 45%,transparent) 15%,color-mix(in srgb,var(--neon-teal) 45%,transparent) 85%,transparent)}
.hv-rule.in{margin:6px 0}
.hv-p{margin:0;line-height:1.5;color:var(--fy-text-label);max-width:none;text-wrap:pretty}
.hv-change{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:10px 12px;border:1px dashed color-mix(in srgb,var(--neon-teal) 50%,transparent);border-radius:10px;background:var(--fy-bg)}
.hv-change b{color:var(--neon-pink-text);font-weight:500}
.hv-box{display:flex;flex-direction:column;gap:16px;padding:14px 16px;border:1px solid var(--neon-teal);border-radius:10px;box-shadow:var(--glow-teal);min-width:0;background:var(--fy-bg)}

/* My preferences (sidebar copy at the top, inline copy at the foot of section 1) */
.hv-prefwrap{display:flex;flex-direction:column}
.hv-prefwrap .lab{margin-top:14px;color:var(--fy-text-label);padding:0 10px}
.hv-pref{display:flex;gap:10px;border-radius:10px;border:1px solid color-mix(in srgb,var(--fy-text) 60%,transparent);box-shadow:0 0 8px color-mix(in srgb,var(--fy-text) 30%,transparent);background:color-mix(in srgb,var(--fy-text) 15%,transparent)}
.hv-pref.same{border-color:var(--neon-green-tube);box-shadow:var(--glow-green)}
.hv-pref.side{flex-direction:column;align-items:stretch;margin-top:6px;padding:12px}
.hv-pref.inl{flex-wrap:wrap;align-items:flex-end;margin:14px 16px 16px;padding:12px 14px}
.hv-pref label{display:flex;flex-direction:column;gap:4px;min-width:0}
.hv-pref.side label{flex:0 0 auto}
.hv-pref.inl label{flex:1 1 130px}
.hv-pref .lt{letter-spacing:.08em;text-transform:uppercase;color:var(--fy-text)}
.hv-pref.inl .lt{color:var(--color-neutral-100);font-weight:600}
.hv-sel{min-height:44px;padding:0 10px;border-radius:8px;border:1px solid color-mix(in srgb,var(--fy-text) 60%,transparent);box-shadow:0 0 6px color-mix(in srgb,var(--fy-text) 35%,transparent);background:var(--fy-bg);color:var(--fy-text);cursor:pointer;outline:none;width:100%}
.hv-pref.inl .hv-sel{background:var(--fy-surface)}
.hv-sel:hover,.hv-sel:focus{border-color:var(--color-neutral-100);box-shadow:0 0 6px color-mix(in srgb,var(--color-neutral-100) 90%,transparent),0 0 16px color-mix(in srgb,var(--fy-text) 55%,transparent)}
.hv-tube{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:19px;background:transparent;cursor:pointer;letter-spacing:.08em;font-weight:600;white-space:nowrap;border:1.5px solid var(--color-neutral-100);color:var(--color-neutral-100);box-shadow:0 0 6px color-mix(in srgb,var(--fy-text) 35%,transparent);text-shadow:none}
.hv-tube:hover{box-shadow:0 0 8px color-mix(in srgb,var(--color-neutral-100) 90%,transparent),0 0 18px color-mix(in srgb,var(--fy-text) 55%,transparent)}
.hv-pref.inl .hv-tube{align-self:flex-end;min-height:44px;padding:0 14px}
.hv-pref .note{line-height:1.4;color:var(--fy-text);white-space:normal}
.hv-pref.inl .note{flex-basis:100%}
@media (max-width:699px){.hv-pref.inl label{flex:1 1 100%}.hv-pref.inl .hv-tube{align-self:center;margin:4px auto 0;padding:0 12px}}

/* Sections: gated, collapsible */
.hv-secs{display:flex;flex-direction:column;gap:64px;min-width:0}
@media (max-width:1099px){.hv-secs{gap:56px}}
@media (max-width:699px){.hv-secs{gap:44px}}
.hv-sec{display:flex;flex-direction:column;gap:0;min-width:0}
.hv-sh{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:10px;border:1px solid color-mix(in srgb,var(--color-neutral-100) 55%,transparent);box-shadow:0 0 6px color-mix(in srgb,var(--fy-text) 35%,transparent);background:color-mix(in srgb,var(--fy-bg) 60%,transparent);outline:none;cursor:pointer;min-height:44px}
.hv-sh:hover{background:color-mix(in srgb,var(--color-neutral-100) 6%,transparent)}
.hv-sh:focus-visible{border-color:var(--color-neutral-100)}
.hv-sh.glow{border-color:var(--neon-green-tube);box-shadow:0 0 8px color-mix(in srgb,var(--neon-green-tube) 60%,transparent)}
.hv-sh.open{border-color:color-mix(in srgb,var(--neon-teal) 35%,transparent);box-shadow:none}
.hv-sh.locked{border-color:color-mix(in srgb,var(--fy-text-label) 25%,transparent);box-shadow:none;opacity:.45;cursor:not-allowed}
.hv-sh.voted{border-color:color-mix(in srgb,var(--neon-teal) 45%,transparent);box-shadow:none;cursor:default;pointer-events:none}
.hv-shrow{display:flex;flex-wrap:nowrap;align-items:baseline;justify-content:space-between;gap:10px}
.hv-sh h2{margin:0;font-size:max(10px,calc(clamp(22px,2.6vw,28px) * var(--ts,1)));font-weight:700;letter-spacing:-.01em;white-space:nowrap;color:var(--color-neutral-100);text-shadow:0 0 4px color-mix(in srgb,var(--color-neutral-100) 80%,transparent),0 0 14px color-mix(in srgb,var(--fy-text) 45%,transparent)}
.hv-sh .verb{color:var(--fy-text-label);text-align:right}
.hv-sh .st{display:flex;align-items:center;gap:10px;margin-left:auto;letter-spacing:.08em;text-transform:uppercase;color:var(--fy-text);white-space:nowrap}
.hv-sh.locked .st{color:var(--fy-text-label)}
.hv-sh.voted .st{color:var(--neon-green-text)}
.hv-sh .arr{display:inline-block;line-height:1}
.hv-sh.open .arr{transform:rotate(180deg)}
@media (max-width:699px){.hv-shrow{flex-wrap:wrap;gap:4px 10px}.hv-sh h2{font-size:max(10px,calc(22px * var(--ts,1)));white-space:normal;text-wrap:balance}}
.hv-sb{display:grid;grid-template-rows:0fr;opacity:0}
.hv-sb.open{grid-template-rows:1fr;opacity:1}
.hv-sbi{min-height:0;overflow:hidden;margin:0 -12px;padding:0 12px}
.hv-sb.ov .hv-sbi{overflow:visible}
.hv-sbc{display:flex;flex-direction:column;gap:16px;padding:16px 0 14px}

/* 1 · Shape poster */
.hv-m1{display:flex;flex-direction:column;gap:0;min-width:0;border:1px solid var(--neon-teal);border-radius:10px;box-shadow:var(--glow-teal);background:linear-gradient(color-mix(in srgb,var(--neon-green-tube) 8%,transparent),color-mix(in srgb,var(--neon-green-tube) 8%,transparent)),var(--fy-bg);overflow:hidden}
.hv-rel{position:relative}
.hv-ell{position:absolute;inset:0;background:radial-gradient(ellipse 70% 30% at 50% 50%,color-mix(in srgb,var(--neon-teal) 10%,transparent),transparent 70%);pointer-events:none}
.hv-vl{position:absolute;top:50%;height:216px;margin-top:-108px;left:calc(136px + (100% - 200px) / 2);width:1px;background:color-mix(in srgb,var(--neon-teal) 18%,transparent);pointer-events:none}
@media (max-width:699px){.hv-vl{display:none}}
.poster{position:relative;height:244px;perspective:1000px;perspective-origin:50% 50%}
@media (max-width:699px){.poster{height:404px}}
.hv-arrow{position:absolute;border:0;background:transparent;color:var(--color-neutral-100);cursor:pointer;font-weight:700;line-height:1;z-index:20;display:grid;place-items:center;text-shadow:none;padding:0}
.hv-slide{position:relative;z-index:16;margin-top:-18px;display:flex;flex-direction:column;gap:14px;padding:16px 20px 18px}
@media (max-width:699px){.hv-slide{padding:12px 10px 14px}}
.hv-range{position:relative;width:100%;height:28px;background:transparent;margin:0;accent-color:var(--fy-text);-webkit-appearance:none;appearance:none;outline:none;padding:0;border:0;box-shadow:none}
.hv-range::-webkit-slider-runnable-track{height:28px;background:transparent}
.hv-range::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:3px;border-radius:50%;background:var(--color-neutral-100);border:2px solid var(--color-neutral-100);box-shadow:0 0 4px color-mix(in srgb,var(--color-neutral-100) 70%,transparent),0 0 10px color-mix(in srgb,var(--fy-text) 40%,transparent);cursor:pointer}
.hv-range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--color-neutral-100);border:2px solid var(--color-neutral-100);box-shadow:0 0 4px color-mix(in srgb,var(--color-neutral-100) 70%,transparent),0 0 10px color-mix(in srgb,var(--fy-text) 40%,transparent);cursor:pointer}
.hv-range:not(:disabled):hover::-webkit-slider-thumb{background:#fff;border-color:#fff;box-shadow:0 0 6px #fff,0 0 14px rgba(255,255,255,.85),0 0 26px color-mix(in srgb,var(--fy-text) 60%,transparent)}
.hv-range:not(:disabled):hover::-moz-range-thumb{background:#fff;border-color:#fff;box-shadow:0 0 6px #fff,0 0 14px rgba(255,255,255,.85),0 0 26px color-mix(in srgb,var(--fy-text) 60%,transparent)}
.hv-range:disabled::-webkit-slider-thumb{border-color:color-mix(in srgb,var(--fy-text) 40%,transparent);box-shadow:none;cursor:not-allowed}
.hv-range:disabled::-moz-range-thumb{border-color:color-mix(in srgb,var(--fy-text) 40%,transparent);box-shadow:none}
.hv-range:focus-visible{outline:2px solid var(--neon-teal);outline-offset:2px}
.hv-more{align-self:flex-start;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;background:color-mix(in srgb,var(--neon-teal) 6%,transparent);border:1px solid color-mix(in srgb,var(--neon-teal) 70%,transparent);border-radius:999px;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;color:var(--neon-teal);text-shadow:0 0 6px color-mix(in srgb,var(--neon-teal) 50%,transparent)}
.hv-more:hover{animation:none;color:#fff;background:color-mix(in srgb,var(--neon-teal) 22%,transparent);border-color:var(--hint-text);transform:translateY(-1px);text-shadow:0 0 6px var(--hint-border),0 0 14px color-mix(in srgb,var(--neon-teal) 90%,transparent);box-shadow:0 0 10px color-mix(in srgb,var(--hint-border) 95%,transparent),0 0 26px color-mix(in srgb,var(--neon-teal) 75%,transparent),0 0 48px color-mix(in srgb,var(--neon-teal) 40%,transparent)}
.hv-photo{flex:1;position:relative;min-height:150px;border-radius:8px;overflow:hidden;border:1px solid color-mix(in srgb,var(--neon-teal) 35%,transparent)}
.hv-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.hv-cell{display:flex;flex-direction:column;gap:3px;padding:10px 12px;box-shadow:-1px 0 0 color-mix(in srgb,var(--fy-text-label) 25%,transparent),0 -1px 0 color-mix(in srgb,var(--fy-text-label) 25%,transparent)}
.hv-dl{display:grid;grid-template-columns:minmax(96px,auto) 1fr;gap:10px;align-items:baseline}
.hv-dl .k{letter-spacing:.06em;text-transform:uppercase;color:var(--neon-teal);white-space:nowrap}
.hv-dl .v{line-height:1.45;color:var(--fy-text-body)}

/* 2 · Plant */
.hv-origins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hv-orig{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:10px;background:var(--fy-surface);text-align:left;min-height:44px;color:inherit}
.hv-plant{display:flex;flex-wrap:wrap;gap:16px;border:1px solid var(--neon-teal);border-radius:10px;box-shadow:var(--glow-teal);padding:16px;align-items:stretch;background:var(--fy-bg)}
.hv-plantg{flex:1 1 420px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:center}
.hv-plantg2{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:14px;align-items:center}
.hv-plantimg{position:relative;min-height:260px;aspect-ratio:1/1.05;border-radius:8px;overflow:hidden;background:var(--fy-bg)}
.hv-plantimg img{position:absolute;left:0;top:0;width:62%;height:100%;object-fit:cover;object-position:0% 50%;filter:saturate(.85) contrast(1.05);mask-image:linear-gradient(90deg,#000 70%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent)}
.hv-strrow{order:-1;flex:1 1 100%;display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid color-mix(in srgb,var(--neon-teal) 25%,transparent)}
.hv-str{flex:1;min-height:44px;min-width:0;padding:4px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:19px;background:transparent;cursor:pointer}
/* 3 · Wrapper and flavour */
.hv-m3g{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.hv-taste{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center}
@media (max-width:699px){
  .hv-origins{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .hv-plantg{grid-template-columns:minmax(0,1fr);gap:14px}
  .hv-plantg2{grid-template-columns:minmax(0,1fr) 84px;gap:10px}
  .hv-m3g{grid-template-columns:minmax(0,1fr);gap:14px}
  .hv-taste{grid-template-columns:120px 1fr}
}
/* 4 · Budget */
.hv-budgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px}
.hv-pill{min-height:48px;padding:0 16px;border-radius:19px;background:transparent;cursor:pointer}

/* Already voted, and Your vote */
.hv-voted{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--neon-teal);border-radius:10px;box-shadow:var(--glow-teal);background:var(--fy-bg)}
.hv-edit{align-self:center;min-height:48px;padding:0 32px;margin-top:4px;border-radius:19px;background:transparent;cursor:pointer;letter-spacing:.1em;font-weight:600;border:2px solid var(--neon-pink-tube);color:var(--neon-pink-text);text-shadow:var(--text-glow-pink)}
.hv-edit:hover{animation:none;background:color-mix(in srgb,var(--neon-pink-tube) 14%,transparent);box-shadow:0 0 12px var(--neon-pink-tube),0 0 30px color-mix(in srgb,var(--neon-pink) 70%,transparent);color:#fff}
.hv-vote{display:flex;flex-direction:column;gap:14px;padding:16px;border:2px solid var(--neon-pink-tube);border-radius:10px;box-shadow:var(--glow-pink);background:var(--fy-bg)}
.hv-vrows{display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr);gap:8px 14px;align-items:baseline}
.hv-vrows button{justify-self:start;background:none;border:0;padding:0;min-height:24px;cursor:pointer;text-align:left}
.hv-submit{min-height:44px;padding:0 22px;border-radius:19px;background:transparent;letter-spacing:.08em;font-weight:600;border:2px solid var(--neon-pink-tube);color:var(--neon-pink-text);box-shadow:var(--glow-pink);text-shadow:var(--text-glow-pink);cursor:pointer}
.hv-submit:disabled{border-color:color-mix(in srgb,var(--neon-pink-tube) 40%,transparent);color:color-mix(in srgb,var(--neon-pink-text) 50%,transparent);box-shadow:none;text-shadow:none;cursor:not-allowed;opacity:1}

/* Cigar close-up */
.hv-zoom{position:fixed;inset:0;z-index:1000;background:rgba(14,15,24,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;box-sizing:border-box;cursor:zoom-out}
.hv-zoom[hidden]{display:none}
.hv-close{width:44px;height:44px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--fy-text) 60%,transparent);background:transparent;color:var(--fy-text);line-height:1;cursor:pointer;box-shadow:0 0 8px color-mix(in srgb,var(--fy-text) 30%,transparent);padding:0}

/* Motion (README "Behaviour notes"), only when welcome */
@media (prefers-reduced-motion:no-preference){
  @keyframes arrowBreath{0%,100%{opacity:.6;filter:drop-shadow(0 0 1px color-mix(in srgb,var(--color-neutral-100) 20%,transparent))}50%{opacity:1;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--color-neutral-100) 45%,transparent))}}
  @keyframes antRun{0%{left:0%;opacity:0;transform:scale(.6);box-shadow:0 0 2px color-mix(in srgb,var(--fy-text) 20%,transparent)}50%{left:50%;opacity:1;transform:scale(1);box-shadow:0 0 6px color-mix(in srgb,var(--fy-text) 90%,transparent),0 0 14px color-mix(in srgb,var(--neon-teal) 70%,transparent)}100%{left:100%;opacity:0;transform:scale(.6);box-shadow:0 0 2px color-mix(in srgb,var(--fy-text) 20%,transparent)}}
  @keyframes selPulse{0%,100%{filter:drop-shadow(0 0 0 color-mix(in srgb,var(--color-neutral-100) 0%,transparent))}50%{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--color-neutral-100) 50%,transparent))}}
  @keyframes strPulse{0%,100%{filter:drop-shadow(0 0 0 color-mix(in srgb,var(--color-neutral-100) 0%,transparent))}50%{filter:drop-shadow(0 0 3px color-mix(in srgb,var(--color-neutral-100) 35%,transparent))}}
  @keyframes cardWobble{0%{transform:rotate(0)}20%{transform:rotate(-1.6deg) scale(1.02)}45%{transform:rotate(1.3deg) scale(1.02)}70%{transform:rotate(-.6deg) scale(1.02)}100%{transform:rotate(0) scale(1.02)}}
  .hv [data-arrow-breath]{animation:arrowBreath 4s ease-in-out infinite}
  .hv [data-arrow-breath].late{animation-delay:2s}
  .hv [data-ants]{animation:antRun 4.2s linear infinite}
  .hv [data-ants].late{animation-delay:2.1s}
  .hv button:not([data-flash]):not([data-learn]):not(:disabled):not([aria-label="Close"]),.hv select{animation:selPulse 3.2s ease-in-out infinite}
  .hv .poster button{animation:none!important}
  .hv button[data-str]{animation:strPulse 2.6s ease-in-out infinite!important;transition:filter .2s}
  .hv button[data-str]:hover{animation:none!important;filter:drop-shadow(0 0 4px rgba(255,255,255,.6)) drop-shadow(0 0 10px color-mix(in srgb,var(--color-neutral-100) 25%,transparent))!important}
  .hv button[data-card="on"]:hover{animation:cardWobble .55s ease-in-out both!important;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--color-neutral-100) 75%,transparent)) drop-shadow(0 0 16px color-mix(in srgb,var(--fy-text) 35%,transparent))!important}
  .hv .hv-more{animation:infoBreath 2.8s ease-in-out infinite;transition:background .2s ease-out,color .2s ease-out,border-color .2s ease-out,transform .2s ease-out}
  .hv .hv-more:hover{animation:none}
  .hv .hv-edit{animation:editFlash 1.4s ease-in-out infinite;transition:background .2s}
  .hv .hv-edit:hover{animation:none}

      {name:'Parejo',tag:'Predictable · even burn · every size',smoke:'Predictable. The same mouthful of smoke from light to stub, so you taste the blend, not the shape. Burns straight if you light it straight. If something goes wrong it was the cigar or the cutter, not the geometry. For a first night that is the point.',why:'The shape that needs no excuse. Straight sides are the easiest to roll, so they are cheapest to make, most consistent, and come in the widest run of sizes. The smoke stays the same from first puff to last; what changes is the blend, not the geometry.',draw:'Even and open. What the roller intended is what you get.',arc:'Flat. The last third gets warmer and stronger, but that is the leaf, not the shape.',range:'Broad. Every brand, every size, every price.',fame:'Montecristo No.4 · Cohiba Robusto · Padrón 2000',kind:'Straight · the default',clip:'polygon(0 8%,3% 0,96% 0,100% 50%,96% 100%,3% 100%,0 92%)',what:'Straight sides, rounded head, open foot. Nine out of ten cigars on a shelf.',rings:'40–54',lens:'4½–7½ in',cap:'Rounded, triple cap',cuts:['Straight','Punch','V-cut'],tip:'Anything works. Cut just above the cap line.',countries:['Cuba','Dominican Rep.','Nicaragua','Honduras'],brands:[['Montecristo','No.4 is the best-selling cigar in the world'],['Romeo y Julieta','Mild Cuban, easy first box'],['Arturo Fuente','Dominican, smooth, everywhere'],['Padrón','Nicaraguan, box-pressed, bolder'],['Oliva','Serie G or O, good value']]},

      case 'card': if (S.focus !== i) S.focus = i; else S.zoom = true; break;
      case 'dot': S.focus = i; break;
      case 'rot': measure(); S.focus = (S.focus + i + SHAPES.length) % SHAPES.length; break;
      case 'more': S.moreInfo = !S.moreInfo; break;
      case 'brands': S.brandsInfo = !S.brandsInfo; break;
      case 'prefsub': submitPrefs(); break;
      case 'origin': {
        const o = model().origins.find(x => x.key === v); if (!o || !(o.rolls || o.on)) return;
        const pr = { ...S.profile }; let arr = (pr.origins || (pr.origin ? [pr.origin] : [])).slice();
        if (arr.includes(v)) arr = arr.filter(x => x !== v); else { arr.push(v); if (arr.length > 2) arr = arr.slice(-2); }
        if (arr.length) { pr.origins = arr; pr.origin = arr.join(' & '); } else { delete pr.origins; delete pr.origin; }
        S.profile = pr; break;
      }
      case 'leaf': S.leaf = i; break;
      case 'str': setProfile('strength', v); S.leaf = { Mild: 2, Medium: 1, Full: 0 }[v]; break;
      case 'sw': {
        const pr = { ...S.profile }; const cur = pr.wr; let nx;
        if (!cur) nx = [i, i]; else if (cur[0] === i && cur[1] === i) nx = null; else if (i < cur[0]) nx = [i, cur[1]]; else if (i > cur[1]) nx = [cur[0], i]; else nx = [i, i];
        if (nx) pr.wr = nx; else delete pr.wr; S.swatch = i; S.profile = pr; break;
      }
      case 'wrapclear': { const pr = { ...S.profile }; delete pr.wr; S.profile = pr; break; }
      case 'fam': {
        const t = model().tasteRows.find(x => x.f === v); if (!t || t.cur !== 'pointer') return;
        const pr = { ...S.profile }; let fl = [...(pr.flavour || [])];
        if (fl.includes(v)) fl = fl.filter(x => x !== v); else { fl.push(v); if (fl.length > 3) fl.shift(); }
        if (fl.length) pr.flavour = fl; else delete pr.flavour; S.profile = pr; break;
      }
      case 'budget': setProfile('budget', v); break;
      case 'go': return scrollToEl(document.getElementById('m' + i));
      case 'submit': return submitVote();
      case 'edit': return editTaste();
      case 'zclose': S.zoom = false; break;
      case 'zstop': return;
      default: return;
    }
    draw();
  }

  function wire() {
    root.addEventListener('click', e => {
      const el = e.target.closest('[data-a]'); if (!el || !root.contains(el)) return;
      if (el.disabled) return;
      act(el.getAttribute('data-a'), el);
    });
    root.addEventListener('keydown', e => {
      const h = e.target.closest('.hv-sh'); if (h && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleSec(+h.getAttribute('data-i')); }
    });
    root.addEventListener('change', e => {
      const f = e.target.getAttribute('data-f'); if (!f) return; const val = e.target.value; const nf = { ...S.filt };
      if (f === 'girth') { const G = { skinny: [null, 42], medium: [43, 50], fat: [52, null] }[val] || [null, null]; if (G[0] == null) delete nf.minR; else nf.minR = G[0]; if (G[1] == null) delete nf.maxR; else nf.maxR = G[1]; }
      if (f === 'maxT') { if (val === '') delete nf.maxT; else nf.maxT = +val; }
      if (f === 'shape') { if (!val) delete nf.shape; else { nf.shape = val; const k = SHAPES.findIndex(x => x.name === val); if (k >= 0) S.focus = k; } }
      S.filt = nf; draw();
    });
    const onRange = e => { const n = +e.target.value; const fx = SHAPES[S.focus]; if (model().ladder.locked) return; S.sizeIdx = { ...S.sizeIdx, [fx.name]: n }; draw(); };
    R.range.addEventListener('input', onRange); R.range.addEventListener('change', onRange);
    window.addEventListener('keydown', e => { if (e.key === 'Escape' && S.zoom) { S.zoom = false; draw(); } });
    let rt = null; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { measure(); draw(); }, 80); });
  }

  // R8: the poll redraws only round-dependent, non-input parts. If the round moves on under an open form,
  // the submit button becomes a notice and every pick stays.
  function onPoll(d) {
    data = d || { stage: null, round: null };
    if (data.round) lastN = data.round.n;
    if (!S.voted) {
      if (formRound && formRound.status === 'collecting' && (!data.round || data.round.id !== formRound.id || data.round.status !== 'collecting')) movedOn = true;
      else if (!formRound && data.round && data.round.status === 'collecting') formRound = { id: data.round.id, status: 'collecting' };
    }
    draw(true);
  }

  (async function () {
    const H = await Humidor.start('vote');
    if (!H) { const b = document.getElementById('hm-body'); if (b && b.textContent.trim()) FY.toast(b.textContent.trim()); return; }
    me = H.me; data = H.data || { stage: null, round: null };
    if (data.round) lastN = data.round.n;
    S.voted = !!mineRow();
    formRound = data.round ? { id: data.round.id, status: data.round.status } : null;
    skeleton(H.main);
    draw(); if (measure()) draw();
    Humidor.poll(onPoll);   // synchronous onChange
  })().catch(e => FY.toast(e.message));
})();
</script>
</body>
