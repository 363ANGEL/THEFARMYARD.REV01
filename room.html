<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Farmyard · Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="app.css?v=20261119a">
<link rel="stylesheet" href="farmyard.css?v=20261119a">
<link rel="stylesheet" href="barn.css?v=20261119a">
<script src="fy-clucks.js?v=20261119a"></script>
</head>
<body>
<div id="app"><main class="door"><p class="muted">Loading…</p></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=20261119a"></script><script src="app.js?v=20261119a"></script><script src="barn.js?v=20261119a"></script><script src="presence.js?v=20261119a"></script><script src="sidebar-subs.js?v=20261119a"></script>
<script>
/* 2.0 Room Template: shell + online strip + Coming Soon holding block. ?room=<id> picks the copy
   (ids match the fy.room registry); anything else falls back to "New room". Copy from the 2.0 design. */
window.FY_ROOMS = {
  new:      { title: 'New room',    tag: 'One line on what happens in here.',                        head: "Hank's still wiring this one up.",   body: "The room is on the map but the lights aren't on yet. Check the Calendar for when it opens." },
  poker:    { title: 'Poker',       tag: "Friday nights · Hold'em · 1 buy-in = 5 tk",                head: "The table's not set yet.",           body: "Hank's still counting the tk. First night gets announced on the Calendar." },
  football: { title: 'Football',    tag: 'One pool per match · call the score · tk on the line',     head: "Kick-off's not till next slice.",    body: 'The fixtures feed is still being wired. Calls, pools and settle-ups land when it opens.' },
  humidor:  { title: 'The Humidor', tag: 'Cigars, whisky and the monthly vote',                      head: 'The Humidor moves in here soon.',    body: "It's still running on the old page. The vote, results and archive will come across in one go." },
  calendar: { title: 'Calendar',    tag: 'Poker nights, fixtures, birthdays, money events',          head: "Hank hasn't hung the Calendar yet.", body: 'Dates will show up here once the rooms start filling it.' },
  arcade:   { title: 'Arcade',      tag: 'Cabinets, boards and lobbies',                             head: 'The cabinets are still in crates.',  body: 'Neon Snake and the high-score boards land in a later slice. Steam and Worms lobbies after that.' },
  movies:   { title: 'Movie night', tag: 'One film, one vote, Friday late',                          head: "Projector's not bolted up yet.",     body: 'Voting and the watch-along come in a later slice. Keep your suggestions for the wall.' },
  jukebox:  { title: 'Jukebox',     tag: 'Queue tracks, Hank keeps the aux',                         head: 'The jukebox is unplugged.',          body: 'Spotify linking and the shared queue come in a later slice.' },
  whisky:   { title: 'Whisky club', tag: 'One bottle a month, tasting notes on the wall',            head: "The bottle's still sealed.",         body: 'Monthly dram, tasting notes and the bottle vote come in a later slice.' },
  chess:    { title: 'Chess club',  tag: 'Ladder, blitz nights, one board at a time',                head: "The board's not set.",               body: 'Ladder, challenges and blitz nights come in a later slice. Lichess linking too.' },
};
/* The swinging "UNDER CONSTRUCTION" sign, static copy of the 0.0 design's sign (fy-sign classes in farmyard.css). */
window.FY_SIGN = (() => {
  const svg = '<svg viewBox="0 0 100 110" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="22" width="76" height="76" rx="10"/><path d="M12 46h76M32 10v22M68 10v22"/></g></svg>';   /* simple ivory line calendar (RAY, 18 Nov) */
  return `<div class="fy-sign" aria-hidden="false" style="--sg-tube:var(--neon-teal);--sg-glow:var(--neon-teal);--sg-rgb:95,211,207;--sg-text:#c8f4f2">
    <span class="fy-sign-wire is-l"></span><span class="fy-sign-wire is-r"></span>
    <div class="fy-sign-plate"><span class="fy-sign-edge" aria-hidden="true"></span>
      <span class="fy-sign-icon is-ivory" aria-hidden="true">${svg}</span>
      <h2 class="fy-sign-title">UNDER&nbsp;C<span class="is-flick">O</span>NSTRUCTION</h2>
    </div></div>`;
})();
/* Shared holding-block renderer; about.html reuses it. The sign hangs off the main panel
   itself (Barn.hangSign), not this head, so the frame never clips it. */
window.FY_HOLDING = (R, esc) => `
  <div class="fy0-head" style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:8px 16px;">
    <div class="fy-pagehead"><h1 class="t-title-b" style="margin:0;">${esc(R.title)}</h1></div>
  </div>
  <div style="display:flex; flex-direction:column; gap:10px; padding:16px 18px; border:1px solid var(--neon-teal); border-radius:10px; box-shadow:var(--glow-teal); background:var(--fy-bg); min-width:0; max-width:720px;">
    <span class="kicker">Current concept</span>
    <h3 style="margin:0; font-family:var(--font-heading); font-weight:500; font-size:var(--fs-h2); line-height:1.1; color:var(--neon-pink-text); text-shadow:var(--text-glow-pink); text-wrap:balance;">${esc(R.title)}</h3>
    <span style="font-size:var(--fs-body); color:var(--fy-text-secondary);">${esc(R.tag)}</span>
    <div style="border-top:1px solid var(--rule-teal); padding-top:10px; display:flex; flex-direction:column; gap:4px;">
      <span style="font-size:var(--fs-body); font-weight:600;">${esc(R.head)}</span>
      <p style="margin:0; max-width:64ch; font-size:var(--fs-body); line-height:1.5; color:var(--fy-text-secondary);">${esc(R.body)}</p>
    </div>
  </div>`;
window.FY_SUGG_BOX = `
  <div style="display:flex; flex-direction:column; align-items:center; gap:16px; max-width:720px; box-sizing:border-box; padding:22px; border:1px solid var(--neon-teal); border-radius:12px; box-shadow:var(--glow-teal); background:var(--fy-bg);">
    <span style="align-self:flex-start; color:var(--neon-teal); text-shadow:0 0 6px var(--neon-teal), 0 0 14px rgba(95,211,207,.45);" class="lot-label">Site Suggestion Box - What should we add next?</span>
    <form id="sugg" style="display:flex; flex-direction:column; align-items:center; gap:12px; width:100%;">
      <span style="align-self:flex-start; margin-bottom:-8px; font-size:0.8125rem; line-height:1.5; font-style:italic; color:var(--color-neutral-400);">Submit your comments below.</span>
      <textarea class="input" id="sugg-text" rows="4" required maxlength="280" placeholder="Games, rooms, rules, anything..." aria-label="Your suggestion" style="width:100%; box-sizing:border-box; resize:vertical; border-color:var(--neon-teal); font-family:inherit;"></textarea>
      <button type="submit" class="btn btn-primary" style="min-height:2.25rem; align-self:flex-start; font-size:0.8125rem;">Send it</button>
    </form>
  </div>`;
window.FY_WIRE_SUGG = (main, roomKey) => {
  const form = main.querySelector('#sugg');
  if (!form) return;
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const text = main.querySelector('#sugg-text').value.trim();
    if (!text) return;
    try { await FY.rpc('suggest', { p_room: roomKey, p_body: text }); }
    catch (e) { FY.toast(e.message); return; }
    form.outerHTML = '<span style="display:flex; align-items:center; gap:8px; font-size:0.8125rem; min-height:60px; color:var(--neon-teal);"><i class="ph ph-check-circle" style="font-size:1.25rem; text-shadow:0 0 6px var(--neon-teal);"></i>Thanks. Hank has it.</span>';
  });
};

(async function () {
  const key = new URLSearchParams(location.search).get('room') || 'new';
  const R = window.FY_ROOMS[key] || window.FY_ROOMS.new;
  const B = await Barn.open(window.FY_ROOMS[key] ? key : 'new'); if (!B) return;
  Presence.join(B.me).catch(() => {});
  document.title = 'The Farmyard · ' + R.title;
  B.main.innerHTML = window.FY_HOLDING(R, FY.esc) + window.FY_SUGG_BOX;
  Barn.hangSign(B.main, window.FY_SIGN);
  window.FY_WIRE_SUGG(B.main, window.FY_ROOMS[key] ? key : 'new');
  if (key === 'calendar') await renderCalendar(B);
})().catch(e => FY.toast(e.message));

/* The Calendar room: a month grid with an icon on every day that has something scheduled (RAY, 18 Nov).
   Sources: filed poker nights, member birthdays, football fixtures. Money events are not on it yet. */
async function renderCalendar(B) {
  const main = B.main, card = main.querySelector('.fy0-head') && main.querySelector('.fy0-head').nextElementSibling; if (!card) return;
  const esc = FY.esc;
  let events = [], members = [], pools = [], mine = [];
  const load = async () => {
    [events, members, pools, mine] = await Promise.all([
      FY.q('event').select('type_key,played_at').is('voided_at', null).then(r => r.data || []).catch(() => []),
      FY.q('member').select('nickname,birth_day,birth_month').then(r => r.data || []).catch(() => []),
      FY.q('pool').select('fixture,kickoff').then(r => r.data || []).catch(() => []),
      FY.q('cal_event').select('id,created_by,title,event_date,event_time,note,icon').then(r => r.data || []).catch(() => []),
    ]);
  };
  await load();
  const KIND = { poker: { icon: 'ph ph-club', label: 'Poker night' }, birthday: { icon: 'ph ph-cake', label: 'Birthday' }, football: { icon: 'ph ph-soccer-ball', label: 'Football' }, party: { icon: 'ph ph-confetti', label: 'Party' }, other: { icon: 'ph ph-star', label: 'Other' } };
  const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const itemsFor = (year, month) => {
    const out = {}; const add = (k, kind, text, extra) => (out[k] = out[k] || []).push({ kind, text, ...(extra || {}) });
    events.filter(e => e.type_key === 'poker').forEach(e => { const d = new Date(e.played_at); if (d.getFullYear() === year && d.getMonth() === month) add(dayKey(d), 'poker', 'Poker night'); });
    pools.forEach(p => { const d = new Date(p.kickoff); if (d.getFullYear() === year && d.getMonth() === month) add(dayKey(d), 'football', p.fixture); });
    members.forEach(m => { if (m.birth_day && m.birth_month && m.birth_month - 1 === month) add(dayKey(new Date(year, month, m.birth_day)), 'birthday', m.nickname + "'s birthday"); });
    mine.forEach(e => { const [ey, em] = e.event_date.split('-').map(Number); if (ey === year && em - 1 === month) add(e.event_date, KIND[e.icon] ? e.icon : 'other', e.title, { ev: e }); });
    Object.values(out).forEach(list => list.sort((a, b) => ((a.ev && a.ev.event_time) || '').localeCompare((b.ev && b.ev.event_time) || '')));
    return out;
  };
  const now = new Date(); let y = now.getFullYear(), mo = now.getMonth(), picked = null, editing = null;
  if (!document.getElementById('cal-css')) {
    const st = document.createElement('style'); st.id = 'cal-css';
    st.textContent = `.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.25rem}
      .cal-dow{text-align:center;font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--fy-text-label);padding:.25rem 0}
      .cal-day{position:relative;min-height:3.6rem;box-sizing:border-box;padding:.25rem .3rem;border:1px solid var(--rule-teal);border-radius:8px;background:transparent;color:var(--fy-text-secondary);font:inherit;font-size:var(--fs-sm);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.15rem}
      .cal-day.out{opacity:.35;cursor:default}.cal-day.has{border-color:var(--neon-teal)}.cal-day.today{border-color:var(--neon-pink-tube);box-shadow:var(--glow-pink)}.cal-day.sel{background:rgba(95,211,207,.12)}
      .cal-ic{display:flex;flex-wrap:wrap;gap:.2rem;font-size:1.15rem;line-height:1}
      .cal-ic .poker,.cal-lg .poker{color:var(--neon-pink-text)}.cal-ic .birthday,.cal-lg .birthday{color:#ffd84a}.cal-ic .football,.cal-lg .football{color:var(--neon-green-text)}.cal-ic .party,.cal-lg .party{color:#c9a7ff}.cal-ic .other,.cal-lg .other,.cal-row .other{color:var(--neon-teal);background:none;width:auto;height:auto}   /* a site-wide .other rule paints a teal square otherwise */
      .cal-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--fs-body)}.cal-row .rowbtn{min-height:2rem}
      #cal-form{display:flex;flex-direction:column;gap:12px}#cal-form .two{display:flex;gap:10px;flex-wrap:wrap}#cal-form .two>*{flex:1 1 9rem}
      .cal-nav{min-height:2.25rem;min-width:2.25rem;padding:0 .6rem}`;
    document.head.appendChild(st);
  }
  const draw = () => {
    const items = itemsFor(y, mo), first = new Date(y, mo, 1), lead = (first.getDay() + 6) % 7, days = new Date(y, mo + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push('<span class="cal-day out" aria-hidden="true"></span>');
    for (let d = 1; d <= days; d++) {
      const k = dayKey(new Date(y, mo, d)), it = items[k] || [], today = k === dayKey(now);
      cells.push(`<button type="button" class="cal-day${it.length ? ' has' : ''}${today ? ' today' : ''}${picked === k ? ' sel' : ''}" data-day="${k}" aria-label="${d} ${first.toLocaleString('en-GB', { month: 'long' })}${it.length ? ', ' + it.map(x => x.text).join(', ') : ''}">
        <span>${d}</span><span class="cal-ic">${it.slice(0, 3).map(x => `<i class="${KIND[x.kind].icon} ${x.kind}" title="${esc(x.text)}"></i>`).join('')}${it.length > 3 ? `<span style="font-size:var(--fs-xs)">+${it.length - 3}</span>` : ''}</span></button>`);
    }
    // Real session: the creator, or an admin. Previewing a named member: only that member's own events. Previewing a
    // generic member: nobody's (the preview wears your id, so it must not inherit your edit rights).
    const canEdit = x => x.ev && (B.preview ? (Barn.previewMemberId() ? x.ev.created_by === Barn.previewMemberId() : false) : (x.ev.created_by === B.me.id || B.leader));
    const hhmm = t => (t || '').slice(0, 5);
    const detail = picked ? `<div style="border-top:1px solid var(--rule-teal);padding-top:10px;display:flex;flex-direction:column;gap:6px">
      <span style="font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--fy-text-label)">${new Date(picked + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</span>
      ${(items[picked] || []).map(x => `<div class="cal-row"><i class="${KIND[x.kind].icon} ${x.kind}" style="font-size:1.2rem"></i><span style="flex:1;min-width:8rem"><strong>${esc(x.text)}</strong>${x.ev && x.ev.event_time ? ` <span style="color:var(--fy-text-label)">${hhmm(x.ev.event_time)}</span>` : ''}${x.ev && x.ev.note ? `<br><span style="color:var(--fy-text-secondary);font-size:var(--fs-sm)">${esc(x.ev.note)}</span>` : ''}</span>
        ${canEdit(x) ? `<button type="button" class="rowbtn" data-edit="${x.ev.id}">Edit</button><button type="button" class="rowbtn warn" data-del="${x.ev.id}">Delete</button>` : ''}</div>`).join('') || '<span style="font-size:var(--fs-sm);color:var(--fy-text-label)">Nothing on this day. Use Create event below.</span>'}</div>` : '';
    card.style.maxWidth = '720px';
    card.innerHTML = `<div style="display:flex;align-items:center;gap:8px">
        <button type="button" class="btn btn-ghost cal-nav" data-nav="-1" aria-label="Previous month"><span aria-hidden="true" style="font-size:1.25rem;line-height:1">&#8249;</span></button>
        <span class="t-module" style="flex:1;text-align:center">${first.toLocaleString('en-GB', { month: 'long', year: 'numeric' })}</span>
        <button type="button" class="btn btn-ghost cal-nav" data-nav="1" aria-label="Next month"><span aria-hidden="true" style="font-size:1.25rem;line-height:1">&#8250;</span></button></div>
      <div class="cal-grid">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(n => `<span class="cal-dow">${n}</span>`).join('')}${cells.join('')}</div>
      ${detail}
      <div class="cal-lg" style="display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--fy-text-label)">${Object.entries(KIND).map(([k, v]) => `<span><i class="${v.icon} ${k}" style="margin-right:.3rem;font-size:1rem;vertical-align:-2px"></i>${v.label}</span>`).join('')}</div>`;
  };

  // ---- Create / edit event (any member; their own only, admins any) ----
  const boxCss = card.getAttribute('style');
  const form = document.createElement('div'); form.id = 'cal-form-card'; form.setAttribute('style', boxCss); form.style.maxWidth = '720px';
  card.after(form);
  const drawForm = () => {
    const e = editing && mine.find(x => x.id === editing);
    form.innerHTML = `<span class="t-module">${e ? 'Edit event' : 'Create event'}</span>
      <form id="cal-form" autocomplete="off">
        <div class="field"><label for="ce-title">Title</label><input class="input" id="ce-title" required maxlength="80" placeholder="e.g. Friday poker night" value="${e ? esc(e.title) : ''}"></div>
        <div class="two"><div class="field"><label for="ce-date">Date</label><input class="input" id="ce-date" type="date" required value="${e ? e.event_date : (picked || dayKey(now))}"></div>
          <div class="field"><label for="ce-time">Time (optional)</label><input class="input" id="ce-time" type="time" value="${e && e.event_time ? e.event_time.slice(0, 5) : ''}"></div>
          <div class="field"><label for="ce-icon">Icon</label><select class="input" id="ce-icon">${Object.entries(KIND).map(([k, v]) => `<option value="${k}" ${e && e.icon === k ? 'selected' : ''}>${v.label}</option>`).join('')}</select></div></div>
        <div class="field"><label for="ce-note">Note (optional)</label><input class="input" id="ce-note" maxlength="280" placeholder="Where, who, what to bring" value="${e && e.note ? esc(e.note) : ''}"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" style="min-height:2.5rem">${e ? 'Save changes' : 'Add to the Calendar'}</button>${e ? '<button type="button" class="btn btn-ghost" id="ce-cancel" style="min-height:2.5rem">Cancel</button>' : ''}</div>
        <span style="font-size:var(--fs-xs);color:var(--fy-text-label)">Everyone in the yard sees it and gets a notice on their profile.</span>
      </form>`;
    form.querySelector('#cal-form').addEventListener('submit', async ev => {
      ev.preventDefault();
      const args = { p_title: form.querySelector('#ce-title').value, p_date: form.querySelector('#ce-date').value, p_time: form.querySelector('#ce-time').value || null, p_note: form.querySelector('#ce-note').value || null, p_icon: form.querySelector('#ce-icon').value };
      const btn = ev.submitter || ev.target.querySelector('button'); btn.disabled = true;
      try {
        if (editing) await FY.rpc('cal_update', { p_id: editing, ...args }); else await FY.rpc('cal_create', args);
        FY.toast(editing ? 'Event updated.' : 'Event added.');
        const [yy, mm] = args.p_date.split('-').map(Number); y = yy; mo = mm - 1; picked = args.p_date; editing = null;
        await load(); draw(); drawForm();
      } catch (er) { FY.toast(er.message); btn.disabled = false; }
    });
    const cancel = form.querySelector('#ce-cancel'); if (cancel) cancel.addEventListener('click', () => { editing = null; drawForm(); });
  };

  card.addEventListener('click', async ev => {
    const nav = ev.target.closest('[data-nav]'), day = ev.target.closest('[data-day]'), ed = ev.target.closest('[data-edit]'), del = ev.target.closest('[data-del]');
    if (nav) { mo += Number(nav.dataset.nav); if (mo < 0) { mo = 11; y--; } if (mo > 11) { mo = 0; y++; } picked = null; draw(); }
    else if (ed) { editing = ed.dataset.edit; drawForm(); form.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    else if (del) {
      if (!del.dataset.armed) { del.dataset.armed = '1'; del.textContent = 'Tap again to delete'; setTimeout(() => { if (del.isConnected) { delete del.dataset.armed; del.textContent = 'Delete'; } }, 4000); return; }
      del.disabled = true;
      try { await FY.rpc('cal_delete', { p_id: del.dataset.del }); FY.toast('Event deleted.'); if (editing === del.dataset.del) editing = null; await load(); draw(); drawForm(); }
      catch (er) { FY.toast(er.message); del.disabled = false; }
    }
    else if (day) { picked = picked === day.dataset.day ? null : day.dataset.day; draw(); if (!editing) { const dt = form.querySelector('#ce-date'); if (dt && picked) dt.value = picked; } }
  });
  draw(); drawForm();
}
</script>
</body>
</html>
