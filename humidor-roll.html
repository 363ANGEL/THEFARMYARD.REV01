<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Farmyard · The Humidor · Roll your own</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="app.css?v=20261123d">
<link rel="stylesheet" href="farmyard.css?v=20261123e">
<link rel="stylesheet" href="barn.css?v=20261119b">
<style>
/* 4.x The Humidor · Roll your own v2.0 (RAY, 24 Nov), ported from the Claude Design handoff
   "Humidor Concept C - Roll your own.dc.html". Every DS token it reads already exists in the site, so
   nothing is shimmed. Type is the design's px ÷ 16 in rem, so it follows the site's root-size cuts.
   Layout sizes (gaps, tick and pip sizes, the cigar region) stay in px as designed. */
@keyframes hkSmoke{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:.85}100%{opacity:0;transform:translate(var(--dx),-70px) scale(1.6)}}
@keyframes flNote{0%,100%{translate:0 0}50%{translate:0 -8px}}
@keyframes hkEmber{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes hcRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* The stage fills the panel, not the viewport: .fy-frame>.main has 18px padding top and bottom and a
   100vh - 34px min-height, so 100dvh - 70px is the panel's inner height. The page may scroll on short
   screens. The clip lets the cigar's smoke bleed up into the panel padding but never past the panel. */
.hr{position:relative;display:flex;flex-direction:column;min-height:calc(100dvh - 70px);color-scheme:dark;font-family:var(--font-body,Inter,sans-serif);color:var(--fy-text);clip-path:inset(-18px -100vw -100vh -100vw)}
@media (max-width:860px){.hr{min-height:calc(100dvh - 62px);clip-path:inset(-14px -100vw -100vh -100vw)}}
.hr a{color:var(--neon-teal);text-decoration:none}
.hr a:hover{color:var(--hint-text)}
.hr button{font-family:inherit}
.hr [hidden]{display:none !important}
.hr-cap{font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--hint-text);white-space:nowrap}

/* Header: the sign centred, round label and pips right. The design's "← The Barn" link is gone (the
   sidebar does that); an empty cell on the left keeps the sign centred. */
.hr-head{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px clamp(16px,3vw,32px) 0}
.hr-sign{font-size:.9375rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--hint-text);text-shadow:0 0 6px var(--neon-teal),0 0 14px rgba(95,211,207,.45);white-space:nowrap}
.hr-headr{display:flex;align-items:center;justify-content:flex-end;gap:10px}
#hr-round{font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fy-text-label);white-space:nowrap}
#hr-pips{display:flex;gap:4px}
#hr-pips span{width:18px;height:3px;border-radius:2px}

.hr-body{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(8px,2vh,24px) clamp(16px,4vw,56px) 0}
.hr-inner{flex:1;min-height:0;width:100%;box-sizing:border-box;padding-bottom:12px;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);grid-template-rows:auto auto minmax(0,1fr);column-gap:24px;flex-direction:column;align-items:center}

.hr-q{grid-column:2;grid-row:1;justify-self:center;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:820px;flex-shrink:0}
#hr-hank:empty{display:none}
#hr-kicker{width:100%;font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fy-text-label)}
#hr-headline{width:100%}
.hr-h1{width:100%;margin:0;font-size:clamp(1.75rem,4.4vw,3.375rem);line-height:var(--text-hero-lh);font-weight:500;letter-spacing:var(--text-hero-ls);text-wrap:balance;color:var(--neon-pink-text);animation:hcRise .5s ease-out both}
.hr.ws .hr-h1{font-size:1.75rem}
#hr-tip{width:100%;max-width:720px;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:4px}
.hr-tiptitle{font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--hint-text);min-height:14px}
.hr-tiptext{margin:0;font-size:.9375rem;line-height:1.5;text-wrap:pretty}
.hr-unsaved{margin:6px 0 0;font-size:.75rem;color:var(--fy-text-label)}
.hr-meters{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 28px;margin-top:6px}
.hr-meter{display:flex;align-items:center;gap:8px}
.hr-mpips{display:flex;gap:3px}
.hr-mpips span{width:14px;height:8px;box-sizing:border-box;border-radius:2px}
.hr-mnote{font-size:.75rem;color:var(--fy-text-label)}

/* The cigar. Its canvas reaches 150px above the region so the smoke can rise (data-cigar-pad). */
#hr-gap{position:relative;flex:1 1 clamp(84px,18vh,260px);width:100%;grid-column:1;grid-row:1 / span 3;align-self:stretch}
.hr-canvas{position:absolute;left:0;right:0;bottom:0;top:-150px;pointer-events:none}
#hr-notes{position:absolute;inset:0;pointer-events:none;z-index:1}
.hr-note{position:absolute;transform:translate(-50%,-50%);font-size:clamp(.8125rem,1.6vw,1.125rem);font-weight:500;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;color:var(--hint-text);text-shadow:0 0 6px var(--neon-teal);opacity:.7}
.hr-note.on{color:var(--neon-pink-text);text-shadow:var(--text-glow-pink);opacity:1}
#hr-spec{position:absolute;left:0;right:0;bottom:0;font-size:.8125rem;color:var(--fy-text-label);font-variant-numeric:tabular-nums}
#hr-key{grid-column:1;grid-row:1;justify-self:start;position:relative;z-index:2;flex-shrink:0}
.hr-keybox{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 18px;font-size:.75rem;color:var(--fy-text-label);text-align:left;width:max-content;max-width:100%;box-sizing:border-box;margin:6px 0;border:1px solid var(--neon-teal);border-radius:var(--radius-module);box-shadow:var(--glow-teal);background:rgba(22,24,38,.7)}
.hr-sw{display:inline-flex;align-items:center;gap:4px}
.hr-sw>span:first-child{height:2px;border-radius:1px}

/* Size counter */
.hr-count{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:560px;flex-shrink:0;margin:8px 0 12px;grid-column:2;grid-row:2;justify-self:center}
#hr-ticks{display:flex;gap:1.5px;width:100%;height:14px;align-items:flex-end}
#hr-ticks span{flex:1;border-radius:1px;transition:height .5s ease-out,background .5s ease-out}
.hr-cline{font-size:.75rem;color:var(--fy-text-label);font-variant-numeric:tabular-nums}
#hr-shown{color:var(--fy-text);font-size:.9375rem}

/* Options */
.hr-optwrap{grid-column:2;grid-row:3;align-self:start;width:100%;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2vh,22px);padding-bottom:10px}
#hr-opts{flex-wrap:wrap;justify-content:center;width:100%;max-width:980px}
.hr-opt{all:unset;min-width:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:56px;padding:4px 6px}
.hr-opt:hover{background:rgba(95,211,207,.08);border-radius:var(--radius-row)}
.hr-opt:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.hr-opt.dis{opacity:.35;cursor:default}
.hr-marks{display:flex;align-items:center;justify-content:center;gap:6px}
.hr-emb{flex:none;box-sizing:border-box;border-radius:50%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.hr-sil{display:block;overflow:visible}
.hr-sil path{fill:transparent;stroke:var(--neon-teal)}
.hr-opt:hover .hr-sil path,.hr-opt:focus-visible .hr-sil path{fill:rgba(95,211,207,.16)}
.hr-opt.sel .hr-sil path{fill:rgba(224,21,127,.18);stroke:var(--neon-pink-tube)}
.hr-olabel{font-size:clamp(1.0625rem,2.3vw,1.75rem);font-weight:500;white-space:nowrap;color:var(--fy-text);transition:color .2s,text-shadow .2s}
.hr.ws .hr-olabel{font-size:1.0625rem;white-space:normal}
.hr-opt.sel .hr-olabel{color:var(--neon-pink-text);text-shadow:var(--text-glow-pink)}
.hr-oline{align-self:stretch;height:2px;border-radius:1px;background:var(--rule-teal);transition:background .2s}
.hr-opt.sel .hr-oline{background:var(--neon-pink-tube);box-shadow:var(--glow-pink)}
.hr-ocount{font-size:.75rem;color:var(--neon-teal);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Footer: Back · rail · NEXT. On narrow panels the rail moves above the buttons. */
.hr-foot{flex:none;width:100%;max-width:980px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;background:linear-gradient(transparent,var(--fy-bg) 30%)}
.hr-footl{min-width:76px;display:flex}
.hr-footr{min-width:76px;display:flex;justify-content:flex-end;align-items:center}
.hr-foot .btn,.hr-foot .neon-btn{min-height:44px}
#hr-change{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
#hr-rail{display:flex;gap:clamp(8px,2vw,22px);align-items:flex-start;justify-content:center;min-width:0}
.hr.mob #hr-rail{gap:0;flex-basis:100%;order:-1}
.hr-rstep{all:unset;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.hr-rstep:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.hr-rdot{width:8px;height:8px;box-sizing:border-box;border-radius:50%}

/* Hank smoking (step 8): the PNG with the design's CSS overlay cigar. */
.hr-hank{position:relative;flex-shrink:0;animation:hcRise .5s ease-out both}
.hr-hank img{width:100%;display:block}
.hr-hcigar{position:absolute;left:63%;top:47%;width:17%;height:3%;transform:rotate(-4deg);transform-origin:left center;border-radius:2px 40% 40% 2px;background:linear-gradient(#a06a3c,#6b4022);outline:1.5px solid #120a06}
.hr-hband{position:absolute;left:30%;width:12%;top:0;bottom:0;background:#c9a24a}
.hr-hember{position:absolute;right:-6%;width:12%;top:0;bottom:0;border-radius:50%;background:#ff6a2a;box-shadow:0 0 6px #ff4b1f;animation:hkEmber 2.4s ease-in-out infinite}
.hr-hsmoke{position:absolute;right:0;top:50%}
.hr-puff{position:absolute;left:0;top:0;width:4px;height:4px;margin-left:-2px;margin-top:-2px;border-radius:50%;background:rgba(214,220,232,.75);opacity:0;animation:hkSmoke 3.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.hr *{animation:none !important}}
</style>
<script src="fy-clucks.js?v=20261119b"></script>
</head>
<body>
<div id="app"><main class="door"><p class="muted">Loading…</p></main></div>
<template id="hr-tpl">
  <div class="hr" id="hr">
    <header class="hr-head">
      <span></span>
      <div class="hr-sign">The Humid<span class="flicker-letter">o</span>r</div>
      <div class="hr-headr"><div id="hr-round"></div><div id="hr-pips"></div></div>
    </header>
    <div class="hr-body">
      <div class="hr-inner" id="hr-inner">
        <section class="hr-q">
          <div id="hr-hank"></div>
          <div id="hr-kicker"></div>
          <div id="hr-headline"></div>
          <div id="hr-tip"></div>
        </section>
        <div id="hr-gap">
          <div class="hr-canvas" data-cigar-pad="150"><cigar-3d></cigar-3d></div>
          <div id="hr-notes" aria-hidden="true"></div>
          <div id="hr-spec"></div>
        </div>
        <div id="hr-key" hidden></div>
        <div class="hr-count">
          <div id="hr-ticks" aria-hidden="true"></div>
          <div class="hr-cline"><span id="hr-shown"></span> <span id="hr-cnote"></span></div>
        </div>
        <section class="hr-optwrap"><div id="hr-opts"></div></section>
      </div>
      <footer class="hr-foot">
        <div class="hr-footl"><button type="button" class="btn btn-ghost" id="hr-back" hidden>Back</button></div>
        <nav id="hr-rail" aria-label="Steps"></nav>
        <div class="hr-footr"><button type="button" class="neon-btn" id="hr-next">START</button><a href="#" id="hr-change" hidden>Change →</a></div>
      </footer>
    </div>
  </div>
</template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=20261119b"></script><script src="app.js?v=20261119b"></script><script src="barn.js?v=20261123c"></script>
<script src="humidor-shelf.js?v=20261124a"></script><script src="humidor-cigar3d.js?v=20261124a"></script><script src="humidor-roll.js?v=20261124a"></script>
<script>
/* Its own Barn page (not Humidor.start: humidor.js opens the shell as 'humidor' and would light the
   parent). Admin only until RAY flips The Humidor to members, which cascades to this child too. */
(async function () {
  const B = await Barn.open('humidor-roll'); if (!B) return;
  HumidorRoll.mount(B.main);
})().catch(e => FY.toast(e.message));
</script>
</body>
</html>
