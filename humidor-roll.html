<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Farmyard · The Humidor · Roll your own</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="app.css?v=20261123d">
<link rel="stylesheet" href="farmyard.css?v=20261123e">
<link rel="stylesheet" href="barn.css?v=20261119b">
<style>
/* 4.x The Humidor · Roll your own v2.0 (RAY, 24 Nov), ported from the Claude Design handoff
   "Humidor Concept C - Roll your own.dc.html". Every DS token it reads already exists in the site, so
   nothing is shimmed. Type is the design's px ÷ 16 in rem, so it follows the site's root-size cuts.
   Layout sizes (gaps, tick and pip sizes, the cigar region) stay in px as designed. */
@keyframes hkSmoke{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:.85}100%{opacity:0;transform:translate(var(--dx),-70px) scale(1.6)}}
@keyframes flNote{0%,100%{translate:0 0}50%{translate:0 -8px}}
@keyframes hkEmber{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes hcRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* The stage fills the panel, not the viewport: .fy-frame>.main has 18px padding top and bottom and a
   100vh - 34px min-height, so 100dvh - 70px is the panel's inner height. The page may scroll on short
   screens. The clip lets the cigar's smoke bleed up into the panel padding but never past the panel. */
.hroll{position:relative;display:flex;flex-direction:column;min-height:calc(100dvh - 70px);color-scheme:dark;font-family:var(--font-body,Inter,sans-serif);color:var(--fy-text);clip-path:inset(-18px -100vw -100vh -100vw)}
@media (max-width:860px){.hroll{min-height:calc(100dvh - 62px);clip-path:inset(-14px -100vw -100vh -100vw)}}
.hroll a{color:var(--neon-teal);text-decoration:none}
.hroll a:hover{color:var(--hint-text)}
.hroll button{font-family:inherit}
.hroll [hidden]{display:none !important}
.hr-cap{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--hint-text);white-space:nowrap}

/* Header: the sign centred, round label and pips right. The design's "← The Barn" link is gone (the
   sidebar does that); an empty cell on the left keeps the sign centred. */
.hr-head{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px clamp(16px,3vw,32px) 0}
.hr-sign{grid-column:1;grid-row:1;justify-self:start;font-size:calc(var(--fs-body) * 1.25);font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--hint-text);text-shadow:0 0 6px var(--neon-teal),0 0 14px rgba(95,211,207,.45);white-space:nowrap}
.hr-headr{display:none}   /* step progress removed on every step (RAY, 24 Nov) */
#hr-round{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--fy-text-label);white-space:nowrap}
#hr-pips{display:flex;gap:3px}
#hr-pips span{width:8px;height:3px;border-radius:2px}

.hr-body{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(8px,2vh,24px) clamp(16px,4vw,56px) 0}
.hr-inner{flex:1;min-height:0;width:100%;box-sizing:border-box;padding-bottom:12px;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);grid-template-rows:auto auto minmax(0,1fr);column-gap:24px;flex-direction:column;align-items:center}

.hr-q{grid-column:2;grid-row:1;justify-self:center;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:820px;flex-shrink:0}
#hr-hank:empty{display:none}
#hr-kicker{display:none;width:100%;font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--fy-text-label)}
#hr-headline{width:100%}
.hr-h1{width:100%;margin:0;text-align:left;font-size:var(--fs-h1);line-height:var(--text-hero-lh);font-weight:500;letter-spacing:var(--text-hero-ls);text-wrap:balance;color:var(--neon-pink-text);text-shadow:var(--text-glow-pink);animation:hcRise .5s ease-out both}   /* neon pink as the DS draws it: pink text plus the pink glow (RAY, 24 Nov) */
.hroll.ws .hr-h1{font-size:var(--fs-h2)}
#hr-tip{width:100%;max-width:720px;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:4px}
.hr-tiptitle{align-self:stretch;text-align:left;margin-bottom:-2px;font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--hint-text);min-height:14px}
.hroll.s0 #hr-headline{display:none}   /* landing step: the question goes; "Overview" sits under THE HUMIDOR as its tagline (RAY, 24 Nov) */
.hroll.s0 .hr-sign{text-align:left}
.hroll.s0 .hr-sign::after{content:"Overview";display:block;margin-top:3px;font-size:var(--fs-sm);font-weight:400;letter-spacing:normal;text-transform:none;color:color-mix(in srgb,var(--neon-teal) 60%,transparent);text-shadow:none}
/* Landing step: the question and its tagline over the answers (RAY, 24 Nov) */
.hr-s0q{display:none;align-self:stretch;text-align:left;margin-bottom:14px}
.hroll.s0 .hr-s0q:not(.hr-sq){display:block}
.hroll[data-step="4"] .hr-sq[data-for="4"],.hroll[data-step="6"] .hr-sq[data-for="6"]{display:block}
.hroll[data-step="6"] .hr-count{display:none}   /* flavour only breaks ties, it limits nothing: no size counter (RAY, 24 Nov) */   /* strength step title (RAY, 24 Nov) */
.hr-s0q h2{margin:0;font-size:var(--fs-h3);font-weight:500;color:var(--neon-pink-text);text-shadow:var(--text-glow-pink)}
.hr-s0q p{margin:3px 0 0;font-size:var(--fs-sm);color:color-mix(in srgb,var(--neon-teal) 60%,transparent)}
.hroll.s0 #hr-tip{display:none}   /* no tip line or Hank's steer on the landing step (RAY, 24 Nov) */
.hr-tiptext{align-self:stretch;text-align:left;margin:0;font-size:var(--fs-sm);line-height:1.5;text-wrap:pretty}
.hr-unsaved{margin:6px 0 0;font-size:var(--fs-sm);color:var(--fy-text-label)}
.hr-meters{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 28px;margin-top:6px}
.hr-meter{display:flex;align-items:center;gap:8px}
.hr-mpips{display:flex;gap:3px}
.hr-mpips span{width:14px;height:8px;box-sizing:border-box;border-radius:2px}
.hr-mnote{font-size:var(--fs-sm);color:var(--fy-text-label)}

/* The cigar. Its canvas reaches 150px above the region so the smoke can rise (data-cigar-pad). */
#hr-gap{position:relative;flex:1 1 clamp(84px,18vh,260px);width:100%;grid-column:1;grid-row:1 / span 3;align-self:stretch}
.hr-canvas{position:absolute;left:0;right:0;bottom:0;top:-150px;pointer-events:none}
#hr-notes{position:absolute;inset:0;pointer-events:none;z-index:1}
.hr-note{position:absolute;transform:translate(-50%,-50%);font-size:var(--fs-h3);font-weight:500;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;color:var(--hint-text);text-shadow:0 0 6px var(--neon-teal);opacity:.7}
.hr-note.on{color:var(--neon-pink-text);text-shadow:var(--text-glow-pink);opacity:1}
/* Strength step (plan 40): what the lit floors do, under the stage, in the .hc-tip look without the glow. */
#hr-strnote{position:absolute;right:0;bottom:0;z-index:2;width:min(320px,42%);box-sizing:border-box;pointer-events:none;padding:6px 10px;background:var(--fy-bg);border:1px solid var(--neon-teal);border-radius:var(--radius-module,10px);text-align:left}
#hr-strnote p{margin:0;font-size:var(--fs-xs);line-height:1.4;color:var(--neon-teal)}
#hr-strnote p+p{margin-top:4px}
#hr-strnote b{font-weight:500}
.hroll.mob #hr-strnote{position:static;width:auto;align-self:stretch;margin:6px 0 0}   /* phones: below the stage, not over it */
#hr-spec{position:absolute;left:0;right:0;bottom:0;font-size:var(--fs-sm);color:var(--fy-text-label);font-variant-numeric:tabular-nums}
/* Landing step only (plan 38 CORRECTION): the cigar knowledge chart, humidor-chart.js. Six neon line-art
   panels on one track that auto-scrolls, pauses under the pointer, swipes on touch. An item lights pink
   and zooms 1.6x on rollover; the rest of its panel dims to 40%. Bottom room is left for #hr-spec. */
#hr-chart{position:absolute;left:0;right:0;top:0;bottom:1.6em;display:flex}
.hroll.s0 #hr-chart{bottom:0}
#hr-wheel .hc-p:not([data-p="4"]){visibility:hidden}   /* only the wheel panel, no neighbours peeking */
.hroll[data-step="6"] .hr-canvas{left:min(37%,285px)}   /* cigar starts where the wheel ends: no overlap */   /* cigar moves right of the wheel */
/* Flavour step: the overview's flavour wheel to the left of the cigar (RAY, 24 Nov) */
#hr-wheel{position:absolute;left:0;top:10%;bottom:10%;width:min(34.5%,265px);z-index:1}   /* wheel 15% bigger than the last cut (RAY, 24 Nov) */
#hr-wheel text{font-size:calc(var(--fs-fine) * .9) !important}   /* wheel text 10% smaller */
#hr-wheel .hc,#hr-wheel .hc-view{height:100%}
#hr-wheel .hc.only .hc-bar,#hr-wheel .hc.only .hc-detail,#hr-wheel .hc.only .hc-title{display:none}
#hr-wheel .hc.marking .hc-it.flv:not(.lit),#hr-wheel .hc.marking .hc-it:not(.flv){opacity:.35}
#hr-wheel .hc-it.flv.lit .hc-sw{stroke:var(--neon-pink-tube);fill-opacity:.8}
#hr-wheel .hc-it.flv.lit .hc-fll{fill:var(--neon-pink-text)}
.hroll:not([data-step="7"]):not([data-step="8"]) #hr-spec{display:none}   /* the running summary only on Last look and Done (RAY, 24 Nov) */   /* the cigar's summary line belongs to the question steps, not the overview (RAY, 24 Nov) */   /* the spec line is empty on the landing step: no room kept for it (RAY, 24 Nov) */
/* Photo window (plan 39): a size picked in the chart, in the site's module style. Native <dialog>. */
.hr-dlg{padding:0;border:0;background:transparent;width:min(560px,calc(100vw - 24px));max-width:none;max-height:none;color:var(--fy-text)}
.hr-dlg::backdrop{background:rgba(8,9,16,.72)}
.hr-dlgbox{position:relative;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding:18px;text-align:left;border:1px solid var(--neon-teal);border-radius:var(--radius-module);box-shadow:var(--glow-teal);background:var(--fy-bg);max-height:calc(100dvh - 24px);overflow:auto}
.hr-dlgx{all:unset;position:absolute;top:6px;right:6px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;border-radius:50%;font-size:var(--fs-h2);line-height:1;color:var(--hint-text)}
.hr-dlgx:hover{color:var(--neon-pink-text)}
.hr-dlgx:focus-visible{outline:2px solid var(--color-accent);outline-offset:-2px}
.hr-dlgimg{display:grid;place-items:center;min-height:120px;margin-top:30px;font-size:var(--fs-sm);color:var(--fy-text-label)}
.hr-dlgimg img{display:block;max-width:100%;max-height:60vh;object-fit:contain}
.hr-dlgh{margin:0;padding-right:44px;font-size:var(--fs-h2);font-weight:500;line-height:1.15;color:var(--neon-pink-text);text-shadow:var(--text-glow-pink)}
.hr-dlgf{margin:0;font-size:var(--fs-body);color:var(--fy-text-secondary);font-variant-numeric:tabular-nums}
.hr-dlgn{margin:0;font-size:var(--fs-sm);color:var(--neon-amber-text)}
.hr-dlgc{margin:0;font-size:var(--fs-xs);color:var(--fy-text-label)}
/* Time-band window (RAY, 24 Nov): the sizes in the band, then two notes */
.hr-bandwrap{width:100%;max-height:34vh;overflow:auto;border:1px solid var(--rule-teal);border-radius:var(--radius-row,6px)}
.hr-band{width:100%;border-collapse:collapse;font-size:var(--fs-sm);font-variant-numeric:tabular-nums;text-align:left;color:var(--fy-text)}
.hr-band th{position:sticky;top:0;background:var(--fy-bg);font-size:var(--fs-xs);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--fy-text-label);padding:6px 10px;border-bottom:1px solid var(--rule-teal)}
.hr-band td{padding:5px 10px;border-bottom:1px solid rgba(95,211,207,.12);white-space:nowrap}
.hr-bandnotes{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.hr-bandnotes p{margin:0;font-size:var(--fs-sm);line-height:1.5;color:var(--neon-teal)}
.hr-bandnotes strong{color:var(--neon-pink-text);font-weight:500}
#hr-dlg .hr-dlgbox{max-height:90vh;overflow:auto}
.hc{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hc-view{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:pan-y}
.hc-track{display:flex;width:600%;height:100%;transition:transform .8s ease}
.hc-track.drag{transition:none}
.hc-p{position:relative;flex:0 0 calc(100% / 6);height:100%}
.hc-svg{display:block;width:100%;height:100%;overflow:visible}
.hc-title{fill:var(--fy-text);font-size:var(--fs-sm);letter-spacing:.08em}   /* slide titles whiter and a size up (RAY, 24 Nov) */
/* Shape tooltip (RAY, 24 Nov): side-on cigar with dimension lines, and the three thirds */
.hc-tip{position:absolute;left:50%;top:48px;transform:translateX(-50%);width:min(440px,94%);box-sizing:border-box;z-index:2;pointer-events:none;padding:10px 14px 12px;background:var(--fy-bg);border:1px solid var(--neon-teal);border-radius:var(--radius-module,10px);box-shadow:var(--glow-teal);text-align:left}
.hc-tip[hidden]{display:none}
.hc-tip .hc-tipsvg .hc-ln{fill:none}
.hc-tiph{font-size:var(--fs-sm);color:var(--neon-pink-text);text-shadow:var(--text-glow-pink);margin-bottom:4px}
.hc-tipsvg{display:block;width:100%;height:auto;overflow:visible}
.hc-tipl{margin:6px 0 0;padding:0 0 0 1.1em;display:flex;flex-direction:column;gap:3px;font-size:var(--fs-sm);line-height:1.4;color:var(--neon-teal)}
.hc-t{fill:var(--fy-text-label);font-size:var(--fs-xs)}
.hc-tf{font-size:var(--fs-fine)}
.hc-tb{fill:var(--fy-text-secondary)}
.hc-ln{fill:none;stroke:var(--neon-teal);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;transition:stroke .2s}
.hc-thin{stroke-width:1;opacity:.6}
.hc-occ{fill:var(--fy-bg)}
.hc-sw{stroke:var(--neon-teal);stroke-width:1.5;vector-effect:non-scaling-stroke}
.hc-band{fill:rgba(95,211,207,.04)}
.hc-hit{fill:transparent}
/* Anatomy slide (RAY, 24 Nov): line weight and DS colour per part. The pink highlight still wins on rollover. */
svg[aria-label="Anatomy"]>g>g:first-child .hc-ln{stroke:var(--art-cream);stroke-width:2.6}
[data-id="part:cap"] .hc-ln{stroke:var(--neon-red-tube);stroke-width:2.4}
[data-id="part:cap"] .hc-t{fill:var(--neon-red-text)}
[data-id="part:head"] .hc-ln,[data-id="part:shoulder"] .hc-ln{stroke:var(--neon-green-tube)}
[data-id="part:head"] .hc-t,[data-id="part:shoulder"] .hc-t{fill:var(--neon-green-text)}
[data-id="part:band"] .hc-ln{stroke:var(--neon-amber);stroke-width:2.2}
[data-id="part:band"] .hc-occ{fill:color-mix(in srgb,var(--neon-amber) 22%,var(--fy-bg))}
[data-id="part:band"] .hc-t{fill:var(--neon-amber-text)}
[data-id="part:body"] .hc-ln{stroke:var(--neon-teal);stroke-width:1.6;opacity:1}
[data-id="part:foot"] .hc-ln{stroke:var(--neon-amber-tube);stroke-width:2.2}
[data-id="part:foot"] ellipse.hc-ln{fill:color-mix(in srgb,var(--neon-red-tube) 30%,transparent)}
[data-id="part:foot"] .hc-t{fill:var(--neon-amber-text)}
[data-id^="dim:"] .hc-ln{stroke:var(--color-accent-2,#a7a1db);stroke-width:1.2;stroke-dasharray:4 3;opacity:1}
[data-id^="dim:"] .hc-t{fill:var(--color-accent-2,#a7a1db)}
[data-id^="cut:"] .hc-thin{stroke:var(--art-cream);stroke-width:1.4;opacity:.8}
[data-id^="cut:"] .hc-ln:not(.hc-thin){stroke:var(--neon-amber);stroke-width:2.6;fill:color-mix(in srgb,var(--neon-amber) 18%,transparent)}
[data-id^="burn:"] .hc-band{stroke:color-mix(in srgb,var(--neon-teal) 40%,var(--fy-bg));stroke-width:1}   /* time bands: darker, thinner cyan so the cigars read clearly (RAY, 24 Nov) */
.hc-deco{pointer-events:none}   /* burn-time cigars: drawing only (RAY, 24 Nov) */
.hc-it{cursor:pointer;outline:none;transition:opacity .25s}
.hc-z{transform-box:fill-box;transform-origin:center;transition:transform .25s ease}
.hc-it.on .hc-z{transform:scale(1.6)}
.hc-it.nz.on .hc-z{transform:none}
/* Wrapper wheel (RAY, 24 Nov): a lit wedge slides outward instead of zooming; labels readable on dark leaf */
.hc-it.wedge.on .hc-z{transform:translate(var(--dx),var(--dy))}
.hc-wl{fill:var(--fy-text);paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:3px;stroke-linejoin:round}
.hc-fl{fill-opacity:.35}   /* flavour ring: the shade's colour, lighter (RAY, 24 Nov) */
.hc-fll{fill:var(--fy-text-secondary);paint-order:stroke;stroke:rgba(0,0,0,.5);stroke-width:3px;stroke-linejoin:round}
.hc-it.on .hc-fll{fill:var(--neon-pink-text)}
/* Filler slide (RAY, 24 Nov): the original Humidor's plant, upright cigar, key and note */
.hc-lband{fill-opacity:0;transition:fill-opacity .2s}
.hc-it.leaf.on .hc-lband{fill-opacity:.18}
.hc-lf{opacity:.35;transition:opacity .2s}
.hc-it.leaf.on .hc-lf{opacity:1}
.hc-it.leaf.on{filter:none}
.hc-it.leaf.on .hc-t{fill:var(--lc)}
.hc-key{letter-spacing:.05em}
.hc-info{display:none}
.hc-it.leaf.on .hc-info,.hc-p:not(.hov) .hc-info.def{display:block}
.hc-infobox{box-sizing:border-box;margin:4px;padding:10px 12px;border:1px solid var(--hint-border,#9eeae6);border-radius:10px;box-shadow:var(--glow-teal);background:var(--fy-bg);text-align:left;display:flex;flex-direction:column;gap:4px}
.hc-infoh{font-size:var(--fs-body);font-weight:500;color:var(--neon-pink-text);text-shadow:var(--text-glow-pink)}
.hc-infobox p{margin:0;font-size:var(--fs-sm);line-height:1.45;color:var(--hint-text)}
.hc-infobox .hc-infou{font-size:var(--fs-xs);color:var(--fy-text-label)}
.hc-it.wedge.on .hc-band{fill:rgba(224,21,127,.12)}
/* Shape colour groups, DS colours (RAY, 24 Nov): one colour per shape in Sizes, Shapes, Burn and the key */
.sh-parejo .hc-ln,.hc-leg.sh-parejo{stroke:var(--neon-teal);fill:var(--neon-teal)}
.sh-belicoso .hc-ln,.hc-leg.sh-belicoso{stroke:var(--neon-green-tube);fill:var(--neon-green-tube)}
.sh-torpedo .hc-ln,.hc-leg.sh-torpedo{stroke:var(--neon-amber);fill:var(--neon-amber)}
.sh-pyramid .hc-ln,.hc-leg.sh-pyramid{stroke:var(--neon-red-tube);fill:var(--neon-red-tube)}
.sh-perfecto .hc-ln,.hc-leg.sh-perfecto{stroke:var(--art-cream);fill:var(--art-cream)}
.sh-chisel .hc-ln,.hc-leg.sh-chisel{stroke:var(--color-accent-2,#a7a1db);fill:var(--color-accent-2,#a7a1db)}
.hc-svg [class*="sh-"] .hc-ln,.hc-tip [class*="sh-"] .hc-ln{fill:none}   /* every cigar is an outline; only the key text is filled */
.hc-leg{stroke:none}
.hc-it.on .hc-ln,.hc-it.on .hc-sw{stroke:var(--neon-pink-tube)}
.hc-it.on .hc-t{fill:var(--neon-pink-text)}
.hc-it.on{filter:drop-shadow(0 0 3px var(--neon-pink-tube))}
.hc-p.hov .hc-it:not(.on){opacity:.4}
.hc-bar{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;padding-bottom:10px;margin-bottom:30px;border-bottom:1px solid var(--rule-teal)}   /* air between the dots and the answers (RAY, 24 Nov) */
.hc-detail{position:absolute;left:12px;right:12px;top:26px;z-index:1;pointer-events:none;min-height:1.4em;font-size:var(--fs-sm);color:var(--fy-text-secondary);text-align:left;overflow-wrap:anywhere}   /* tagline under the panel title (RAY, 24 Nov) */
.hc-dots{flex:none;display:flex}
.hc-dot{all:unset;box-sizing:border-box;width:40px;height:32px;display:grid;place-items:center;cursor:pointer}
.hc-dot::after{content:"";width:26px;height:8px;box-sizing:border-box;border-radius:2px;border:2px solid rgba(95,211,207,.5)}
.hc-dot::after{transition:border-color .15s,box-shadow .15s}
.hc-dot:hover::after{border-color:var(--neon-teal);box-shadow:var(--glow-teal)}   /* mouse-over glow (RAY, 24 Nov) */
.hc-dot.cur:hover::after{border-color:var(--neon-pink-tube);box-shadow:var(--glow-pink)}
.hc-dot.cur::after{background:var(--neon-pink-tube);border-color:var(--neon-pink-tube);box-shadow:var(--glow-pink)}
.hc-dot:focus-visible{outline:2px solid var(--color-accent);outline-offset:-2px}
.hc.rm .hc-track,.hc.rm .hc-z,.hc.rm .hc-it,.hc.rm .hc-ln{transition:none}
#hr-key{grid-column:1;grid-row:1;justify-self:start;position:relative;z-index:2;flex-shrink:0}
