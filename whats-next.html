<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Farmyard · What's next?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="app.css?v=20261125t">
<link rel="stylesheet" href="farmyard.css?v=20261127a">
<link rel="stylesheet" href="barn.css?v=20261125t">
<script src="fy-clucks.js?v=20261119b"></script>
<link rel="icon" href="favicon.ico?v=20261127a" sizes="48x48"><link rel="icon" type="image/png" href="icon-192.png?v=20261127a" sizes="192x192"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261127a">
</head>
<body>
<div id="app"><main class="door"><p class="muted">Loading…</p></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=20261119b"></script><script src="app.js?v=20261119b"></script><script src="barn.js?v=20261123c"></script><script src="presence.js?v=20261119b"></script><script src="sidebar-subs.js?v=20261119b"></script>
<script>
/* 1.4 What's Next: Room Template (room = What's next) with the five holding-room cards and the
   suggestion box. Cards come from the fy.room registry (grp = 'next'); copy from the 1.4 design. */
const COPY = {
  title: "What's next?",
  tag: 'Rooms Hank is still building. Tell him which to open first.',
  head: 'Five rooms, all still boarded up.',
  body: 'Open a card to read what the yard wants in it, and add yours. Drop a suggestion in the box below and the most-asked room gets built next.',
};
const TAGS = {   // card taglines, from the 2.0 copy map
  arcade: 'Cabinets, boards and lobbies',
  movies: 'One film, one vote, Friday late',
  jukebox: 'Queue tracks, Hank keeps the aux',
  whisky: 'One bottle a month, tasting notes on the wall',
  chess: 'Ladder, blitz nights, one board at a time',
};
const SIGN = `<div class="fy-sign" aria-hidden="false" style="--sg-tube:var(--neon-teal);--sg-glow:var(--neon-teal);--sg-rgb:95,211,207;--sg-text:#c8f4f2">
  <span class="fy-sign-wire is-l"></span><span class="fy-sign-wire is-r"></span>
  <div class="fy-sign-plate"><span class="fy-sign-edge" aria-hidden="true"></span>
    <span class="fy-sign-icon is-ivory" aria-hidden="true"><svg viewBox="0 0 100 110" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-35 50 58) translate(7.5 8.7) scale(.85)"><rect x="44" y="40" width="12" height="62" rx="5"/><rect x="18" y="18" width="52" height="22" rx="4"/><path d="M70 22c12 0 20 6 22 18M70 36c8 0 13 3 15 8"/></g></g></svg></span>
    <h2 class="fy-sign-title">UNDER&nbsp;C<span class="is-flick">O</span>NSTRUCTION</h2>
  </div></div>`;

(async function () {
  const B = await Barn.open('whats-next'); if (!B) return;
  Presence.join(B.me).catch(() => {});
  const esc = FY.esc;
  let next = [];
  try { next = (await Barn.rooms()).filter(r => r.grp === 'next' && r.status !== 'hidden'); } catch (e) {}
  B.main.innerHTML = `
    <div class="fy0-head" style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:8px 16px;">
      <div class="fy-pagehead"><h1 class="t-title-b" style="margin:0;">${esc(COPY.title)}</h1></div>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; max-width:720px;">
      <span style="font-size:var(--fs-body); color:var(--fy-text-secondary);">${esc(COPY.tag)}</span>
      <div><span style="font-size:var(--fs-body); font-weight:600;">${esc(COPY.head)}</span>
      <p style="margin:4px 0 0; max-width:64ch; font-size:var(--fs-body); line-height:1.5; color:var(--fy-text-secondary);">${esc(COPY.body)}</p></div>
    </div>
    <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); align-items:start; gap:10px; margin-top:14px;">
      ${next.map(r => `<div class="wn-card" data-room="${esc(r.id)}" style="display:flex; flex-direction:column; gap:8px; padding:14px; border:1px solid var(--neon-teal); border-radius:10px; box-shadow:var(--glow-teal); background:var(--fy-bg); color:var(--fy-text); min-width:0;">
        <span style="display:flex; align-items:center; gap:10px;"><i class="${esc(r.icon)}" aria-hidden="true" style="font-size:var(--ic-lg); color:var(--neon-teal);"></i><span style="font-size:var(--fs-h3); font-weight:500;">${esc(r.label)}</span></span>
        <span style="font-size:var(--fs-sm); color:var(--fy-text-secondary); text-wrap:pretty;">${esc(TAGS[r.id] || '')}</span>
        <button type="button" class="kicker wn-toggle" aria-expanded="false" style="margin-top:auto; align-self:flex-start; padding:0; border:0; background:none; cursor:pointer; font:inherit;">Add comment <span class="wn-n"></span> ▾</button>
        <div class="wn-drop" style="display:none; flex-direction:column; gap:10px; padding-top:10px; border-top:1px solid var(--rule-teal);">
          <div class="wn-list" style="display:flex; flex-direction:column; gap:10px;"></div>
          <form class="wn-form" style="display:flex; flex-direction:column; gap:8px;">
            <textarea class="input" rows="2" required maxlength="280" placeholder="What would you want in here?" aria-label="Your comment on ${esc(r.label)}" style="width:100%; box-sizing:border-box; resize:vertical; border-color:var(--neon-teal); font-family:inherit;"></textarea>
            <button type="submit" class="btn btn-primary" style="min-height:2rem; align-self:flex-start; font-size:var(--fs-sm);">Post</button>
          </form>
        </div></div>`).join('')}
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:16px; max-width:720px; box-sizing:border-box; padding:22px; border:1px solid var(--neon-teal); border-radius:12px; box-shadow:var(--glow-teal); background:var(--fy-bg); margin-top:14px;">
      <span style="align-self:flex-start; color:var(--neon-teal); text-shadow:0 0 6px var(--neon-teal), 0 0 14px rgba(95,211,207,.45);" class="lot-label">Site Suggestion Box - What should we add next?</span>
      <form id="sugg" style="display:flex; flex-direction:column; align-items:center; gap:12px; width:100%;">
        <span style="align-self:flex-start; margin-bottom:-8px; font-size:var(--fs-sm); line-height:1.5; font-style:italic; color:var(--color-neutral-400);">Submit your comments below.</span>
        <textarea class="input" id="sugg-text" rows="4" required maxlength="280" placeholder="Games, rooms, rules, anything..." aria-label="Your suggestion" style="width:100%; box-sizing:border-box; resize:vertical; border-color:var(--neon-teal); font-family:inherit;"></textarea>
        <button type="submit" class="btn btn-primary" style="min-height:2.25rem; align-self:flex-start; font-size:var(--fs-sm);">Send it</button>
      </form>
    </div>`;
  Barn.hangSign(B.main, SIGN);

  /* Room cards roll down to show members' comments (RAY, 27 Nov), instead of opening a holding page.
     Comments are fy.suggestion rows keyed 'c:<room>', readable by every member. */
  const dir = Object.fromEntries(((await FY.q('member').select('id, nickname, avatar, avatar_url')).data || []).map(m => [m.id, m]));
  const ago = iso => { const d = (Date.now() - new Date(iso)) / 1000;
    return d < 60 ? 'just now' : d < 3600 ? Math.floor(d / 60) + 'm ago' : d < 86400 ? Math.floor(d / 3600) + 'h ago' : new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
  let comments = [];
  async function loadComments() {
    comments = (await FY.q('suggestion').select('id, member_id, room_key, body, created_at').like('room_key', 'c:%').order('created_at', { ascending: true })).data || [];
    B.main.querySelectorAll('.wn-card').forEach(card => {
      const mine = comments.filter(c => c.room_key === 'c:' + card.dataset.room);
      card.querySelector('.wn-n').textContent = mine.length ? '· ' + mine.length : '';
      card.querySelector('.wn-list').innerHTML = mine.map(c => { const m = dir[c.member_id] || { id: c.member_id, nickname: '?' };
        return `<div style="display:flex; gap:8px; min-width:0;">${FY.faceRing(m, 28, m.nickname)}<div style="flex:1; min-width:0;"><div style="display:flex; gap:6px; align-items:baseline; flex-wrap:wrap;"><span style="font-size:var(--fs-sm); font-weight:700;">${esc(m.nickname)}</span><span style="font-size:var(--fs-xs); color:var(--fy-text-label);">${ago(c.created_at)}</span></div><p style="margin:2px 0 0; font-size:var(--fs-sm); line-height:1.45; color:var(--fy-text-secondary); overflow-wrap:anywhere; white-space:pre-wrap;">${esc(c.body)}</p></div></div>`; }).join('')
        || '<span style="font-size:var(--fs-sm); font-style:italic; color:var(--color-neutral-400);">No comments yet. Be the first.</span>';
    });
  }
  await loadComments().catch(() => {});
  B.main.querySelectorAll('.wn-card').forEach(card => {
    const tog = card.querySelector('.wn-toggle'), drop = card.querySelector('.wn-drop');
    tog.addEventListener('click', () => { const open = drop.style.display === 'none'; drop.style.display = open ? 'flex' : 'none'; tog.setAttribute('aria-expanded', open);
      tog.lastChild.textContent = open ? ' ▴' : ' ▾'; if (open) drop.querySelector('textarea').focus(); });
    card.querySelector('.wn-form').addEventListener('submit', async ev => {
      ev.preventDefault(); const ta = ev.target.querySelector('textarea'), btn = ev.target.querySelector('button'), text = ta.value.trim();
      if (!text) return; btn.disabled = true;
      try { await FY.rpc('suggest', { p_room: 'c:' + card.dataset.room, p_body: text }); ta.value = ''; await loadComments(); }
      catch (e) { FY.toast(e.message); }
      btn.disabled = false;
    });
  });
  B.main.querySelector('#sugg').addEventListener('submit', async ev => {
    ev.preventDefault();
    const text = B.main.querySelector('#sugg-text').value.trim();
    if (!text) return;
    try { await FY.rpc('suggest', { p_room: 'next', p_body: text }); }
    catch (e) { FY.toast(e.message); return; }
    ev.target.outerHTML = '<span style="display:flex; align-items:center; gap:8px; font-size:var(--fs-sm); min-height:60px; color:var(--neon-teal);"><i class="ph ph-check-circle" style="font-size:1.25rem; text-shadow:0 0 6px var(--neon-teal);"></i>Thanks. Hank has it.</span>';
  });
})().catch(e => FY.toast(e.message));
</script>
</body>
</html>
