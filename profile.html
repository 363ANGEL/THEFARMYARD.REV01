<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Farmyard · Profile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="farmyard.css">
<link rel="stylesheet" href="barn.css">
<script src="fy-clucks.js"></script>
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.who{display:flex;gap:16px;align-items:center}
.who .face{width:var(--char-host);height:var(--char-host);flex:none;border-radius:0;background-color:transparent}
.who label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fy-text-label);flex:1;min-width:0}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.char-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer;color:var(--fy-text);font-family:inherit;font-size:11px}
.char-btn .face{width:48px;height:48px;border:1.5px solid var(--neon-teal);box-shadow:0 0 6px rgba(95,211,207,.6)}
.char-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.char-btn.on{border-color:var(--neon-pink);box-shadow:var(--glow-pink)}
.char-btn:hover{border-color:var(--rule-teal)}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:10px;align-items:center}
.shead{padding:0 0 6px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fy-text-label)}
.srow{padding:8px 0;border-top:1px solid var(--rule-teal);font-size:14px}
.srow .to{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.srow .acts{display:flex;gap:6px;width:150px;justify-content:flex-end}
.srow .acts .btn{min-height:32px;padding:0 12px;font-size:12px}
.srow.done{opacity:.55}
.srow .mark{font-size:12px;color:var(--neon-teal);white-space:nowrap}
.lrow{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--rule-teal)}
.lrow>i{font-size:22px;flex:none;color:var(--fy-text-label)}
.lrow>i.on{color:var(--neon-teal)}
.lrow .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lrow .mid span:first-child{font-size:14px;color:var(--fy-text)}
.lrow .mid span:last-child{font-size:12px;color:var(--fy-text-label)}
.lrow .btn{min-height:32px;font-size:12px;white-space:nowrap}
.revbox{display:flex;flex-direction:column;gap:8px;padding:0 0 10px 34px}
.revbox label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fy-text-label)}
.revbox .hint{font-size:12px;line-height:1.5;color:var(--fy-text-label)}
.iou{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--rule-teal);font-size:14px}
.iou .t{flex:1;min-width:160px}
.iou .btn{min-height:32px;padding:0 12px;font-size:12px}
.field{display:grid;gap:4px}.field label{color:var(--fy-text-label);font-size:12px}
.pf input,.pf select{font:inherit;font-size:14px;background:var(--fy-surface-2,#2b2e3f);color:var(--fy-text);border:1px solid var(--neon-teal);border-radius:8px;padding:8px 10px;min-width:0;box-sizing:border-box}
</style>
</head>
<body>
<div id="app"><main class="door"><p class="muted">Loading…</p></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="app.js"></script><script src="barn.js"></script>
<script>
/* 3.0 Barn Profile: who you are in the yard (name + logo), Settle up (what you owe, Pay on Revolut, Mark paid),
   Linked accounts (Discord is the key; Revolut pay-me link lives here; the rest are not built yet),
   plus what is owed to you (confirm / dispute) and the "Something wrong?" claim form. */
(async function () {
  const B = await Barn.open('profile'); if (!B) return;
  const { me, main } = B, esc = FY.esc, GBP = 5;
  const ANIMALS = [['hen', 'Hen'], ['cock', 'Cock'], ['pig', 'Pig'], ['sheep', 'Sheep'], ['goat', 'Goat'], ['cow', 'Cow']];
  const names = {}; ((await FY.q('v_members_public').select('id,nickname,avatar,avatar_url')).data || []).forEach(m => names[m.id] = m);
  const mine = (await FY.q('member_logo').select('slot,name,url').eq('member_id', me.id).order('slot')).data || [];
  const palette = [...mine.map(l => ({ id: 'url:' + l.url, name: l.name, img: l.url })), ...ANIMALS.map(([k, n]) => ({ id: 'key:' + k, name: n, img: `assets/avatars/${k}.svg` }))];
  const D = { name: me.nickname, pick: me.avatar_url ? 'url:' + me.avatar_url : 'key:' + me.avatar, rev: me.revolut_url || '' };
  const who = id => `${esc(names[id]?.nickname || '?')}`;
  const live = s => ['open', 'marked_paid', 'disputed'].includes(s);
  const revLink = (url, gbp) => { const m = /^https:\/\/revolut\.me\/([A-Za-z0-9._-]+)$/.exec(url || ''); return m ? `https://revolut.me/${m[1]}/${gbp}gbp` : null; };
  const label = { open: 'open', marked_paid: 'marked paid', confirmed: 'confirmed', disputed: 'disputed', settled: 'squared up' };

  async function render() {
    const ious = await FY.rpc('my_ious');
    const rev = {}; ((await FY.q('member').select('id,revolut_url')).data || []).forEach(m => rev[m.id] = m.revolut_url);
    const owe = ious.filter(i => i.payer_id === me.id && live(i.state));
    const owed = ious.filter(i => i.payee_id === me.id && live(i.state));
    const closed = ious.filter(i => !live(i.state) && (i.payer_id === me.id || i.payee_id === me.id)).slice(0, 8);
    // Settle up: grouped by payee. £ = buy-ins × 5 (league constant).
    const groups = {};
    owe.forEach(i => { const g = groups[i.payee_id] || (groups[i.payee_id] = { open: 0, ids: [], waiting: 0 }); if (i.state === 'open') { g.open += i.amount; g.ids.push(i.id); } else g.waiting += i.amount; });
    const settleRows = Object.keys(groups).map(pid => { const g = groups[pid], link = revLink(rev[pid], g.open * GBP), done = !g.open;
      return `<div class="sgrid srow ${done ? 'done' : ''}"><span class="to">${who(pid)}</span><span class="amt">£${(g.open || g.waiting) * GBP}</span><span class="acts">
        ${done ? '<span class="mark"><i class="ph ph-check"></i> Marked paid</span>'
               : `${link ? `<a class="btn btn-primary" href="${esc(link)}" target="_blank" rel="noopener"><i class="ph ph-hand-coins"></i>Pay</a>` : '<span class="mark" style="color:var(--fy-text-label)">No Revolut link</span>'}<button type="button" class="btn btn-ghost" data-paid="${g.ids.join(',')}">Paid</button>`}</span></div>`; }).join('');
    const cur = palette.find(p => p.id === D.pick) || palette[0];

    main.innerHTML = `
      <div class="head"><h2 class="hd2">Profile</h2><span class="grow"></span><button type="button" id="out" class="btn btn-ghost">Leave the yard</button></div>
      <div class="grid2">
        <form class="box-teal pf" id="edit" style="gap:14px">
          <span class="kicker">Who you are in the yard</span>
          <div class="who"><div class="face" role="img" aria-label="Your character" style="background-image:url('${esc(cur.img)}')"></div>
            <label>Yard name<input class="input" id="nick" value="${esc(D.name)}" maxlength="16" required style="min-height:40px"></label></div>
          <div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:12px;color:var(--fy-text-label)">Character</span>
            <div class="chars">${palette.map(p => `<button type="button" class="char-btn ${p.id === D.pick ? 'on' : ''}" data-pick="${esc(p.id)}" aria-label="${esc(p.name)}"><span class="face" style="background-image:url('${esc(p.img)}')"></span><span>${esc(p.name)}</span></button>`).join('')}</div></div>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn btn-teal" type="submit">Save</button><span style="font-size:12px;color:var(--fy-text-label)">Up to 16 characters.</span></div>
        </form>
        <div class="box-pink" id="settle" style="scroll-margin-top:16px">
          <span class="kicker" style="color:var(--neon-pink-text)">Settle up</span>
          <p style="margin:0 0 6px;font-size:13px;line-height:1.5;color:var(--fy-text-secondary)">What you owe from poker. Each Pay button opens that member's Revolut with the amount filled in. Then tap Paid; they confirm and it's squared.</p>
          <div class="sgrid shead"><span>Pay to</span><span style="text-align:right">Owed</span><span style="width:150px"></span></div>
          ${settleRows}
          ${!owe.length ? '<span style="font-size:13px;color:var(--neon-green-text)">All square. You owe nobody.</span>' : ''}
        </div>
        <div class="box-teal">
          <span class="kicker">Linked accounts</span>
          <p style="margin:0;font-size:13px;line-height:1.5;color:var(--fy-text-secondary)">Each link opens a room. Nothing's shared with the yard except what the room needs.</p>
          <div class="lrow"><i class="ph ph-discord-logo on"></i><div class="mid"><span>Discord</span><span>Your key · Lounge voice</span></div><span class="btn btn-ghost off">Connected</span></div>
          <div class="lrow"><i class="ph ph-hand-coins ${D.rev ? 'on' : ''}"></i><div class="mid"><span>Revolut</span><span>Get paid your poker winnings</span></div><span class="btn ${D.rev ? 'btn-ghost' : 'btn-primary'} off">${D.rev ? 'Linked' : 'Not linked'}</span></div>
          <form class="revbox" id="revform">
            <label>Your Revolut pay-me link<input class="input" id="rv" type="url" value="${esc(D.rev)}" maxlength="120" placeholder="https://revolut.me/yourname" style="min-height:44px;font-size:14px"></label>
            <span class="hint">When you win, anyone who owes you gets a Pay button that opens this link with the amount filled in. 1 buy-in = £5. The Farmyard never holds money.</span>
            <div><button class="btn btn-teal" type="submit">Save link</button></div>
          </form>
          <div class="lrow"><i class="ph ph-spotify-logo"></i><div class="mid"><span>Spotify</span><span>Queue tracks on the Jukebox</span></div><span class="btn off">Soon</span></div>
          <div class="lrow"><i class="ph ph-steam-logo"></i><div class="mid"><span>Steam</span><span>Arcade lobbies · show what you're playing</span></div><span class="btn off">Soon</span></div>
          <div class="lrow"><i class="ph ph-game-controller"></i><div class="mid"><span>itch.io</span><span>High-score sync for browser games</span></div><span class="btn off">Soon</span></div>
        </div>
        <div class="box-teal">
          <span class="kicker">Owed to you</span>
          ${owed.length ? owed.map(i => `<div class="iou"><span class="t">${who(i.payer_id)} owes you <strong class="num">£${i.amount * GBP}</strong> <span class="muted">· ${label[i.state]}</span></span>
            ${i.state === 'marked_paid' ? `<button type="button" class="btn btn-primary" data-t="confirmed" data-id="${i.id}">Confirm</button><button type="button" class="btn btn-ghost" data-t="disputed" data-id="${i.id}">Dispute</button>` : ''}</div>`).join('')
            : '<p class="muted" style="margin:0;font-size:13px">Nobody owes you. Yet.</p>'}
          ${closed.length ? `<span class="kicker" style="padding-top:8px">Recent, closed</span>${closed.map(i => `<p class="muted" style="margin:0;font-size:12px">${who(i.payer_id)} → ${who(i.payee_id)} £${i.amount * GBP} · ${label[i.state]}</p>`).join('')}` : ''}
        </div>
        <form class="box-teal pf" id="claim" style="gap:12px">
          <span class="kicker">Something wrong?</span>
          <div class="field"><label for="ctype">Claim</label><select id="ctype"><option value="points">Points I should have</option><option value="iou">An IOU that is missing</option></select></div>
          <div class="field" id="f-points"><label for="cpts">Poker points</label><input id="cpts" type="number" min="1" value="1"></div>
          <div class="field" id="f-iou" hidden><label for="cpayer">Who owes whom</label>
            <div class="row"><select id="cpayer">${Object.values(names).map(m => `<option value="${m.id}">${esc(m.nickname)}</option>`).join('')}</select><span>owes</span>
            <select id="cpayee">${Object.values(names).map(m => `<option value="${m.id}">${esc(m.nickname)}</option>`).join('')}</select><input id="camt" type="number" min="1" value="1" style="width:5em"></div></div>
          <div class="field"><label for="cnote">What happened</label><input id="cnote" required placeholder="e.g. side pot on the 12th"></div>
          <div><button class="btn btn-teal">Send to RAY</button></div>
        </form>
      </div>`;

    main.querySelector('#out').addEventListener('click', () => Barn.signOut());
    main.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
      D.pick = b.dataset.pick; const p = palette.find(x => x.id === D.pick);
      main.querySelectorAll('[data-pick]').forEach(x => x.classList.toggle('on', x === b));
      main.querySelector('.who .face').style.backgroundImage = `url('${p.img}')`;
    }));
    main.querySelector('#edit').addEventListener('submit', async ev => {
      ev.preventDefault();
      const name = main.querySelector('#nick').value.trim(); if (!name) return FY.toast("Yard name can't be blank");
      const patch = { nickname: name };
      if (D.pick.startsWith('url:')) patch.avatar_url = D.pick.slice(4); else { patch.avatar = D.pick.slice(4); patch.avatar_url = null; }
      const { error } = await FY.q('member').update(patch).eq('id', me.id);
      if (error) return FY.toast(/unique|duplicate/i.test(error.message) ? 'That yard name is taken.' : error.message);
      Object.assign(me, patch); D.name = name; FY.toast('Saved.'); location.reload();
    });
    main.querySelector('#revform').addEventListener('submit', async ev => {
      ev.preventDefault();
      const rv = main.querySelector('#rv').value.trim() || null;
      if (rv && !/^https:\/\/revolut\.me\/[A-Za-z0-9._-]+$/.test(rv)) return FY.toast('Revolut link must be exactly https://revolut.me/yourname');
      const { error } = await FY.q('member').update({ revolut_url: rv }).eq('id', me.id);
      if (error) return FY.toast(error.message);
      me.revolut_url = rv; D.rev = rv || ''; FY.toast('Saved.'); await render();
    });
    main.querySelectorAll('button[data-t]').forEach(b => b.addEventListener('click', async () => {
      // Only "Confirm" is irreversible: two taps within 5 seconds.
      if (b.dataset.t === 'confirmed' && b.dataset.armed !== '1') { const was = b.textContent; b.dataset.armed = '1'; b.textContent = 'Tap again to confirm'; setTimeout(() => { b.dataset.armed = ''; b.textContent = was; }, 5000); return; }
      b.disabled = true;
      try { await FY.rpc('iou_transition', { p_iou: b.dataset.id, p_to: b.dataset.t }); FY.toast({ confirmed: 'Confirmed. Squared.', disputed: 'Disputed. RAY will sort it.' }[b.dataset.t]); await render(); }
      catch (e) { FY.toast(e.message); b.disabled = false; }
    }));
    main.querySelectorAll('button[data-paid]').forEach(b => b.addEventListener('click', async () => {
      b.disabled = true;
      try { for (const id of b.dataset.paid.split(',')) await FY.rpc('iou_transition', { p_iou: id, p_to: 'marked_paid' }); FY.toast('Marked paid. Waiting for their tick.'); }
      catch (e) { FY.toast(e.message); }
      await render();
    }));
    const ctype = main.querySelector('#ctype');
    ctype.addEventListener('change', () => { main.querySelector('#f-points').hidden = ctype.value !== 'points'; main.querySelector('#f-iou').hidden = ctype.value !== 'iou'; });
    main.querySelector('#claim').addEventListener('submit', async ev => {
      ev.preventDefault();
      const note = main.querySelector('#cnote').value.trim();
      const payload = ctype.value === 'points'
        ? { type: 'points', type_key: 'poker', points: Number(main.querySelector('#cpts').value), note }
        : { type: 'iou', payer_id: main.querySelector('#cpayer').value, payee_id: main.querySelector('#cpayee').value, amount: Number(main.querySelector('#camt').value), note };
      if (payload.type === 'iou' && payload.payer_id === payload.payee_id) return FY.toast('Pick two different people.');
      const btn = ev.submitter || ev.target.querySelector('button'); btn.disabled = true;
      try { await FY.rpc('raise_claim', { p_payload: payload }); FY.toast('Sent. RAY will approve or reject it.'); ev.target.reset(); ctype.dispatchEvent(new Event('change')); }
      catch (e) { FY.toast(e.message); }
      finally { btn.disabled = false; }
    });
    if (location.hash === '#settle' && !render.scrolled) { render.scrolled = true; main.querySelector('#settle')?.scrollIntoView(); }
  }
  await render();
})().catch(e => FY.toast(e.message));
</script>
</body>
</html>
