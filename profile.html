<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Farmyard · Profile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="app.css?v=20261113">
<link rel="stylesheet" href="farmyard.css?v=20261113">
<link rel="stylesheet" href="barn.css?v=20261113">
<script src="fy-clucks.js?v=20261113"></script>
<style>
.pcard{display:flex;flex-direction:column;gap:10px;padding:16px 14px;border:1px solid rgba(95,211,207,.55);border-radius:10px;box-shadow:0 0 4px rgba(95,211,207,.4);background:var(--fy-bg);min-width:0}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid rgba(95,211,207,.55);border-radius:10px}
.stat .v{display:flex;align-items:center;gap:8px;font-size:var(--fs-h3);font-weight:500}
.stat .v i{font-size:var(--ic-lg);color:var(--neon-teal)}
.ledcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;padding:6px 0 12px}
.ledbox{display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid rgba(95,211,207,.55);border-radius:9px;min-width:0}
.ledrow{display:grid;grid-template-columns:28px minmax(0,1fr) max-content minmax(84px,max-content);gap:10px;align-items:center;padding:6px 0;border-top:1px solid rgba(95,211,207,.22)}
.ledrow .ini{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--neon-teal);display:grid;place-items:center;font-size:10px;font-weight:800;color:#c8f4f2;background-size:cover;background-position:center}
.ledrow .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmbtn{width:26px;height:26px;display:grid;place-items:center;padding:0;background:transparent;border:1.5px solid var(--neon-teal);border-radius:6px;color:#c8f4f2;cursor:pointer;font-family:inherit;font-size:15px;line-height:1}
.pmbtn:hover{box-shadow:0 0 8px rgba(95,211,207,.6)}
.rcv{justify-self:center;min-height:32px;padding:0 10px;background:transparent;border:1.5px solid var(--neon-teal);border-radius:6px;color:#c8f4f2;font-family:inherit;font-size:var(--fs-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.paybtn{min-height:32px;padding:0 14px;display:inline-flex;align-items:center;box-sizing:border-box;background:transparent;border:1.5px solid var(--neon-pink-tube);border-radius:6px;color:var(--neon-pink-text);font-size:var(--fs-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.paybtn:hover{box-shadow:var(--glow-pink)}
.paybtn[aria-disabled="true"]{border-color:rgba(168,0,22,.38);color:rgba(232,38,58,.4);pointer-events:none}
.leaguerow{display:grid;grid-template-columns:28px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.12);font-size:var(--fs-sm)}
.acthead,.actrow{display:grid;grid-template-columns:24px 92px minmax(0,1fr) 120px;gap:10px;align-items:center}
.icongrid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(10px,1.6vw,20px);width:100%}
/* The art carries its own circular frame, so it sits inside the ring rather than over it. */
.iconslot{aspect-ratio:1/1;width:100%;padding:0;border:0;border-radius:50%;box-sizing:border-box;background:transparent center/contain no-repeat}
button.iconslot{cursor:pointer}
.iconslot.on{filter:drop-shadow(0 0 5px var(--neon-green-tube)) drop-shadow(0 0 14px var(--neon-green-tube))}
.iconslot.empty{display:grid;place-items:center;border:2px dashed rgba(95,211,207,.35);color:var(--fy-text-label);font-size:var(--fs-sm)}
</style>
</head>
<body>
<div id="app"><main class="door"><p class="muted">Loading…</p></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=20261113"></script><script src="app.js?v=20261113"></script><script src="barn.js?v=20261113"></script><script src="presence.js?v=20261113"></script><script src="sidebar-subs.js?v=20261113"></script>
<script>
/* 3.0 Barn Profile (REV C03) — one page, three views.
   Own (default): header + edit, stats, icon palette, ledger (pair-netted, Pay / Received?), pools,
   recent actions, linked accounts, claim form, sign out.
   Public (?user=Name): header, stats (public figures only), recent actions.
   Admin (?view=admin&user=Name, leader only): everything in Own for that member, plus −/+ tk
   corrections on the ledger (fy.admin_* RPCs, logged) and the admin banner.
   Units: iou.amount is buy-ins on poker events (×5 tk) and plain tk on corrections/claims. */
const MCOLS = 'id,nickname,avatar,avatar_url,role,tagline,revolut_url,birth_day,birth_month,created_at,setup_at,chesscom_username,user_id,league_id,character_id,icon_slot';
(async function () {
  const params = new URLSearchParams(location.search);
  const B = await Barn.open('profile'); if (!B) return;
  const { me, main } = B, esc = FY.esc;
  Presence.join(me).catch(() => {});
  const isLeader = me.role === 'leader';

  // ---- Resolve the subject and the view ----
  let subject = me, view = 'own';
  const userName = params.get('user');
  if (userName && userName !== me.nickname) {
    const { data } = await FY.q('member').select(MCOLS).eq('nickname', userName).limit(1);
    if (!data || !data.length) {
      main.innerHTML = `<div class="fy-pagehead"><h2 class="t-title-b">Profile</h2></div>
        <div class="pcard"><span class="kicker">Nobody here</span>
        <p style="margin:0">Hank doesn't know anyone called <strong>${esc(userName)}</strong>. They may have changed their yard name.</p>
        <a href="dashboard.html" style="color:var(--neon-pink-link)">Back to the Dashboard</a></div>`;
      return;
    }
    subject = data[0];
    view = params.get('view') === 'admin' && isLeader ? 'admin' : 'public';
  } else if (params.get('view') === 'admin' && isLeader && userName) {
    view = 'admin';
  }
  const own = view === 'own', admin = view === 'admin', notPublic = view !== 'public';
  document.title = 'The Farmyard · ' + (own ? 'Profile' : subject.nickname);

  // ---- Shared data ----
  const members = (await FY.q('member').select('id,nickname,avatar,avatar_url,revolut_url')).data || [];
  const dir = Object.fromEntries(members.map(m => [m.id, m]));
  const nick = id => dir[id]?.nickname || '?';
  const board = await FY.rpc('poker_board').catch(() => null);
  const badge = ((await FY.q('v_badges').select('member_id,owes,owed').eq('member_id', subject.id)).data || [])[0] || { owes: 0, owed: 0 };
  const events = {}; ((await FY.q('event').select('id,type_key,played_at,note,voided_at').order('played_at', { ascending: false }).limit(200)).data || []).forEach(e => events[e.id] = e);
  const scores = (await FY.q('score_entry').select('event_id,member_id,points,reason,created_at').eq('member_id', subject.id).order('created_at', { ascending: false }).limit(60)).data || [];

  const D = { ious: [], links: [], logos: [], chars: [], holders: {} };
  if (notPublic) {
    const all = await FY.rpc('my_ious').catch(() => []);
    D.ious = (all || []).filter(i => i.payer_id === subject.id || i.payee_id === subject.id);
    D.links = (await FY.q('member_link').select('provider,handle,enabled').eq('member_id', subject.id)).data || [];
    // The 15 slots belong to the animal the member holds (icons-per-character.sql).
    D.logos = subject.character_id
      ? await FY.q('icon_palette').select('slot,url').eq('character_id', subject.character_id).order('slot').then(r => r.data || [], () => [])
      : [];
    if (own) {   // Characters: tolerate the table not existing yet (characters.sql not run)
      D.chars = await FY.q('character').select('id,name,img').order('name').then(r => r.data || [], () => []);
      ((await FY.q('member').select('nickname,character_id').not('character_id', 'is', null).then(r => r.data || [], () => [])) || []).forEach(m => { D.holders[m.character_id] = m.nickname; });
    }
  }
  const LIVE = ['open', 'marked_paid', 'disputed'];
  const tkOf = i => i.amount * (i.event_id && events[i.event_id]?.type_key === 'poker' ? 5 : 1);
  const roomOf = i => i.event_id ? (events[i.event_id]?.type_key || 'event') : 'correction';

  // ---- Stats ----
  const pokerPos = (() => {
    const rows = (board && board.rows) || [];
    const r = rows.find(x => x.nickname === subject.nickname);
    return r ? r.rank + ' of ' + rows.length : '—';
  })();
  const allTime = notPublic
    ? D.ious.reduce((s, i) => s + (i.payee_id === subject.id ? tkOf(i) : -tkOf(i)), 0)
    : null;
  const debt = notPublic
    ? D.ious.filter(i => i.payer_id === subject.id && LIVE.includes(i.state)).reduce((s, i) => s + tkOf(i), 0)
    : badge.owes;
  const due = notPublic
    ? D.ious.filter(i => i.payee_id === subject.id && LIVE.includes(i.state)).reduce((s, i) => s + tkOf(i), 0)
    : badge.owed;
  const tkFmt = v => (v < 0 ? '−' : '') + Math.abs(v) + ' tk';

  // ---- Ledger pairs (net per counterparty across all rooms) ----
  function pairs() {
    const by = {};
    for (const i of D.ious) {
      if (!LIVE.includes(i.state)) continue;
      const other = i.payer_id === subject.id ? i.payee_id : i.payer_id;
      const p = by[other] = by[other] || { other, net: 0, parts: {}, theirOpen: [], myOpen: [], anyMarked: false };
      const tk = tkOf(i), room = roomOf(i);
      if (i.payee_id === subject.id) { p.net += tk; p.theirOpen.push(i); if (i.state === 'marked_paid') p.anyMarked = true; }
      else { p.net -= tk; p.myOpen.push(i); }
      p.parts[room] = (p.parts[room] || 0) + (i.payee_id === subject.id ? tk : -tk);
    }
    return Object.values(by).filter(p => p.net !== 0);
  }
  const partsTitle = p => Object.entries(p.parts).map(([r, v]) => `${r} ${v > 0 ? '+' : ''}${v} tk`).join(' · ');
  const revLink = url => /^https:\/\/revolut\.me\/[A-Za-z0-9._-]+$/.test(url || '') ? url : null;

  function ledgerHtml() {
    const ps = pairs();
    const owed = ps.filter(p => p.net > 0), owe = ps.filter(p => p.net < 0);
    const ini = id => `<span class="ini" style="background-image:url('${esc(FY.face(dir[id] || 'hen', 28))}')"></span>`;
    const pm = (other, dir2) => admin ? `<button type="button" class="pmbtn" data-adj="${other}" data-d="${dir2}" aria-label="${dir2 === 'dn' ? 'Minus' : 'Plus'} one">${dir2 === 'dn' ? '−' : '+'}</button>` : '';
    const owedRows = owed.map(p => `<div class="ledrow">${ini(p.other)}<span class="who">${esc(nick(p.other))}</span>
        <span style="display:flex;align-items:center;justify-content:center;gap:6px">${pm(p.other, 'dn')}<span title="${esc(partsTitle(p))}" style="cursor:help;font-variant-numeric:tabular-nums;font-weight:700;color:var(--neon-green-text);white-space:nowrap">+${p.net} tk</span>${pm(p.other, 'up')}</span>
        <button type="button" class="rcv" data-rcv="${p.other}" style="${p.anyMarked ? 'border-color:var(--neon-pink-tube);color:var(--neon-pink-text)' : ''}">${p.anyMarked ? 'Confirm' : 'Received?'}</button></div>`).join('');
    const oweRows = owe.map(p => {
      const link = revLink(dir[p.other]?.revolut_url);
      const payBtn = link
        ? `<a class="paybtn" data-pay="${p.other}" data-amt="${-p.net}" href="${esc(link)}" target="_blank" rel="noopener" title="Opens their Revolut pay page · amount copied">Pay</a>`
        : `<span style="display:flex;flex-direction:column;align-items:center;gap:2px"><a class="paybtn" aria-disabled="true">Pay</a><span style="font-size:var(--fs-xs);color:var(--color-neutral-400);white-space:nowrap">No Revolut link · settle in person</span></span>`;
      return `<div class="ledrow" style="grid-template-columns:28px minmax(0,1fr) auto auto">${ini(p.other)}<span class="who">${esc(nick(p.other))}</span>
        <span style="display:flex;align-items:center;justify-content:center;gap:6px">${pm(p.other, 'dn')}<span title="${esc(partsTitle(p))}" style="cursor:help;font-variant-numeric:tabular-nums;font-weight:700;color:var(--neon-red-text);white-space:nowrap">−${-p.net} tk</span>${pm(p.other, 'up')}</span>
        <span style="display:flex;gap:6px">${payBtn}<button type="button" class="rcv" data-paid="${p.other}" title="Tell ${esc(nick(p.other))} you have paid">Paid</button></span></div>`;
    }).join('');
    // Per-league strip: all-time tk and live owes/owed by room.
    const leagues = [['poker', 'Poker', 'ph ph-club'], ['football', 'Football', 'ph ph-soccer-ball']].map(([key, label, icon]) => {
      const tkAll = D.ious.filter(i => roomOf(i) === key && i.payee_id === subject.id).reduce((s, i) => s + tkOf(i), 0);
      const o = D.ious.filter(i => roomOf(i) === key && LIVE.includes(i.state) && i.payer_id === subject.id).reduce((s, i) => s + tkOf(i), 0);
      const d2 = D.ious.filter(i => roomOf(i) === key && LIVE.includes(i.state) && i.payee_id === subject.id).reduce((s, i) => s + tkOf(i), 0);
      return `<div class="leaguerow"><i class="${icon}" aria-hidden="true" style="color:var(--neon-teal);font-size:20px"></i><span style="font-weight:600;color:#eef7f7">${label}</span>
        <span style="text-align:center;font-weight:700;color:#ffd84a;font-variant-numeric:tabular-nums">${tkAll.toLocaleString('en-GB')} tk</span>
        <span style="text-align:center;font-weight:700;font-variant-numeric:tabular-nums;color:${o ? 'var(--neon-red-text)' : 'var(--color-neutral-400)'}">${o} tk</span>
        <span style="text-align:center;font-weight:700;font-variant-numeric:tabular-nums;color:${d2 ? '#ffb020' : 'var(--color-neutral-400)'}">${d2} tk</span></div>`;
    }).join('');
    return `
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:6px">
        <span class="t-module">${own ? 'Your ledger' : 'Ledger'}</span>
        <span style="font-size:var(--fs-xs);color:var(--color-neutral-400)">Net across all rooms · hover a figure for the breakdown</span></div>
      <div class="ledcols">
        <div class="ledbox"><span class="kicker">Owed to ${own ? 'you' : 'them'}</span>
          <div class="ledrow" style="border-top:0;padding:2px 0 4px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-400)"><span></span><span></span><span></span><span style="text-align:center">Received?</span></div>
          ${owedRows || '<span style="font-size:var(--fs-sm);color:var(--color-neutral-400);padding-top:6px">Nobody owes ' + (own ? 'you' : 'them') + '.</span>'}</div>
        <div class="ledbox"><span class="kicker">${own ? 'You owe' : 'They owe'}</span>
          ${oweRows || '<span style="font-size:var(--fs-sm);color:var(--color-neutral-400);padding-top:6px">' + (own ? 'You owe' : 'They owe') + ' nobody.</span>'}</div>
      </div>
      <div class="leaguerow" style="border-top:0;padding:0 0 6px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#c8f4f2"><span></span><span>League</span><span style="text-align:center">tk</span><span style="text-align:center">${own ? 'You owe' : 'They owe'}</span><span style="text-align:center"><span class="fy-full">Owed to ${own ? 'you' : 'them'}</span><span class="fy-abbr">Owed</span></span></div>
      ${leagues}`;
  }

  // ---- Recent actions ----
  function actsHtml() {
    const rows = scores.filter(s => s.event_id && events[s.event_id] && !events[s.event_id].voided_at).slice(0, 12).map(s => {
      const e = events[s.event_id];
      const icon = { poker: 'ph ph-club', football: 'ph ph-soccer-ball' }[e.type_key] || 'ph ph-spade';
      const d = new Date(e.played_at);
      const what = e.type_key === 'poker' ? (s.reason === 'result' ? 'Poker night · won the pot' : 'Poker · correction') : e.type_key;
      return { d, icon, what, note: e.note, res: (s.points > 0 ? '+' : '') + s.points + ' tk' };
    });
    return `<span class="t-module" style="padding-bottom:6px">Recent actions</span>
      <div class="acthead" style="padding:0 0 6px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fy-text-label)"><span></span><span>Date</span><span>Action</span><span>Result</span></div>
      ${rows.map(r => `<div style="border-top:1px solid rgba(95,211,207,.22)"><div class="actrow" role="button" tabindex="0" data-roll="1" style="padding:8px 0;font-size:var(--fs-sm);cursor:${r.note ? 'pointer' : 'default'};border-radius:6px">
        <i class="${r.icon}" aria-hidden="true" style="color:var(--neon-teal);font-size:18px"></i>
        <span>${r.d.getDate()} ${r.d.toLocaleString('en-GB', { month: 'short' })}</span>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.what)}</span>
        <span style="font-weight:700;color:${r.res.startsWith('+') ? 'var(--neon-green-text)' : 'var(--neon-red-text)'}">${r.res}</span></div>
        ${r.note ? `<div hidden style="padding:0 0 8px 34px;font-size:var(--fs-xs);color:var(--fy-text-label)">${esc(r.note)}</div>` : ''}</div>`).join('')
      || '<span style="padding-top:6px;font-size:var(--fs-sm);color:var(--fy-text-label)">Nothing in the yard yet.</span>'}`;
  }

  // ---- Header, icon, pools, links ----
  const face150 = m => FY.face(m, 150);
  const headerHtml = () => `
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px">
      <div role="img" aria-label="Character" style="width:160px;height:160px;background:url('${esc(face150(subject))}') center / contain no-repeat;filter:drop-shadow(0 0 10px rgba(224,21,127,.55));flex:none"></div>
      <div style="display:flex;flex-direction:column;gap:4px;flex:1 1 200px;min-width:0">
        <div id="hdr-name" style="font-family:var(--font-heading);font-size:var(--fs-h2);letter-spacing:-.01em;color:#eef7f7;overflow-wrap:anywhere">${esc(subject.nickname)}</div>
        <div id="hdr-tag" style="font-size:var(--fs-sm);font-style:italic;line-height:1.4;color:${subject.tagline ? 'var(--neon-pink-text)' : 'var(--fy-text-label)'}">${esc(subject.tagline || (notPublic ? 'No tagline yet. Say something.' : ''))}</div>
        ${subject.birth_day && subject.birth_month ? `<div style="font-size:var(--fs-xs);color:var(--fy-text-label)"><i class="ph ph-cake" style="color:var(--neon-pink-text)"></i> ${subject.birth_day} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][subject.birth_month - 1]}</div>` : ''}
      </div>
      ${notPublic ? `<div style="display:flex;flex-direction:column;gap:8px">
        <label style="display:flex;flex-direction:column;gap:4px;font-size:var(--fs-xs);color:var(--color-neutral-400)">Yard name<input class="input" id="ed-name" value="${esc(subject.nickname)}" maxlength="16" style="min-height:40px"></label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:var(--fs-xs);color:var(--color-neutral-400)"><span style="display:flex;justify-content:space-between;gap:8px"><span>Tagline</span><span id="tagleft"></span></span><input class="input" id="ed-tag" value="${esc(subject.tagline || '')}" maxlength="60" placeholder="e.g. Here for the beans" style="min-height:40px"></label>
        <button type="button" id="ed-save" class="btn btn-primary" style="align-self:flex-start;min-height:36px;padding:0 16px;white-space:nowrap">Done</button></div>` : ''}
    </div>`;

  // All 15 slots of the animal this member holds, as a 5 × 3 grid. A filled slot shows its picture
  // and can be picked; an empty one is a dim numbered teal ring. Never animals, never letters.
  const bySlot = {}; D.logos.forEach(l => bySlot[l.slot] = l);
  const curSlot = subject.icon_slot && bySlot[subject.icon_slot] ? subject.icon_slot
    : (D.logos.find(l => l.url === subject.avatar_url) || {}).slot || null;
  const ICON_TAGLINE = 'Pick the face the yard sees.';
  const iconHtml = () => `<div style="display:flex;flex-direction:column;gap:3px"><span class="t-module">${own ? 'Your icon' : 'Icon'}</span><span class="t-tagline">${ICON_TAGLINE}</span></div>
    <div class="icongrid">
      ${Array.from({ length: 15 }, (_, k) => {
        const n = k + 1, r = bySlot[n];
        if (!r) return `<span class="iconslot empty" aria-hidden="true">${n}</span>`;
        return `<button type="button" class="iconslot ${n === curSlot ? 'on' : ''}" data-pick="slot:${n}" aria-label="Icon ${n}" aria-pressed="${n === curSlot ? 'true' : 'false'}" style="background-image:url('${esc(r.url)}')"></button>`;
      }).join('')}
    </div>
    <span style="font-size:var(--fs-xs);color:var(--fy-text-label)">${subject.character_id
      ? (D.logos.length ? 'These belong to your animal. An admin uploads them in Admin → Icon palette; pick one here.'
                        : 'No pictures in this animal&rsquo;s set yet. An admin uploads them in Admin → Icon palette.')
      : 'No animal yet, so no icons. An admin gives you one in Admin → Members.'}</span>`;

  const charHtml = () => `<span class="t-module">Your animal</span>
    <select class="input" id="char-sel" aria-label="Your animal" style="min-height:44px;max-width:320px">
      <option value="">None</option>
      ${D.chars.map(c => { const by = D.holders[c.id], mine = c.id === subject.character_id, gone = by && !mine;
        return `<option value="${c.id}" ${mine ? 'selected' : ''} ${gone ? 'disabled style="color:#777"' : ''}>${esc(c.name)}${gone ? ' (taken)' : ''}</option>`; }).join('')}
    </select><span style="font-size:var(--fs-xs);color:var(--fy-text-label)">One animal each. A greyed animal belongs to someone else; ask an admin to free it.</span>`;

  const poolsHtml = () => `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span class="t-module">My football pools</span>
      <a href="room.html?room=football" style="font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--neon-teal);text-decoration:none">Open Football</a></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start">
      <div style="display:flex;flex-direction:column;gap:8px;min-width:0"><span class="kicker">Current</span><span style="font-size:var(--fs-sm);color:var(--color-neutral-400)">No open pools. Call a score on the Football page to join one.</span></div>
      <div style="display:flex;flex-direction:column;gap:8px;min-width:0"><span class="kicker">Closed · results</span><span style="font-size:var(--fs-sm);color:var(--color-neutral-400)">Nothing settled yet.</span></div>
    </div>`;

  const linksHtml = () => {
    const rev = subject.revolut_url || '';
    return `<span class="t-module">Linked accounts</span>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="linked" style="display:flex;gap:12px;align-items:center"><i class="ph ph-discord-logo" style="font-size:22px;color:var(--neon-teal)"></i><div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:14px">Discord</span><span style="font-size:12px;color:var(--fy-text-label)">The key to the door · Lounge voice</span></div><span class="neon-teal" style="font-size:12px">Connected</span></div>
        <div class="rule-teal"></div>
        <form id="revform" style="display:flex;flex-direction:column;gap:8px">
          <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fy-text-label)"><span style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fy-text)"><i class="ph ph-hand-coins" style="font-size:20px;color:var(--neon-teal)"></i>Revolut pay-me link</span>
          <input class="input" id="rv" type="url" value="${esc(rev)}" maxlength="120" placeholder="https://revolut.me/yourname" style="min-height:44px;font-size:14px"></label>
          <span style="font-size:12px;color:var(--fy-text-label)">When you win, anyone who owes you gets a Pay button that opens this link. 1 tk = £1. The Farmyard never holds money.</span>
          <div><button class="btn btn-ghost" type="submit" style="min-height:40px">Save link</button></div>
        </form>
        <div style="display:flex;gap:12px;align-items:center;opacity:.55"><i class="ph ph-game-controller" style="font-size:22px;color:var(--neon-teal)"></i><div style="flex:1;display:flex;flex-direction:column"><span style="font-size:14px">Steam ID</span><span style="font-size:12px;color:var(--fy-text-label)">For Worms and other Steam lobbies in the Arcade.</span></div><span class="kicker">Coming soon</span></div>
        <div style="display:flex;gap:12px;align-items:center;opacity:.55"><i class="ph ph-strategy" style="font-size:22px;color:var(--neon-teal)"></i><div style="flex:1;display:flex;flex-direction:column"><span style="font-size:14px">Chess.com username</span><span style="font-size:12px;color:var(--fy-text-label)">Your games count towards the chess league.</span></div><span class="kicker">Coming soon</span></div>
      </div>`;
  };

  // ---- Compose the page ----
  main.innerHTML = `
    ${admin ? `<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px;padding:10px 14px;border:2px solid var(--neon-pink-tube);border-radius:10px;box-shadow:var(--glow-pink)"><i class="ph ph-shield-check" style="color:var(--neon-pink-text)"></i><span style="font-size:var(--fs-sm);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--neon-pink-text);white-space:nowrap">Admin view · editing ${esc(subject.nickname)}</span><span style="flex:1"></span><a href="admin.html" style="font-size:var(--fs-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5fd3cf;text-decoration:none">← Back to admin</a></div>` : ''}
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div class="fy-pagehead"><h2 class="t-title-b">Profile</h2><span class="t-tagline">${own ? 'Who you are in the yard.' : esc(subject.nickname) + ' · as the yard sees them.'}</span></div><div style="flex:1"></div>
    </div>
    <div class="pcard" id="hdr">${headerHtml()}</div>
    ${notPublic ? `<div class="pcard" id="icon">${iconHtml()}</div>` : ''}
    <div class="statgrid">
      <div class="stat"><span class="kicker">Poker league position</span><span class="v"><i class="ph ph-club" aria-hidden="true"></i>${esc(pokerPos)}</span></div>
      <div class="stat"><span class="kicker">Football league</span><span class="v"><i class="ph ph-soccer-ball" aria-hidden="true"></i>—</span></div>
      <div class="stat"><span class="kicker">All time net</span><span class="v" style="color:${(allTime ?? 0) < 0 ? 'var(--neon-red-text)' : 'var(--neon-green-text)'}">${allTime === null ? '—' : tkFmt(allTime)}</span></div>
      <div class="stat"><span class="kicker">Current debt</span><span class="v" style="color:${debt ? 'var(--neon-red-text)' : 'inherit'}">${debt} tk</span></div>
      <div class="stat"><span class="kicker">Pending due</span><span class="v" style="color:${due ? '#ffb020' : 'inherit'}">${due} tk</span></div>
    </div>
    ${own && D.chars.length ? `<div class="pcard" id="char">${charHtml()}</div>` : ''}
    ${notPublic ? `<div class="pcard" id="ledger">${ledgerHtml()}</div>` : ''}
    ${notPublic ? `<div class="pcard" id="pools">${poolsHtml()}</div>` : ''}
    <div class="pcard" id="acts">${actsHtml()}</div>
    ${notPublic ? `<div class="pcard" id="links">${linksHtml()}</div>` : ''}
    ${own ? `<form class="pcard" id="claim" style="gap:12px">
      <span class="t-module">Something wrong?</span>
      <div class="field"><label for="ctype">Claim</label><select id="ctype" class="input"><option value="points">Points I should have</option><option value="iou">An IOU that is missing</option></select></div>
      <div class="field" id="f-points"><label for="cpts">Poker points</label><input class="input" id="cpts" type="number" min="1" value="1"></div>
      <div class="field" id="f-iou" hidden><label for="cpayer">Who owes whom</label>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select id="cpayer" class="input">${members.map(m => `<option value="${esc(m.id)}">${esc(m.nickname)}</option>`).join('')}</select><span>owes</span>
        <select id="cpayee" class="input">${members.map(m => `<option value="${esc(m.id)}">${esc(m.nickname)}</option>`).join('')}</select><input class="input" id="camt" type="number" min="1" value="1" style="width:5em"></div></div>
      <div class="field"><label for="cnote">What happened</label><input class="input" id="cnote" required placeholder="e.g. side pot on the 12th"></div>
      <div><button class="btn btn-ghost" style="min-height:44px">Send to RAY</button></div>
    </form>
    <div style="display:flex;justify-content:flex-end"><button type="button" id="out" class="btn btn-ghost">Leave the yard</button></div>` : ''}`;

  // ---- Wiring ----
  const saveSubject = async patch => {
    if (admin) {
      for (const [f, v] of Object.entries(patch)) await FY.rpc('admin_set_member', { p_member: subject.id, p_field: f, p_value: v });
    } else {
      const { error } = await FY.q('member').update(patch).eq('id', subject.id);
      if (error) throw new Error(/unique|duplicate/i.test(error.message) ? 'That yard name is taken.' : error.message);
    }
  };
  if (notPublic) {
    main.querySelector('#ed-save').addEventListener('click', async ev => {
      const name = main.querySelector('#ed-name').value.trim(), tag = main.querySelector('#ed-tag').value.trim();
      if (!name) return FY.toast("Yard name can't be blank");
      const patch = {};
      if (name !== subject.nickname) patch.nickname = name;
      if (tag !== (subject.tagline || '')) patch.tagline = tag || null;
      if (!Object.keys(patch).length) return FY.toast('Nothing changed.');
      ev.target.disabled = true;
      try { await saveSubject(admin ? Object.fromEntries(Object.entries(patch).map(([k, v]) => [k, v ?? ''])) : patch); FY.toast('Saved.'); location.reload(); }
      catch (e) { FY.toast(e.message); ev.target.disabled = false; }
    });
    main.querySelector('#icon').addEventListener('click', async ev => {
      const b = ev.target.closest('[data-pick]'); if (!b) return;
      const n = Number(b.dataset.pick.slice(5));
      try {
        if (admin) await FY.rpc('admin_icon_set', { p_member: subject.id, p_slot: n });
        else await FY.rpc('set_my_icon', { p_slot: n });
        FY.toast('Icon saved.'); location.reload();
      } catch (e) { FY.toast(e.message); }
    });
    const cs = main.querySelector('#char-sel');
    if (cs) cs.addEventListener('change', async () => {
      cs.disabled = true;
      try { await FY.rpc('set_my_character', { p_id: cs.value ? Number(cs.value) : null }); FY.toast('Animal saved.'); location.reload(); }
      catch (e) { FY.toast(e.message); location.reload(); }
    });
    // Ledger: Received? / Paid / Pay (copies the amount) / admin ±
    main.querySelector('#ledger').addEventListener('click', async ev => {
      const rcv = ev.target.closest('[data-rcv]'), paid = ev.target.closest('[data-paid]'),
            pay = ev.target.closest('a[data-pay]'), adj = ev.target.closest('[data-adj]');
      try {
        if (pay) { try { await navigator.clipboard.writeText(pay.dataset.amt); FY.toast(pay.dataset.amt + ' tk copied. Paste it in Revolut.'); } catch (e) {} return; }
        if (rcv) {
          if (rcv.dataset.armed !== '1') { rcv.dataset.armed = '1'; const t = rcv.textContent; rcv.textContent = 'Tap again'; setTimeout(() => { rcv.dataset.armed = ''; rcv.textContent = t; }, 5000); return; }
          rcv.disabled = true;
          const list = D.ious.filter(i => i.payer_id === rcv.dataset.rcv && i.payee_id === subject.id && LIVE.includes(i.state));
          for (const i of list) await FY.rpc('iou_transition', { p_iou: i.id, p_to: 'confirmed' });
          FY.toast('Confirmed. Squared.'); location.reload(); return;
        }
        if (paid) {
          paid.disabled = true;
          const list = D.ious.filter(i => i.payee_id === paid.dataset.paid && i.payer_id === subject.id && i.state === 'open');
          for (const i of list) await FY.rpc('iou_transition', { p_iou: i.id, p_to: 'marked_paid' });
          FY.toast('Marked paid. Waiting for their tick.'); location.reload(); return;
        }
        if (adj && admin) {
          const other = adj.dataset.adj, down = adj.dataset.d === 'dn';
          // + moves the net 1 tk towards the subject, − away; one audited correction row each tap.
          const [payer, payee] = down ? [subject.id, other] : [other, subject.id];
          await FY.rpc('admin_add_iou', { p_payer: payer, p_payee: payee, p_tk: 1, p_note: 'admin adjust (profile)' });
          FY.toast('Adjusted 1 tk. Logged.'); location.reload();
        }
      } catch (e) { FY.toast(e.message); }
    });
    main.querySelector('#revform').addEventListener('submit', async ev => {
      ev.preventDefault();
      const rv = main.querySelector('#rv').value.trim() || null;
      if (rv && !/^https:\/\/revolut\.me\/[A-Za-z0-9._-]+$/.test(rv)) return FY.toast('Revolut link must be exactly https://revolut.me/yourname');
      try {
        if (admin) await FY.rpc('admin_set_member', { p_member: subject.id, p_field: 'revolut_url', p_value: rv || '' });
        else await FY.rpc('set_my_links', { p_links: rv ? [{ provider: 'revolut', handle: rv, enabled: true }] : [] });
        FY.toast('Saved.');
      } catch (e) { FY.toast(e.message); }
    });
  }
  main.querySelector('#acts').addEventListener('click', ev => {
    const r = ev.target.closest('[data-roll]'); if (!r) return;
    const d = r.nextElementSibling; if (d) d.hidden = !d.hidden;
  });
  if (own) {
    const ctype = main.querySelector('#ctype');
    ctype.addEventListener('change', () => { main.querySelector('#f-points').hidden = ctype.value !== 'points'; main.querySelector('#f-iou').hidden = ctype.value !== 'iou'; });
    main.querySelector('#claim').addEventListener('submit', async ev => {
      ev.preventDefault();
      const note = main.querySelector('#cnote').value.trim();
      const payload = ctype.value === 'points'
        ? { type: 'points', type_key: 'poker', points: Number(main.querySelector('#cpts').value), note }
        : { type: 'iou', payer_id: main.querySelector('#cpayer').value, payee_id: main.querySelector('#cpayee').value, amount: Number(main.querySelector('#camt').value), note };
      if (payload.type === 'iou' && payload.payer_id === payload.payee_id) return FY.toast('Pick two different people.');
      const btn = ev.submitter || ev.target.querySelector('button'); btn.disabled = true;
      try { await FY.rpc('raise_claim', { p_payload: payload }); FY.toast('Sent. RAY will approve or reject it.'); ev.target.reset(); ctype.dispatchEvent(new Event('change')); }
      catch (e) { FY.toast(e.message); }
      finally { btn.disabled = false; }
    });
    main.querySelector('#out').addEventListener('click', () => Barn.signOut());
  }
  const tagleft = main.querySelector('#tagleft'), edTag = main.querySelector('#ed-tag');
  if (tagleft && edTag) { const upd = () => tagleft.textContent = (60 - edTag.value.length) + ' left'; edTag.addEventListener('input', upd); upd(); }
  if (location.hash === '#settle') main.querySelector('#ledger')?.scrollIntoView();
})().catch(e => FY.toast(e.message));
</script>
</body>
</html>
